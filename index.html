<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thalesis - Portal Oficial</title>
    <style>
        /* ESTILO SEINEN PRO - OSCURO, AGRESIVO Y MODERNO */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at top, #150b00 0%, #050505 70%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 750px;
            text-align: center;
            padding: 50px 0 25px 0;
            border-bottom: 2px solid #1a1a1a;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 4rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.6), 0 0 20px rgba(255, 102, 0, 0.3);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(255, 102, 0, 0.5); }
            100% { text-shadow: 0 0 25px rgba(255, 102, 0, 0.8), 0 0 5px #ff6600; }
        }

        main {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        #seccion-info {
            width: 100%;
            background: linear-gradient(135deg, #0e0e0e 0%, #070707 100%);
            border: 1px solid #ff6600;
            box-shadow: 0 4px 20px rgba(255, 102, 0, 0.15);
            padding: 20px;
            text-align: center;
            border-radius: 6px;
        }

        #seccion-info h2 {
            font-size: 1.1rem;
            color: #ff6600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #seccion-info img {
            max-width: 100%;
            height: auto;
            border: 2px solid #1a1a1a;
            border-radius: 4px;
        }

        .lista-capitulos {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        .capitulo-contenedor {
            background: #0d0d0d;
            border: 1px solid #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .capitulo-contenedor:hover {
            border-color: #ff6600;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.2);
            transform: translateY(-2px);
        }

        .capitulo-cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            cursor: pointer;
            user-select: none;
            background: linear-gradient(to right, #0d0d0d, #141414);
        }

        .cabecera-izquierda {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .capitulo-miniatura {
            width: 55px;
            height: 75px;
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: transform 0.3s;
        }

        .capitulo-contenedor:hover .capitulo-miniatura {
            transform: scale(1.05);
            border-color: #ff6600;
        }

        .capitulo-titulo {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e0e0e0;
            transition: color 0.3s;
        }

        .capitulo-contenedor:hover .capitulo-titulo {
            color: #ffffff;
        }

        .flecha-icono {
            font-size: 1.2rem;
            color: #555555;
            transition: all 0.3s;
        }

        .capitulo-contenedor.abierto {
            border-color: #ff6600;
        }

        .capitulo-contenedor.abierto .capitulo-cabecera {
            background: #111111;
            border-bottom: 1px solid #1a1a1a;
        }

        .capitulo-contenedor.abierto .flecha-icono {
            transform: rotate(180deg);
            color: #ff6600;
            text-shadow: 0 0 8px #ff6600;
        }

        .capitulo-paginas {
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: #000000;
            padding: 15px 0;
        }

        .capitulo-paginas img {
            width: 100%;
            max-width: 100%; 
            height: auto;
            display: block;
            margin-bottom: 0;
            background-color: #000000;
            animation: fadeInPage 0.6s ease-in-out;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            width: 100%;
            max-width: 750px;
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid #1a1a1a;
            margin-top: auto;
        }

        footer p {
            font-size: 0.85rem;
            color: #555555;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .redes-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .redes-links a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 24px;
            border: 1px solid #222222;
            border-radius: 4px;
            background: #0a0a0a;
            transition: all 0.2s ease;
        }

        .redes-links a:hover {
            color: #ffffff;
            border-color: #ff6600;
            background: #ff6600;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.8rem; letter-spacing: 3px; }
            .capitulo-titulo { font-size: 1.2rem; }
            .capitulo-miniatura { width: 45px; height: 60px; gap: 12px; }
            .capitulo-cabecera { padding: 12px 16px; }
            .redes-links a { padding: 8px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Thalesis</h1>
    </header>

    <main>
        <section id="seccion-info">
            <h2>Última Actualización / Información</h2>
            <img src="info/reciente.png" alt="Información Reciente" onerror="this.parentNode.style.display='none';">
        </section>

        <section class="lista-capitulos" id="contenedor-manga"></section>
    </main>

    <footer>
        <p>© Thalesis - Todos los derechos reservados</p>
        <div class="redes-links">
            <a href="https://youtube.com" target="_blank">YouTube</a>
            <a href="https://tiktok.com" target="_blank">TikTok</a>
        </div>
    </footer>

    <script>
        async function cargarManga() {
            try {
                // Volvemos a la ruta limpia que sí te abría la barra
                const respuesta = await fetch('manga-data.json');
                const datos = await respuesta.json();
                const contenedor = document.getElementById('contenedor-manga');

                datos.capitulos.forEach(cap => {
                    const capDiv = document.createElement('div');
                    capDiv.className = 'capitulo-contenedor';

                    // Corregido: Traduce el espacio y la tilde correctamente para el servidor
                    const folder = encodeURIComponent(cap.carpeta);
                    const filePortada = encodeURIComponent("Página 01.png");
                    const rutaPortada = `${folder}/${filePortada}`;

                    capDiv.innerHTML = `
                        <div class="capitulo-cabecera" onclick="toggleCapitulo(this)">
                            <div class="cabecera-izquierda">
                                <img src="${rutaPortada}" class="capitulo-miniatura" alt="Miniatura" onerror="if(this.src.includes('.png')) this.src=this.src.replace('.png', '.PNG');">
                                <span class="capitulo-titulo">${cap.titulo}</span>
                            </div>
                            <div class="flecha-icono">▼</div>
                        </div>
                        <div class="capitulo-paginas"></div>
                    `;

                    const divPaginas = capDiv.querySelector('.capitulo-paginas');

                    for (let i = 1; i <= cap.totalPaginas; i++) {
                        const numeroPagina = String(i).padStart(2, '0');
                        const img = document.createElement('img');
                        
                        // Corregido: Traduce de forma segura cada panel
                        const nombreArchivo = encodeURIComponent(`Página ${numeroPagina}.png`);
                        img.setAttribute('data-src', `${folder}/${nombreArchivo}`);
                        img.alt = `Página ${numeroPagina}`;
                        img.loading = "lazy";
                        
                        img.setAttribute('onerror', "if(this.src.includes('.png')) this.src=this.src.replace('.png', '.PNG');");
                        
                        divPaginas.appendChild(img);
                    }

                    contenedor.appendChild(capDiv);
                });

            } catch (error) {
                console.log("Error cargando el archivo JSON...", error);
            }
        }

        function toggleCapitulo(cabecera) {
            const contenedor = cabecera.parentElement;
            const cuerpoPaginas = contenedor.querySelector('.capitulo-paginas');
            
            contenedor.classList.toggle('abierto');

            if (contenedor.classList.contains('abierto')) {
                cuerpoPaginas.style.display = 'flex';
                const imagenes = cuerpoPaginas.querySelectorAll('img');
                imagenes.forEach(img => {
                    if(img.getAttribute('data-src')) {
                        img.src = img.getAttribute('data-src');
                        img.removeAttribute('data-src');
                    }
                });
            } else {
                cuerpoPaginas.style.display = 'none';
            }
        }

        window.onload = cargarManga;
    </script>
</body>
</html>
