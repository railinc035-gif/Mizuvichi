<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x: hidden;
}

header{
    position: relative; 
    text-align:center;
    padding:30px 15px;
    border-bottom:2px solid #300000; 
    transition: all 0.4s ease;
}

header h1{
    font-size:3rem;
    color:#888; 
    transition: all 0.4s ease;
}

header:hover, header:active {
    border-bottom:2px solid #ff0000;
    box-shadow:0 0 20px #ff0000;
}

header:hover h1, header:active h1 {
    color:#fff;
    text-shadow:0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #b30000;
}

.counters-wrapper {
    position: absolute;
    top: 15px;
    right: 20px;
}

.global-counter {
    font-size: 0.9rem;
    background: #0a0a0a;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
    color: #666;
}

.online-counter {
    position: absolute;
    bottom: 10px;
    left: 20px;
    font-size: 0.75rem;
    background: rgba(0, 255, 102, 0.05);
    padding: 4px 10px;
    border-radius: 30px;
    border: 1px solid rgba(0, 255, 102, 0.3);
    display: flex;
    align-items: center;
    gap: 5px;
    color: #00ff66;
    transition: all 0.3s ease;
    z-index: 10;
}

header:hover .global-counter, header:active .global-counter {
    color: #ff0000;
    border-color: #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
}

header:hover .online-counter, header:active .online-counter {
    border-color: #00ff66;
    background: rgba(0, 255, 102, 0.1);
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

.section{
    width:95%;
    max-width:1000px;
    margin:25px auto;
}

.info-box {
    border: none;
    border-radius: 12px;
    overflow: hidden;
    background: #050505;
    padding: 10px;
    transition: all 0.4s ease;
}

.aviso-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 0 auto 70px auto; 
    display: flex;
    flex-direction: column;
    align-items: center;
}

.info-box img {
    width: 100%;
    max-width: 390px;
    margin: 0 auto;
    display: block;
    border-radius: 8px;
    image-rendering: -webkit-optimize-contrast;
    backface-visibility: hidden;
    transform: translateZ(0);
}

.badge-nuevo {
    align-self: flex-start;
    margin-bottom: 5px;
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 0.8rem;
    padding: 5px 12px;
    border-radius: 6px;
    text-transform: uppercase;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.5); 
    z-index: 10;
    letter-spacing: 1px;
    cursor: pointer;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 2.2rem;
    }
    .counters-wrapper {
        position: static;
        margin-top: 15px;
        display: flex;
        justify-content: center;
    }
    .online-counter {
        position: static;
        margin-top: 10px;
    }
    header {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .viewer-nav h3 {
        font-size: 1rem;
        max-width: 40%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .viewer-btn {
        padding: 8px 12px;
        font-size: 0.8rem;
    }
}

.chapter{
    border:2px solid #300000; 
    border-radius:12px;
    margin-bottom:20px;
    overflow:hidden;
    transition: all 0.3s ease; 
}

.chapter:hover, .chapter:active {
    border-color: #ff0000;
    box-shadow: 0 0 20px #ff0000;
    transform: translateY(-2px); 
}

.chapter-header{
    padding:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#111;
    transition: background 0.3s;
}

.chapter-header:hover {
    background:#1a1a1a;
}

.chapter-left{
    display:flex;
    gap:15px;
    align-items:center;
}

.chapter-thumb{
    width:70px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.chapter-views {
    font-size: 0.85rem;
    color: #888;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
}

#viewer-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 9999;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
}

.viewer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: rgba(10, 10, 10, 0.95);
    position: sticky;
    top: 0;
    border-bottom: 2px solid #ff0000;
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    transition: top 0.3s ease; 
}

.viewer-nav.hidden {
    top: -80px; 
}

.viewer-btn {
    background: #111;
    color: #fff;
    border: 1px solid #ff0000;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: 0.2s;
}

.viewer-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 10px #ff0000;
}

.viewer-btn:disabled {
    border-color: #333;
    color: #555;
    background: #0a0a0a;
    cursor: not-allowed;
    box-shadow: none;
}

.viewer-content {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 10px;
}

.viewer-page-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 0.707;
    background: #0a0a0a;
    margin-bottom: 30px; 
    border-radius: 6px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); 
    border: 1px solid #111; 
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.viewer-page-wrapper img {
    width: 100%;
    height: auto;
    display: block;
    opacity: 0;
    transition: opacity 0.3s ease;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
}

.viewer-page-wrapper img.loaded {
    opacity: 1;
}

.loading-spinner {
    position: absolute;
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 0, 0, 0.1);
    border-left-color: #ff0000;
    border-radius: 50%;
    animation: spin-loader 1s linear infinite;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

@keyframes spin-loader {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* COMENTARIOS */
.comments-section {
    max-width: 800px;
    margin: 40px auto 60px auto;
    padding: 20px 15px;
    background: #0a0a0a;
    border-top: 2px solid #300000;
    border-radius: 12px;
    position: relative;
}

.comments-section h4 {
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 20px;
    border-left: 4px solid #ff0000;
    padding-left: 10px;
}

.comment-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 30px;
}

.comment-form input, .comment-form textarea {
    background: #111;
    border: 1px solid #300000;
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: Arial, sans-serif;
    outline: none;
    transition: border-color 0.3s;
}

.comment-form input:focus, .comment-form textarea:focus {
    border-color: #ff0000;
    box-shadow: 0 0 8px rgba(255, 0, 0, 0.2);
}

.comment-form textarea {
    resize: vertical;
    min-height: 80px;
}

.comment-submit-btn {
    align-self: flex-end;
    background: #111;
    color: #fff;
    border: 1px solid #ff0000;
    padding: 10px 25px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: all 0.3s;
}

.comment-submit-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 15px #ff0000;
}

.comments-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.comment-card {
    background: #111;
    border: 1px solid #200000;
    padding: 15px;
    border-radius: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: opacity 0.3s ease;
}

.comment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.comment-author-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
}

.comment-author {
    font-weight: bold;
    color: #ff0000;
    font-size: 0.95rem;
}

.comment-author.es-respuesta {
    color: #00ff66;
}

.comment-date {
    font-size: 0.8rem;
    color: #666;
}

.badge-autor {
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    box-shadow: 0 0 15px #00ff66;
    letter-spacing: 0.5px;
}

.comment-text {
    color: #ddd;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
}

.comment-actions {
    display: flex;
    gap: 15px;
    align-items: center;
    margin-top: 5px;
}

.action-btn {
    background: none;
    border: none;
    color: #aaa; 
    cursor: pointer;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
}

.reactions-container {
    display: flex;
    gap: 8px;
    align-items: center;
    background: #151515;
    padding: 4px 8px;
    border-radius: 20px;
    border: 1px solid #222;
}

.reaction-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-radius: 12px;
    transition: all 0.2s ease;
    color: #888;
}

.reaction-btn:hover {
    background: #252525;
    transform: scale(1.15);
}

.reaction-btn.reacted {
    background: rgba(255, 0, 0, 0.15);
    border: 1px solid rgba(255, 0, 0, 0.3);
    color: #fff;
}

.action-btn.delete-btn {
    display: none; 
    color: #aaa;
    padding: 4px 8px;
    border-radius: 4px;
}

.action-btn.delete-btn:hover {
    color: #fff;
    background: #b30000;
}

.comment-card.es-mio .action-btn.delete-btn {
    display: inline-flex; 
}

.reply-context {
    background: #1a1a1a;
    border-left: 3px solid #ff0000;
    padding: 8px 12px;
    margin-bottom: 10px;
    border-radius: 4px;
    font-size: 0.85rem;
    color: #888;
}

.reply-context b {
    color: #00ff66;
}

.reply-indicator {
    display: none;
    background: #1a1a1a;
    border-left: 4px solid #00ff66;
    padding: 10px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    align-items: center;
    justify-content: space-between;
}

.reply-indicator.active {
    display: flex;
}

.reply-info {
    font-size: 0.9rem;
    color: #aaa;
}

.reply-info b {
    color: #00ff66;
}

.cancel-reply-btn {
    background: none;
    border: none;
    color: #ff4444;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 5px;
}

.social{
    text-align:center;
    margin:40px 0;
}

.social a{
    color:#888;
    text-decoration:none;
    font-size:1.3rem;
    margin:0 25px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: 0.3s;
}

.social a:hover, .social a:active{
    color: #ff0000;
    text-shadow: 0 0 10px #ff0000;
}

.tabs-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 30px auto 20px auto;
    width: 95%;
    max-width: 1000px;
}

.tab-btn {
    background: #111;
    color: #888;
    border: 2px solid #200000;
    padding: 10px 25px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tab-btn:hover {
    color: #fff;
    border-color: #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
}

.tab-btn.active[data-tab="manga"] {
    background: #ff0000;
    color: #000;
    border-color: #ff0000;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
}

.tab-btn.active[data-tab="one-shot"] {
    background: #00ff66;
    color: #000;
    border-color: #00ff66;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
}

.gallery-section {
    display: none;
    width: 100%;
}

.gallery-section.active {
    display: block;
    animation: fadeIn 0.4s ease;
}

.series-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 15px;
}

.series-card {
    background: #0a0a0a;
    border: 2px solid #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    flex-direction: column;
    position: relative;
}

.series-card:hover {
    transform: translateY(-5px);
    border-color: #ff0000;
    box-shadow: 0 10px 20px rgba(255, 0, 0, 0.2);
}

.series-cover-wrapper {
    position: relative;
    width: 100%;
    padding-top: 140%;
    overflow: hidden;
    background: #050505;
}

.series-cover {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.series-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.85);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: 1px solid #ff0000;
    color: #ff0000;
    z-index: 5;
}

.status-badge {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.status-badge.emision {
    background: rgba(0, 255, 102, 0.1);
    color: #00ff66;
    border: 1px solid #00ff66;
}

.status-badge.pausa {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    border: 1px solid #ffffff;
}

.status-badge.terminado {
    background: rgba(255, 0, 0, 0.1);
    color: #ff0000;
    border: 1px solid #ff0000;
}

.series-info {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-grow: 1;
}

.series-title {
    font-size: 1.1rem;
    font-weight: bold;
    color: #fff;
    margin: 0;
}

.series-author {
    font-size: 0.8rem;
    color: #888;
}

.series-detail-container {
    display: none;
    width: 95%;
    max-width: 1000px;
    margin: 25px auto;
    animation: fadeIn 0.4s ease;
}

.back-btn-container {
    margin-bottom: 20px;
}

.back-btn {
    background: #111;
    border: 1px solid #333;
    color: #fff;
    font-size: 0.9rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    transition: all 0.2s;
    padding: 8px 16px;
    border-radius: 20px;
}

.back-btn:hover {
    color: #fff;
    background: #222;
    border-color: #ff0000;
}

.series-header-layout {
    display: flex;
    gap: 25px;
    margin-bottom: 30px;
    background: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
    border: 1px solid #1a1a1a;
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
}

.series-detail-poster-wrapper {
    width: 150px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid #222;
}

.series-detail-poster {
    width: 100%;
    display: block;
    aspect-ratio: 0.75;
    object-fit: cover;
}

.series-detail-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
}

.series-detail-title {
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    margin: 0;
}

.series-detail-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.series-detail-author {
    color: #888;
    font-size: 0.9rem;
}

.series-detail-desc {
    color: #ccc;
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 700px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.paypal-social-link {
    display: inline-flex;
    align-items: center;
    gap: 8px; 
    color: inherit; 
    text-decoration: none;
    font-family: inherit;
    font-size: inherit; 
    transition: color 0.2s ease; 
}

.paypal-social-link:hover {
    color: #ff0000 !important; 
}
</style>

<body>

<header>
    <h1>MIZUVICHI</h1>
    
    <div class="counters-wrapper">
        <div class="global-counter" id="contador-global">
            <i class="fas fa-users"></i> <span id="num-global">...</span>
        </div>
    </div>
    <div class="online-counter" id="contador-online">
        <i class="fas fa-circle" style="font-size: 0.4rem; animation: pulse 2s infinite;"></i> 
        <span id="num-online">...</span>
    </div>
</header>

<div class="section" id="aviso-section">
    <div class="info-box" id="aviso-container"></div>
</div>

<div class="section" id="gallery-home-section">
    <div class="tabs-container" id="gallery-tabs">
        <button class="tab-btn active" data-tab="manga">
            <i class="fas fa-book-open"></i> Manga
        </button>
        <button class="tab-btn" data-tab="one-shot">
            <i class="fas fa-magic"></i> One Shot
        </button>
    </div>

    <div id="gallery-container">
        <div class="gallery-section active" id="sec-manga">
            <div class="series-grid" id="grid-manga"></div>
        </div>
        
        <div class="gallery-section" id="sec-one-shot">
            <div class="series-grid" id="grid-one-shot"></div>
        </div>
    </div>
</div>

<div class="series-detail-container" id="series-detail-container">
    <div class="back-btn-container">
        <button class="back-btn" id="btn-back-gallery">
            <i class="fas fa-arrow-left"></i> Volver a la Galería
        </button>
    </div>
    
    <div class="series-header-layout">
        <div class="series-detail-poster-wrapper">
            <img class="series-detail-poster" id="series-poster" src="" alt="Cover">
        </div>
        <div class="series-detail-content">
            <h2 class="series-detail-title" id="series-title">Título de la Serie</h2>
            <div class="series-detail-meta">
                <span class="series-detail-author" id="series-author">Autor: ...</span>
            </div>
            <p class="series-detail-desc" id="series-desc">Descripción...</p>
        </div>
    </div>
    
    <div class="section">
        <h2 id="chapters-section-title">📖 CAPÍTULOS</h2>
        <div id="chapters"></div>
    </div>
</div>

<div id="viewer-container">
    <div class="viewer-nav" id="viewer-nav">
        <button class="viewer-btn" id="btn-prev">◀ Ant</button>
        <h3 id="viewer-title">Capítulo</h3>
        <button class="viewer-btn" id="btn-close">Volver ✕</button>
        <button class="viewer-btn" id="btn-next">Sig ▶</button>
    </div>
    
    <div class="viewer-content" id="viewer-content"></div>

    <div class="viewer-nav" id="viewer-nav-bottom" style="position: static; border-top: 2px solid #ff0000; border-bottom: none; margin-top: 20px;">
        <button class="viewer-btn" id="btn-prev-bottom">◀ Ant</button>
        <h3 id="viewer-title-bottom">Capítulo</h3>
        <button class="viewer-btn" id="btn-close-bottom">Volver ✕</button>

function obtenerUrlCDN(url) {
    if (!url) return "";
    if (url.includes("cdn.jsdelivr.net")) return url;
    if (url.includes("raw.githubusercontent.com")) {
        let nuevoUrl = url.replace("raw.githubusercontent.com", "cdn.jsdelivr.net/gh");
        nuevoUrl = nuevoUrl.replace("/main/", "@main/").replace("/master/", "@master/");
        return nuevoUrl;
    }
    return url;
}

window.calcularTiempoRelativo = function(timestamp) {
    if (!timestamp) return "Hace un momento";
    const ahora = Date.now();
    const diferencia = ahora - timestamp;

    const segundos = Math.floor(diferencia / 1000);
    const minutos = Math.floor(segundos / 60);
    const horas = Math.floor(minutos / 60);
    const dias = Math.floor(horas / 24);

    if (segundos < 60) return "Hace un momento";
    if (minutos < 60) return `Hace ${minutos} ${minutos === 1 ? 'minuto' : 'minutos'}`;
    if (horas < 24) return `Hace ${horas} ${horas === 1 ? 'hora' : 'horas'}`;
    if (dias === 1) return "Ayer";
    if (dias < 7) return `Hace ${dias} días`;
    
    const fechaObj = new Date(timestamp);
    return fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
};

window.cargarComentariosDelCapitulo = function(nombreCap, contenedorHtml, scrollAlFinal = false) {
    if (desvincularEscuchaComentarios) desvincularEscuchaComentarios();

    const refComentarios = ref(database, 'comentarios/' + nombreCap);
    
    desvincularEscuchaComentarios = onValue(refComentarios, (snapshot) => {
        contenedorHtml.innerHTML = "";
        const datos = snapshot.val();
        
        if (!datos) {
            contenedorHtml.innerHTML = `<p style="color:#555; font-size:0.9rem; text-align:center;">Nadie ha comentado aún. ¡Sé el primero!</p>`;
            return;
        }

        const listaOrdenada = Object.keys(datos).reverse();

        let misComentariosGuardados = [];
        try {
            misComentariosGuardados = JSON.parse(localStorage.getItem("mis_comentarios_v3") || "[]");
        } catch(e) { misComentariosGuardados = []; }

        const soyElAutorLogueado = localStorage.getItem("autor_autenticado") === "true";
        const nombreLocalFijo = localStorage.getItem("mi_nombre_fijo");

        listaOrdenada.forEach((idComentario) => {
            const info = datos[idComentario];
            const card = document.createElement("div");
            card.className = "comment-card";
            card.id = "card-" + idComentario;
            
            let esMiComentarioReal = false;
            if (info.esAutor === true) {
                if (soyElAutorLogueado) esMiComentarioReal = true;
            } else {
                if (misComentariosGuardados.includes(idComentario) && nombreLocalFijo === info.autor) {
                    esMiComentarioReal = true;
                }
            }

            if (esMiComentarioReal) {
                card.classList.add("es-mio");
            }

            let badgeAutorHtml = info.esAutor ? `<span class="badge-autor">Autor</span>` : "";
            const textoFecha = window.calcularTiempoRelativo(info.fecha);
            
            let replyContextHtml = "";
            if (info.replyTo) {
                replyContextHtml = `
                    <div class="reply-context">
                        <i class="fas fa-reply fa-rotate-180"></i> Respondiendo a <b>@${escaperHtml(info.replyTo.author)}</b>
                    </div>
                `;
            }

            const emojiTipos = [
                { key: "love", icon: "❤️" },
                { key: "fire", icon: "🔥" },
                { key: "wow", icon: "😮" },
                { key: "haha", icon: "😂" }
            ];

            let reaccionesHtml = `<div class="reactions-container">`;
            emojiTipos.forEach(tipo => {
                const conteo = (info.reacciones && info.reacciones[tipo.key]) || 0;
                const haReaccionado = localStorage.getItem(`reacted_${idComentario}_${tipo.key}`) === "true";
                const claseActiva = haReaccionado ? "reacted" : "";
                reaccionesHtml += `
                    <button class="reaction-btn ${claseActiva}" data-id="${idComentario}" data-key="${tipo.key}" title="Reaccionar">
                        <span>${tipo.icon}</span>
                        <span class="reaction-count">${conteo}</span>
                    </button>
                `;
            });
            reaccionesHtml += `</div>`;

            card.innerHTML = `
                <div class="comment-header">
                    <div class="comment-author-wrapper">
                        <span class="comment-author ${info.replyTo ? 'es-respuesta' : ''}">${escaperHtml(info.autor)}</span>
                        ${badgeAutorHtml}
                        <span class="comment-date">${textoFecha}</span>
                    </div>
                    <button class="action-btn delete-btn" data-id="${idComentario}"><i class="fas fa-trash-alt"></i></button>
                </div>
                ${replyContextHtml}
                <p class="comment-text">${escaperHtml(info.texto)}</p>
                <div class="comment-actions" style="gap: 10px; flex-wrap: wrap;">
                    ${reaccionesHtml}
                    <button class="action-btn reply-btn" data-id="${idComentario}" data-author="${escaperHtml(info.autor)}">
                        <i class="fas fa-comment-dots"></i> Responder
                    </button>
                </div>
            `;

            card.querySelectorAll(".reaction-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const idCom = e.currentTarget.getAttribute("data-id");
                    const keyReac = e.currentTarget.getAttribute("data-key");
                    const haReaccionado = localStorage.getItem(`reacted_${idCom}_${keyReac}`) === "true";
                    const refReac = ref(database, `comentarios/${nombreCap}/${idCom}/reacciones/${keyReac}`);

                    if (!haReaccionado) {
                        localStorage.setItem(`reacted_${idCom}_${keyReac}`, "true");
                        e.currentTarget.classList.add("reacted");
                        runTransaction(refReac, (actual) => (actual || 0) + 1);
                    } else {
                        localStorage.removeItem(`reacted_${idCom}_${keyReac}`);
                        e.currentTarget.classList.remove("reacted");
                        runTransaction(refReac, (actual) => {
                            let nuevoValor = (actual || 0) - 1;
                            return nuevoValor < 0 ? 0 : nuevoValor;
                        });
                    }
                });
            });

            card.querySelector(".delete-btn").addEventListener("click", () => {
                if (confirm("¿Seguro que quieres eliminar tu comentario?")) {
                    remove(ref(database, `comentarios/${nombreCap}/${idComentario}`));
                }
            });

            card.querySelector(".reply-btn").addEventListener("click", (e) => {
                const id = e.currentTarget.getAttribute("data-id");
                const author = e.currentTarget.getAttribute("data-author");
                window.setReplyState(id, author);
            });

            contenedorHtml.appendChild(card);
        });

        if (scrollAlFinal) {
            setTimeout(() => {
                const seccionComentarios = document.getElementById("seccion-comentarios-root");
                if (seccionComentarios) {
                    seccionComentarios.scrollIntoView({ behavior: "smooth" });
                }
            }, 300);
        }
    });
};

window.intentarPublicarComentario = function(nombreCap, autor, texto) {
    let esAutorReal = false;
    const nameLimpio = autor.trim();

    if (nameLimpio === "Raylin AC") {
        if (localStorage.getItem("autor_autenticado") === "true") {
            esAutorReal = true;
        } else {
            const pass = prompt("Contraseña de seguridad:");
            if (pass === CLAVE_SECRETA_AUTOR) {
                esAutorReal = true;
                localStorage.setItem("autor_autenticado", "true"); 
                window.verificarYBloquearNombre(); 
            } else {
                alert("Incorrecta.");
                return; 
            }
        }
    } else if (!localStorage.getItem("mi_nombre_fijo")) {
        localStorage.setItem("mi_nombre_fijo", nameLimpio);
        window.verificarYBloquearNombre();
    }

    const refComentariosReal = ref(database, 'comentarios/' + nombreCap);
    const nuevoComentarioRef = push(refComentariosReal);
    const idNuevoComentario = nuevoComentarioRef.key;

    const dataParaGuardar = {
        autor: esAutorReal ? "Raylin AC" : localStorage.getItem("mi_nombre_fijo"),
        texto: texto,
        likes: 0,
        esAutor: esAutorReal, 
        fecha: serverTimestamp()
    };

    if (replyState.commentId) {
        dataParaGuardar.replyTo = {
            id: replyState.commentId,
            author: replyState.authorName
        };
    }

    set(nuevoComentarioRef, dataParaGuardar).then(() => {
        let misComentarios = JSON.parse(localStorage.getItem("mis_comentarios_v3") || "[]");
        misComentarios.push(idNuevoComentario);
        localStorage.setItem("mis_comentarios_v3", JSON.stringify(misComentarios));
        window.cancelReply();
    });
};

function escaperHtml(texto) {
    if (!texto) return "";
    return texto.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

async function cargarAvisos() {
    const contenedorAvisos = document.getElementById("aviso-container");
    const defaultAvisos = [
        { name: "03.png", download_url: "https://raw.githubusercontent.com/railinc035-gif/Mizuvichi/main/Aviso/03.png" },
        { name: "02.png.png", download_url: "https://raw.githubusercontent.com/railinc035-gif/Mizuvichi/main/Aviso/02.png.png" }
    ];

    function renderizarAvisos(archivos) {
        contenedorAvisos.innerHTML = "";
        const pngs = archivos.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a, b) => b.name.localeCompare(a.name, undefined, {numeric: true}));
        if (pngs.length === 0) { contenedorAvisos.parentElement.style.display = "none"; return; }

        const ultimoAvisoVisto = localStorage.getItem("ultimo_aviso_visto");
        const idUltimoAviso = pngs[0].name;

        pngs.forEach((img, index) => {
            const wrapper = document.createElement("div");
            wrapper.className = "aviso-wrapper";
            if (index === 0 && ultimoAvisoVisto !== idUltimoAviso) {
                const tag = document.createElement("span");
                tag.className = "badge-nuevo";
                tag.innerText = "Nuevo";
                tag.onclick = () => { localStorage.setItem("ultimo_aviso_visto", idUltimoAviso); tag.style.display = "none"; };
                wrapper.appendChild(tag);
            }
            const imageElement = document.createElement("img");
            imageElement.src = obtenerUrlCDN(img.download_url);
            imageElement.loading = "lazy";
            wrapper.appendChild(imageElement);
            contenedorAvisos.appendChild(wrapper);
        });
        contenedorAvisos.parentElement.style.display = "block";
    }

    renderizarAvisos(defaultAvisos);

    try {
        const respuesta = await fetch(`${api}/Aviso`);
        if (respuesta.ok) {
            const archivos = await respuesta.json();
            renderizarAvisos(archivos);
        }
    } catch (error) {}
}
