<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x: hidden;
}

header{
    position: relative; 
    text-align:center;
    padding:30px 15px;
    border-bottom:2px solid #300000; 
    transition: all 0.4s ease;
}

header h1{
    font-size:3rem;
    color:#888; 
    transition: all 0.4s ease;
}

.follow-container {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
    align-items: center;
}

.follow-btn {
    background: #111;
    color: #ffd700;
    border: 1px solid #ffd700;
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
}

.follow-btn:hover {
    background: #ffd700;
    color: #000;
    box-shadow: 0 0 10px #ffd700;
}

.follow-btn.subscribed {
    color: #00ff66;
    border-color: #00ff66;
}

.follow-btn.subscribed:hover {
    background: #00ff66;
    color: #000;
    box-shadow: 0 0 10px #00ff66;
}

.follow-form {
    display: none;
    background: #0a0a0a;
    border: 1px solid #444;
    padding: 15px;
    border-radius: 12px;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: 280px;
    box-shadow: 0 10px 40px rgba(0,0,0,1);
    margin-top: 10px;
    border-top: 2px solid #00ff66;
}

.follow-form.active {
    display: block;
}

.follow-form input {
    width: 100%;
    background: #111;
    border: 1px solid #444;
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 10px;
    outline: none;
}

.follow-form button {
    width: 100%;
    background: #00ff66;
    color: #000;
    border: none;
    padding: 8px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

header:hover, header:active {
    border-bottom:2px solid #ff0000;
    box-shadow:0 0 20px #ff0000;
}

header:hover h1, header:active h1 {
    color:#fff;
    text-shadow:0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #b30000;
}

.counters-wrapper {
    position: absolute;
    top: 15px;
    right: 20px;
}

.global-counter {
    font-size: 0.9rem;
    background: #0a0a0a;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
    color: #666;
}

.online-counter {
    position: absolute;
    bottom: 10px;
    left: 20px;
    font-size: 0.75rem;
    background: rgba(0, 255, 102, 0.05);
    padding: 4px 10px;
    border-radius: 30px;
    border: 1px solid rgba(0, 255, 102, 0.3);
    display: flex;
    align-items: center;
    gap: 5px;
    color: #00ff66;
    transition: all 0.3s ease;
    z-index: 10;
}

header:hover .global-counter, header:active .global-counter {
    color: #ff0000;
    border-color: #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
}

header:hover .online-counter, header:active .online-counter {
    border-color: #00ff66;
    background: rgba(0, 255, 102, 0.1);
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

.section{
    width:95%;
    max-width:1000px;
    margin:25px auto;
}

.info-box {
    border: none;
    border-radius: 12px;
    overflow: hidden;
    background: #050505;
    padding: 10px;
    transition: all 0.4s ease;
}

.info-box:hover, .info-box:active {
    border-color: transparent;
    box-shadow: none;
}

.aviso-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 0 auto 70px auto; 
    display: flex;
    flex-direction: column;
    align-items: center;
}

.info-box img {
    width: 100%;
    max-width: 390px;
    margin: 0 auto;
    display: block;
    border-radius: 8px;
    image-rendering: -webkit-optimize-contrast;
    backface-visibility: hidden;
    transform: translateZ(0);
}

.badge-nuevo {
    align-self: flex-start;
    margin-bottom: 5px;
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 0.8rem;
    padding: 5px 12px;
    border-radius: 6px;
    text-transform: uppercase;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.5); 
    z-index: 10;
    letter-spacing: 1px;
    cursor: pointer;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 2.2rem;
    }
    .counters-wrapper {
        position: static;
        margin-top: 15px;
        display: flex;
        justify-content: center;
    }
    .online-counter {
        position: static;
        margin-top: 10px;
    }
    header {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .viewer-nav h3 {
        font-size: 1rem;
        max-width: 40%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .viewer-btn {
        padding: 8px 12px;
        font-size: 0.8rem;

}

.chapter{
    border:2px solid #300000; 
    border-radius:12px;
    margin-bottom:20px;
    overflow:hidden;
    transition: all 0.3s ease; 
}

.chapter:hover, .chapter:active {
    border-color: #ff0000;
    box-shadow: 0 0 20px #ff0000;
    transform: translateY(-2px); 
}

.chapter-header{
    padding:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#111;
    transition: background 0.3s;
}

.chapter-header:hover {
    background:#1a1a1a;
}

.chapter-left{
    display:flex;
    gap:15px;
    align-items:center;
}

.chapter-thumb{
    width:70px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.chapter-views {
    font-size: 0.85rem;
    color: #888;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
}

#viewer-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 9999;
    overflow-y: auto;
}

.viewer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: rgba(10, 10, 10, 0.95);
    position: sticky;
    top: 0;
    border-bottom: 2px solid #ff0000;
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    transition: top 0.3s ease; 
}

.viewer-nav.hidden {
    top: -80px; 
}

.viewer-btn {
    background: #111;
    color: #fff;
    border: 1px solid #ff0000;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: 0.2s;
}

.viewer-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 10px #ff0000;
}

.viewer-btn:disabled {
    border-color: #333;
    color: #555;
    background: #0a0a0a;
    cursor: not-allowed;
    box-shadow: none;
}

.viewer-content {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 10px;
}

.viewer-content img {
    width: 100%;
    display: block;
    margin-bottom: 30px; 
    border-radius: 6px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); 
    border: 1px solid #111; 
    image-rendering: -webkit-optimize-contrast;
    content-visibility: auto;
    backface-visibility: hidden;
    transform: translateZ(0);
}

/* ==========================================================================
   SECCIÓN DE COMENTARIOS

.comments-section {

.comments-section h4 {

.comment-form {

}

.comment-form input, .comment-form textarea {

.comment-form input:focus, .comment-form textarea:focus {

.comment-form input:disabled {

}

.comment-form textarea {

}

.comment-submit-btn {
    align-self: flex-end;

    border: 1px solid #ff0000;
    padding: 10px 25px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: all 0.3s;
}

.comment-submit-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 15px #ff0000;
}

.comments-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.comment-card {
    background: #111;
    border: 1px solid #200000;
    padding: 15px;
    border-radius: 8px;

    display: flex;
    flex-direction: column;
    gap: 8px;

}

.comment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.comment-author-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
}

.comment-author {
    font-weight: bold;

    font-size: 0.95rem;
}

.comment-author.es-respuesta {
    color: #00ff66;
}

.comment-date {
    font-size: 0.8rem;
    color: #666;
}

.badge-autor {
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    box-shadow: 0 0 15px #00ff66;

}

.comment-text {
    color: #ddd;

}

.comment-actions {

}

.action-btn {
    background: none;
    border: none;
    color: #aaa; 
    cursor: pointer;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    position: relative;
}

.action-btn.like-btn:hover {
    color: #0084ff;
}

.action-btn.like-btn.liked {
    color: #0084ff;
}

.action-btn.delete-btn {
    display: none; 
    color: #aaa;
    padding: 4px 8px;
    border-radius: 4px;
}

.action-btn.delete-btn:hover {
    color: #fff;
    background: #b30000;
}

.comment-card.es-mio .action-btn.delete-btn {
    display: inline-flex; 
}

/* ESTILOS PARA RESPUESTAS */
.reply-context {
    background: #1a1a1a;
    border-left: 3px solid #ff0000;
    padding: 8px 12px;
    margin-bottom: 10px;
    border-radius: 4px;
    font-size: 0.85rem;
    color: #888;
}

.reply-context b {
    color: #00ff66;
}

.reply-indicator {
    display: none;
    background: #1a1a1a;
    border-left: 4px solid #00ff66;
    padding: 10px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    align-items: center;
    justify-content: space-between;
}

.reply-indicator.active {
    display: flex;
}

.reply-info {
    font-size: 0.9rem;
    color: #aaa;
}

.reply-info b {
    color: #00ff66;
}

.cancel-reply-btn {
    background: none;
    border: none;
    color: #ff4444;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 5px;
    transition: 0.2s;
}

.cancel-reply-btn:hover {
    color: #ff0000;
    transform: scale(1.1);
}

.action-btn.reply-btn:hover {
    color: #00ff66;
}

/* ANIMACIONES */
.floating-emoji {
    position: absolute;
    pointer-events: none;
    z-index: 999;
    font-size: 1.5rem;
    animation: flotarEmoji 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes flotarEmoji {
    0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
    }
    100% {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2);
        opacity: 0;
    }
}

.particle-fx {
    position: absolute;
    pointer-events: none;
    z-index: 999;
    width: 6px;
    height: 6px;
    border-radius: 2px;
    animation: explotarParticula 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
}

@keyframes explotarParticula {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(var(--mx), var(--my));
        opacity: 0;
    }
}

.social{
    text-align:center;
    margin:40px 0;
}

.social a{
    color:#888;
    text-decoration:none;
    font-size:1.3rem;
    margin:0 25px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: 0.3s;
}

.social a:hover, .social a:active{
    color: #ff0000;
    text-shadow: 0 0 10px #ff0000;
}

/* ==========================================================================
   ESTILOS DE LA GALERÍA (ESTILO MANGA PLUS)
   ========================================================================== */
.tabs-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 30px auto 20px auto;
    width: 95%;
    max-width: 1000px;
}

.tab-btn {
    background: #111;
    color: #888;
    border: 2px solid #200000;
    padding: 10px 25px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tab-btn:hover {
    color: #fff;
    border-color: #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
}

.tab-btn.active[data-tab="manga"] {
    background: #ff0000;
    color: #000;
    border-color: #ff0000;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
}

.tab-btn.active[data-tab="one-shot"] {
    background: #00ff66;
    color: #000;
    border-color: #00ff66;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
}

.tab-btn[data-tab="one-shot"]:hover {
    border-color: #00ff66;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
}

.gallery-section {
    display: none;
    width: 100%;
}

.gallery-section.active {
    display: block;
    animation: fadeIn 0.4s ease;
}

.series-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 15px;
}

.series-card {
    background: #0a0a0a;
    border: 2px solid #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    flex-direction: column;
    position: relative;
}

.series-card:hover {
    transform: translateY(-5px);
    border-color: #ff0000;
    box-shadow: 0 10px 20px rgba(255, 0, 0, 0.2);
}

.series-card[data-type="one-shot"]:hover {
    border-color: #00ff66;
    box-shadow: 0 10px 20px rgba(0, 255, 102, 0.2);
}

.series-cover-wrapper {
    position: relative;
    width: 100%;
    padding-top: 140%; /* Poster aspect ratio */
    overflow: hidden;
    background: #050505;
}

.series-cover {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.series-card:hover .series-cover {
    transform: scale(1.05);
}

.series-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.85);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: 1px solid #ff0000;
    color: #ff0000;
    z-index: 5;
}

.series-badge.one-shot {
    border-color: #00ff66;
    color: #00ff66;
}

.series-info {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-grow: 1;
}

.series-title {
    font-size: 1.1rem;
    font-weight: bold;
    color: #fff;
    margin: 0;
}

.series-author {
    font-size: 0.8rem;
    color: #888;
}

   ESTILOS DE DETALLE DE SERIE
   ========================================================================== */
.series-detail-container {
    display: none;
    width: 95%;
    max-width: 1000px;
    margin: 25px auto;
    animation: fadeIn 0.4s ease;
}

.back-btn-container {
    margin-bottom: 20px;
}

.back-btn {
    background: #111;
    border: 1px solid #333;
    color: #fff;

    align-items: center;

.back-btn:hover {

}

.series-header-layout {
    display: flex;

    margin-bottom: 30px;

.series-detail-poster-wrapper {

.series-detail-content {

.series-detail-title {

.series-detail-meta {

    }

</style>

<body>

<header>
    <h1>Thalesis</h1>
    
    <div class="follow-container">
        <button class="follow-btn" id="btn-toggle-follow">
            <i class="fas fa-bell"></i> Seguir
        </button>
        <form class="follow-form" id="form-follow">
            <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 10px;">Recibe avisos cuando suba nuevo contenido.</p>
            <input type="email" id="follow-email" placeholder="Tu correo electrónico..." required>
            <button type="submit">Suscribirme</button>
        </form>
    </div>

    <div class="counters-wrapper">
        <div class="global-counter" id="contador-global">
            <i class="fas fa-users"></i> <span id="num-global">...</span>
        </div>
    </div>
    <div class="online-counter" id="contador-online">
        <i class="fas fa-circle" style="font-size: 0.4rem; animation: pulse 2s infinite;"></i> 
        <span id="num-online">...</span>
    </div>
</header>

<div class="section" id="aviso-section">
    <div class="info-box" id="aviso-container"></div>
</div>

<!-- VISTA PRINCIPAL: GALERÍA DE SERIES -->

  window.calcularTiempoRelativo = function(timestamp) {
      if (!timestamp) return "Hace un momento";
      const ahora = Date.now();
      const diferencia = ahora - timestamp;

      const segundos = Math.floor(diferencia / 1000);
      const minutos = Math.floor(segundos / 60);
      const horas = Math.floor(minutos / 60);
      const dias = Math.floor(horas / 24);

      if (segundos < 60) return "Hace un momento";
      if (minutos < 60) return `Hace ${minutos} ${minutos === 1 ? 'minuto' : 'minutos'}`;
      if (horas < 24) return `Hace ${horas} ${horas === 1 ? 'hora' : 'horas'}`;
      if (dias === 1) return "Ayer";
      if (dias < 7) return `Hace ${dias} días`;
      
      const fechaObj = new Date(timestamp);
      return fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  };

  function escaperHtml(texto) {
      if (!texto) return "";
      return texto.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

  window.crearEfectoLluviaCorazones = function(e) {
      const emojis = ['❤️', '✨', '🔥', '💖'];
      const rootSeccion = document.getElementById("seccion-comentarios-root");
      const boundsRoot = rootSeccion.getBoundingClientRect();
      const boundsBtn = e.currentTarget.getBoundingClientRect();
      const xOriginal = boundsBtn.left - boundsRoot.left + boundsBtn.width / 2;
      const yOriginal = boundsBtn.top - boundsRoot.top + boundsBtn.height / 2;

      for (let i = 0; i < 12; i++) {
          const span = document.createElement('span');
          span.className = 'floating-emoji';
          span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          span.style.left = `${xOriginal}px`;
          span.style.top = `${yOriginal}px`;
          const angulo = (Math.random() * 120 + 30) * (Math.PI / 180); 
          const velocidad = Math.random() * 100 + 50;
          const xDestino = Math.cos(angulo) * velocidad * (Math.random() > 0.5 ? 1 : -1);
          const yDestino = -Math.sin(angulo) * velocidad - 30; 
          span.style.setProperty('--x', `${xDestino}px`);
          span.style.setProperty('--y', `${yDestino}px`);
          rootSeccion.appendChild(span);
          span.addEventListener('animationend', () => span.remove());
      }
  };

  window.crearEfectoExplosionComentario = function(botonClicado, elementoCard) {

      const boundsBtn = botonClicado.getBoundingClientRect();
      const colores = ['#ff0000', '#b30000', '#300000', '#555555', '#222222'];
      elementoCard.style.opacity = '0';
      const xCentro = boundsBtn.left - boundsRoot.left + boundsBtn.width / 2;
      const yCentro = boundsBtn.top - boundsRoot.top + boundsBtn.height / 2;

      for (let i = 0; i < 40; i++) {
          const particula = document.createElement('div');
          particula.className = 'particle-fx';
          particula.style.left = `${xCentro}px`;
          particula.style.top = `${yCentro}px`;
          particula.style.background = colores[Math.floor(Math.random() * colores.length)];
          const mx = (Math.random() - 0.5) * 250; 
          const my = (Math.random() * 150) - 50;  
          particula.style.setProperty('--mx', `${mx}px`);
          particula.style.setProperty('--my', `${my}px`);
          rootSeccion.appendChild(particula);
          particula.addEventListener('animationend', () => particula.remove());
      }
  };

  async function cargarAvisos() {
      const contenedorAvisos = document.getElementById("aviso-container");
      try {
          const respuesta = await fetch(`${api}/Aviso`);
          if (!respuesta.ok) { contenedorAvisos.parentElement.style.display = "none"; return; }
          const archivos = await respuesta.json();
          const pngs = archivos.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a, b) => b.name.localeCompare(a.name, undefined, {numeric: true}));
          if (pngs.length === 0) { contenedorAvisos.parentElement.style.display = "none"; return; }

          const ultimoAvisoVisto = localStorage.getItem("ultimo_aviso_visto");
          const idUltimoAviso = pngs[0].name;

          pngs.forEach((img, index) => {
              const wrapper = document.createElement("div");
              wrapper.className = "aviso-wrapper";
              if (index === 0 && ultimoAvisoVisto !== idUltimoAviso) {
                  const tag = document.createElement("span");
                  tag.className = "badge-nuevo";
                  tag.innerText = "Nuevo";
                  tag.onclick = () => { localStorage.setItem("ultimo_aviso_visto", idUltimoAviso); tag.style.display = "none"; };
                  wrapper.appendChild(tag);
                  setTimeout(() => { localStorage.setItem("ultimo_aviso_visto", idUltimoAviso); if (tag) tag.style.opacity = "0"; setTimeout(() => { if(tag) tag.style.display = "none"; }, 500); }, 10000);
              }
              const imageElement = document.createElement("img");
              imageElement.src = img.download_url;
              imageElement.loading = "lazy";
              imageElement.decoding = "async";
              wrapper.appendChild(imageElement);
              contenedorAvisos.appendChild(wrapper);
          });
      } catch (error) { contenedorAvisos.parentElement.style.display = "none"; }
  }

          // Guardamos qué carpetas procesaremos de forma especial para no duplicarlas en la compatibilidad hacia atrás

          if (mangaCatDir) especialDirs.push(mangaCatDir.name.toLowerCase());
          if (oneShotCatDir) especialDirs.push(oneShotCatDir.name.toLowerCase());

          // 1. Procesar carpeta de categoría MANGA
          if (mangaCatDir) {
              const r = await fetch(`${api}/${encodeURIComponent(mangaCatDir.name)}`);
              const subFolders = await r.json();
              const seriesDirs = subFolders.filter(item => item.type === "dir");

              for (const sDir of seriesDirs) {
                  const sId = sDir.name.toLowerCase().replace(/[\s-_]+/g, "_");
                  if (!seriesData[sId]) {
                      seriesData[sId] = {
                          id: sId,
                          title: sDir.name.replace(/_/g, " ").replace(/-/g, " "),
                          type: "manga",
                          cover: "https://raw.githubusercontent.com/railinc035-gif/Mizuvichi/main/Cap_01/01.png", // fallback
                          description: `Una increíble obra titulada ${sDir.name.replace(/_/g, " ").replace(/-/g, " ")}. ¡Disfrútala en la galería!`,
                          author: "Raylin AC",
                          chapters: []
                      };
                  }

                  // Obtenemos los elementos directamente dentro de la carpeta de la serie
                  const r2 = await fetch(`${api}/${encodeURIComponent(mangaCatDir.name)}/${encodeURIComponent(sDir.name)}`);
                  const sItems = await r2.json();

                  // Comprobamos si tiene imágenes PNG directamente dentro
                  const directPngs = sItems.filter(p => p.type === "file" && p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true}));

                  if (directPngs.length > 0) {
                      // Si hay imágenes directas, es un capítulo único directo
                      seriesData[sId].chapters.push({ name: "Capítulo Único", images: directPngs });
                  } else {
                      // Si no, escaneamos las subcarpetas como capítulos
                      const validCapDirs = sItems.filter(item => item.type === "dir");

                      for (const cDir of validCapDirs) {
                          const r3 = await fetch(`${api}/${encodeURIComponent(mangaCatDir.name)}/${encodeURIComponent(sDir.name)}/${encodeURIComponent(cDir.name)}`);
                          const subFiles = await r3.json();
                          const pngs = subFiles.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true}));
                          if (pngs.length === 0) continue;

                          seriesData[sId].chapters.push({ name: cDir.name, images: pngs });
                      }
                  }
              }
          }

          // 2. Procesar carpeta de categoría ONE SHOT
          if (oneShotCatDir) {
              const r = await fetch(`${api}/${encodeURIComponent(oneShotCatDir.name)}`);
              const subFolders = await r.json();
              const seriesDirs = subFolders.filter(item => item.type === "dir");

              for (const sDir of seriesDirs) {
                  const sId = sDir.name.toLowerCase().replace(/[\s-_]+/g, "_");
                  if (!seriesData[sId]) {
                      seriesData[sId] = {
                          id: sId,
                          title: sDir.name.replace(/_/g, " ").replace(/-/g, " "),
                          type: "one-shot",
                          cover: "https://raw.githubusercontent.com/railinc035-gif/Mizuvichi/main/Cap_01/01.png", // fallback
                          description: `Un increíble One Shot titulado ${sDir.name.replace(/_/g, " ").replace(/-/g, " ")}.`,
                          author: "Raylin AC",
                          chapters: []
                      };
                  }

                  // Obtenemos los elementos directamente dentro de la carpeta de la serie
                  const r2 = await fetch(`${api}/${encodeURIComponent(oneShotCatDir.name)}/${encodeURIComponent(sDir.name)}`);
                  const sItems = await r2.json();

                  // Comprobamos si tiene imágenes PNG directamente dentro
                  const directPngs = sItems.filter(p => p.type === "file" && p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true}));

                  if (directPngs.length > 0) {
                      // Si hay imágenes directas, es un capítulo único directo (muy común en One Shots)
                      seriesData[sId].chapters.push({ name: "Capítulo Único", images: directPngs });
                  } else {
                      // Si no, escaneamos las subcarpetas como capítulos
                      const validCapDirs = sItems.filter(item => item.type === "dir");

                      for (const cDir of validCapDirs) {
                          const r3 = await fetch(`${api}/${encodeURIComponent(oneShotCatDir.name)}/${encodeURIComponent(sDir.name)}/${encodeURIComponent(cDir.name)}`);
                          const subFiles = await r3.json();
                          const pngs = subFiles.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true}));
                          if (pngs.length === 0) continue;

                          seriesData[sId].chapters.push({ name: cDir.name, images: pngs });
                      }
                  }
              }
          }

          // 3. Procesar carpetas en la raíz (compatibilidad hacia atrás)
          const rootFolders = archivos.filter(item => item.type === "dir" && !especialDirs.includes(item.name.toLowerCase()) && !item.name.startsWith("."));

          for (const folder of rootFolders) {
              const folderApi = `${api}/${folder.name}`;
              const folderResp = await fetch(folderApi);
              const paginas = await folderResp.json();
              const pngs = paginas.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true}));
              if (pngs.length === 0) continue;

              const chapterObj = { name: folder.name, images: pngs };

              if (folder.name.startsWith("Cap_") || folder.name.startsWith("Manga_")) {
                  seriesData.thalesis.chapters.push(chapterObj);
              } else {
                  seriesData.mizuvichi.chapters.push(chapterObj);
              }
          }

          // Ordenar los capítulos de forma descendente en todas las series
          Object.values(seriesData).forEach(series => {
              series.chapters.sort((a, b) => b.name.localeCompare(a.name));
              // Si tiene capítulos, actualizamos el cover dinámicamente con la primera página del primer capítulo
              if (series.chapters.length > 0) {
                  series.cover = series.chapters[series.chapters.length - 1].images[0].download_url;
              }
          });

          // Renderizar tarjetas de series
          renderizarTarjetasGaleria();

          // Comprobar rutas en hash al cargar
          comprobarRutasHash();

      } catch (error) {
          console.error("Error cargando la galería:", error);
      }
  }

  function renderizarTarjetasGaleria() {
      const gridManga = document.getElementById("grid-manga");
      const gridOneShot = document.getElementById("grid-one-shot");

      gridManga.innerHTML = "";
      gridOneShot.innerHTML = "";

      let countManga = 0;
      let countOneShot = 0;

      Object.values(seriesData).forEach(series => {
          if (series.chapters.length === 0) {
              return; // No mostramos series vacías en la galería
          }

          const card = document.createElement("div");
          card.className = "series-card";
          card.setAttribute("data-type", series.type);
          card.innerHTML = `
              <div class="series-cover-wrapper">
                  <span class="series-badge ${series.type}">${series.type}</span>
                  <img class="series-cover" src="${series.cover}" alt="${series.title}" loading="lazy">
              </div>
              <div class="series-info">
                  <h3 class="series-title">${series.title}</h3>
                  <span class="series-author">Por ${series.author}</span>
              </div>
          `;

          card.addEventListener("click", () => {
              irADetalleSerie(series.id);
          });

          if (series.type === "manga") {
              gridManga.appendChild(card);
              countManga++;
          } else {
              gridOneShot.appendChild(card);
              countOneShot++;
          }
      });

      if (countManga === 0) {
          gridManga.innerHTML = `<p style="color: #666; font-size: 1.1rem; text-align: center; grid-column: 1 / -1; margin: 40px 0; font-style: italic;">No hay mangas disponibles por el momento.</p>`;
      }
      if (countOneShot === 0) {
          gridOneShot.innerHTML = `<p style="color: #666; font-size: 1.1rem; text-align: center; grid-column: 1 / -1; margin: 40px 0; font-style: italic;">No hay One Shots disponibles por el momento.</p>`;
      }
  }

  function irADetalleSerie(seriesId, scroll = true) {
      activeSeriesId = seriesId;
      window.location.hash = `serie=${seriesId}`;

      const series = seriesData[seriesId];
      if (!series) return;

      document.getElementById("series-poster").src = series.cover;
      document.getElementById("series-title").innerText = series.title;
      document.getElementById("series-author").innerText = `Autor: ${series.author}`;
      document.getElementById("series-desc").innerText = series.description;

      // Renderizar capítulos de esta serie
      const contenedorCapitulos = document.getElementById("chapters");
      contenedorCapitulos.innerHTML = "";

      // Copiamos la lista de capítulos de esta serie a la variable global listaCapitulosGuardados
      // para que el visor pueda navegar secuencialmente entre ellos
      listaCapitulosGuardados = series.chapters;

      if (listaCapitulosGuardados.length === 0) {
          contenedorCapitulos.innerHTML = `<p style="color:#666; font-size:1rem; text-align:center; margin:30px 0;">¡Próximamente nuevos capítulos!</p>`;
      } else {
          listaCapitulosGuardados.forEach((cap) => {
              const card = document.createElement("div");
              card.className = "chapter";
              
              // Determinar título del capítulo (sin numeración si es One Shot)
              let tituloCap = "";
              if (series.type === "one-shot") {
                  tituloCap = "Leer One Shot";
              } else {
                  tituloCap = formatearNombreCapitulo(cap.name);
              }

              card.innerHTML = `
              <div class="chapter-header">
                  <div class="chapter-left">
                      <img class="chapter-thumb" src="${cap.images[0].download_url}">
                      <div><h3>${tituloCap}</h3><div class="chapter-views" id="views-${cap.name}">...</div></div>
                  </div>
                  <div>▶</div>
              </div>
              `;
              card.querySelector(".chapter-header").addEventListener("click", () => {
                  const index = listaCapitulosGuardados.findIndex(c => c.name === cap.name);
                  window.abrirVisor(index);
              });
              contenedorCapitulos.appendChild(card);
              window.escucharVisitasCapitulo(cap.name, card.querySelector(`#views-${cap.name}`));
          });
      }

      // Switch views
      document.getElementById("gallery-home-section").style.display = "none";
      document.getElementById("aviso-section").style.display = "none";
      document.getElementById("series-detail-container").style.display = "block";

      if (scroll) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
      }
  }

  function volverALagaleria() {
      activeSeriesId = null;
      history.pushState("", document.title, window.location.pathname + window.location.search);
      document.getElementById("series-detail-container").style.display = "none";
      document.getElementById("gallery-home-section").style.display = "block";
      document.getElementById("aviso-section").style.display = "block";
  }

  function comprobarRutasHash() {
      const hash = window.location.hash;
      if (hash.startsWith("#capitulo=")) {
          const nombreCap = hash.replace("#capitulo=", "");
          // Buscamos a qué serie pertenece
          let serieEncontrada = null;
          let capIndex = -1;

          for (const sId in seriesData) {
              const idx = seriesData[sId].chapters.findIndex(c => c.name === nombreCap);
              if (idx !== -1) {
                  serieEncontrada = sId;
                  capIndex = idx;
                  break;
              }
          }

          if (serieEncontrada && capIndex !== -1) {
              irADetalleSerie(serieEncontrada, false);
              window.abrirVisor(capIndex);
          }
      } else if (hash.startsWith("#serie=")) {
          const seriesId = hash.replace("#serie=", "");
          if (seriesData[seriesId]) {
              irADetalleSerie(seriesId);
          }
      } else {
          // Si no hay hash de detalle o visor, nos aseguramos de mostrar la galería
          document.getElementById("viewer-container").style.display = "none";
          document.body.style.overflow = "auto";
          document.getElementById("series-detail-container").style.display = "none";
          document.getElementById("gallery-home-section").style.display = "block";
          document.getElementById("aviso-section").style.display = "block";
      }
  }

  window.addEventListener("hashchange", comprobarRutasHash);

  window.abrirVisor = function(index, scrollAComentarios = false) {
      if (index < 0 || index >= listaCapitulosGuardados.length) return;
      window.cancelReply();
      indiceCapituloActual = index;
      const capitulo = listaCapitulosGuardados[indiceCapituloActual];
      window.location.hash = `capitulo=${capitulo.name}`;
      
      // Obtener serie activa para comprobar el tipo y omitir numeración si es One Shot
      const activeSeries = seriesData[activeSeriesId];
      let tituloFormateado = "";
      if (activeSeries && activeSeries.type === "one-shot") {
          tituloFormateado = activeSeries.title; // Sólo el título de la obra
      } else {
          tituloFormateado = formatearNombreCapitulo(capitulo.name);
      }

      document.getElementById("viewer-title").innerText = tituloFormateado;
      document.getElementById("viewer-title-bottom").innerText = tituloFormateado;

      const contentDiv = document.getElementById("viewer-content");
      contentDiv.innerHTML = ""; 
      capitulo.images.forEach(img => {
          const imageElement = document.createElement("img");
          imageElement.src = img.download_url;
          imageElement.loading = "lazy";
          imageElement.decoding = "async";
          contentDiv.appendChild(imageElement);
      });
      
      const esPrimero = indiceCapituloActual === 0;
      const esUltimo = indiceCapituloActual === listaCapitulosGuardados.length - 1;

      document.getElementById("btn-prev").disabled = esUltimo;
      document.getElementById("btn-prev-bottom").disabled = esUltimo;
      document.getElementById("btn-next").disabled = esPrimero;
      document.getElementById("btn-next-bottom").disabled = esPrimero;
      document.getElementById("viewer-container").style.display = "block";
      document.getElementById("viewer-container").scrollTop = 0;
      document.body.style.overflow = "hidden";
      window.verificarYBloquearNombre();
      window.registrarVisitaCapitulo(capitulo.name);
      window.cargarComentariosDelCapitulo(capitulo.name, document.getElementById("lista-comentarios"), scrollAComentarios);
  }

  document.getElementById("formulario-comentario").addEventListener("submit", (e) => {
      e.preventDefault();
      const cap = listaCapitulosGuardados[indiceCapituloActual];
      if (cap) {
          window.intentarPublicarComentario(cap.name, document.getElementById("comentario-nombre").value, document.getElementById("comentario-texto").value);
          document.getElementById("comentario-texto").value = "";
      }
  });

  const cerrarVisor = () => {
      document.getElementById("viewer-container").style.display = "none";
      document.body.style.overflow = "auto";
      if (activeSeriesId) {
          window.location.hash = `serie=${activeSeriesId}`;
      } else {
          history.pushState("", document.title, window.location.pathname + window.location.search);
      }
  };

  document.getElementById("btn-close").addEventListener("click", cerrarVisor);
  document.getElementById("btn-close-bottom").addEventListener("click", cerrarVisor);

  document.getElementById("btn-cancel-reply").addEventListener("click", window.cancelReply);
  
  const irAnterior = () => window.abrirVisor(indiceCapituloActual + 1);
  const irSiguiente = () => window.abrirVisor(indiceCapituloActual - 1);

  document.getElementById("btn-prev").addEventListener("click", irAnterior);
  document.getElementById("btn-prev-bottom").addEventListener("click", irAnterior);
  document.getElementById("btn-next").addEventListener("click", irSiguiente);
  document.getElementById("btn-next-bottom").addEventListener("click", irSiguiente);

  let ultimoScroll = 0;
  const visorContainer = document.getElementById("viewer-container");
  const barraNav = document.getElementById("viewer-nav");
  visorContainer.addEventListener("scroll", () => {
      let scrollActual = visorContainer.scrollTop;
      if (scrollActual > ultimoScroll && scrollActual > 50) barraNav.classList.add("hidden"); 
      else barraNav.classList.remove("hidden");
      ultimoScroll = scrollActual;
  });

  window.addEventListener("DOMContentLoaded", () => {
      window.registrarVisitaInicio();
      window.escucharVisitasGlobales();
      cargarAvisos();
      inicializarGaleria();

      // Configuración de los botones de pestañas (Tabs)
      const tabBtns = document.querySelectorAll(".tab-btn");
      tabBtns.forEach(btn => {
          btn.addEventListener("click", () => {
              tabBtns.forEach(b => b.classList.remove("active"));
              btn.classList.add("active");

              const targetTab = btn.getAttribute("data-tab");
              document.querySelectorAll(".gallery-section").forEach(sec => {
                  sec.classList.remove("active");
              });

              if (targetTab === "manga") {
                  document.getElementById("sec-manga").classList.add("active");
              } else {
                  document.getElementById("sec-one-shot").classList.add("active");
              }
          });
      });

      // Botón volver a galería
      document.getElementById("btn-back-gallery").addEventListener("click", volverALagaleria);

      const btnFollow = document.getElementById("btn-toggle-follow");
      const formFollow = document.getElementById("form-follow");

      const actualizarEstadoSuscripcion = () => {
          const estaSuscrito = localStorage.getItem("mizuvichi_suscrito") === "true";
          if (estaSuscrito) {
              btnFollow.classList.add("subscribed");
              btnFollow.innerHTML = '<i class="fas fa-check-circle"></i> Suscrito';
          } else {
              btnFollow.classList.remove("subscribed");
              btnFollow.innerHTML = '<i class="fas fa-bell"></i> Seguir';
          }
      };

      if (btnFollow && formFollow) {
          actualizarEstadoSuscripcion();
          btnFollow.onclick = (e) => {
              e.stopPropagation();
              const estaSuscrito = localStorage.getItem("mizuvichi_suscrito") === "true";
              if (estaSuscrito) {
                  if (confirm("¿Estás seguro de que quieres desuscribirte?")) {
                      const email = localStorage.getItem("mizuvichi_email");
                      if (email) {
                          const emailKey = btoa(email).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
                          const refSub = ref(database, 'subscriptores/' + emailKey);
                          remove(refSub).then(() => {
                              localStorage.removeItem("mizuvichi_suscrito");
                              localStorage.removeItem("mizuvichi_email");
                              actualizarEstadoSuscripcion();
                              alert("Te has desuscrito correctamente.");
                          });
                      } else {
                          localStorage.removeItem("mizuvichi_suscrito");
                          actualizarEstadoSuscripcion();
                      }
                  }
              } else {
                  formFollow.classList.toggle("active");
              }
          };
          document.addEventListener("click", (e) => {
              if (!formFollow.contains(e.target) && e.target !== btnFollow) {
                  formFollow.classList.remove("active");
              }
          });
      }

      if (formFollow) {
          formFollow.onsubmit = (e) => {
              e.preventDefault();
              const emailInput = document.getElementById("follow-email");
              const email = emailInput.value.trim().toLowerCase();
              if (email) {
                  const emailKey = btoa(email).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
                  const refSub = ref(database, 'subscriptores/' + emailKey);
                  
                  set(refSub, {
                      email: email,
                      fecha: serverTimestamp(),
                      activo: true
                  }).then(() => {
                      localStorage.setItem("mizuvichi_suscrito", "true");
                      localStorage.setItem("mizuvichi_email", email);
                      actualizarEstadoSuscripcion();
                      alert("¡Gracias! Te avisaremos cuando haya novedades.");
                      formFollow.reset();
                      formFollow.classList.remove("active");
                  }).catch(() => {
                      alert("Error al suscribirse. Inténtalo de nuevo.");
                  });
              }
          };
      }
  });
</script>
