/* Spinner de carga estilo TikTok premium con 4 puntos de colores: rojo, verde, blanco y oro */ 
.loading-spinner { 
    position: absolute; 
    width: 60px; 
    height: 60px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    z-index: 2; 
    pointer-events: none; 
    transition: opacity 0.3s ease; 
} 
 
.loading-spinner .dot { 
    position: absolute; 
    width: 12px; 
    height: 12px; 
    border-radius: 50%; 
    animation: tiktok-spin 1.6s ease-in-out infinite; 
} 
 
.loading-spinner .dot-red { 
    background-color: #ff0000; 
    animation-delay: 0s; 
} 
 
.loading-spinner .dot-green { 
    background-color: #00ff66; 
    animation-delay: -0.4s; 
} 
 
.loading-spinner .dot-white { 
    background-color: #ffffff; 
    animation-delay: -0.8s; 
} 
 
.loading-spinner .dot-gold { 
    background-color: #ffd700; 
    animation-delay: -1.2s; 
} 
 
@keyframes tiktok-spin { 
    0%, 100% { 
        transform: translate(0, 0) scale(1); 
        z-index: 3; 
    } 
    25% { 
        transform: translate(18px, 0) scale(1.2); 
        z-index: 4; 
    } 
    50% { 
        transform: translate(0, 0) scale(0.8); 
        z-index: 1; 
    } 
    75% { 
        transform: translate(-18px, 0) scale(1.2); 
        z-index: 4; 
    } 
}

/* ANIMACIONES */ 
.floating-emoji { 
    position: absolute; 
    pointer-events: none; 
    z-index: 999; 
    font-size: 1.5rem; 
    animation: flotarEmoji 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; 
} 
 
@keyframes flotarEmoji { 
    0% { 
        transform: translate(-50%, -50%) scale(0.5); 
        opacity: 1; 
    } 
    100% { 
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2); 
        opacity: 0; 
    } 
} 
 
.particle-fx { 
    position: absolute; 
    pointer-events: none; 
    z-index: 999; 
    width: 6px; 
    height: 6px; 
    border-radius: 2px; 
    animation: explotarParticula 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards; 
} 
 
@keyframes explotarParticula { 
    0% { 
        transform: translate(0, 0) scale(1); 
        opacity: 1; 
    } 
    100% { 
        transform: translate(var(--mx), var(--my)); 
        opacity: 0; 
    } 
}

  window.calcularTiempoRelativo = function(timestamp) { 
      if (!timestamp) return "Hace un momento"; 
      const ahora = Date.now(); 
      const diferencia = ahora - timestamp; 
 
      const segundos = Math.floor(diferencia / 1000); 
      const minutos = Math.floor(segundos / 60); 
      const horas = Math.floor(minutos / 60); 
      const dias = Math.floor(horas / 24); 
 
      if (segundos < 60) return "Hace un momento"; 
      if (minutos < 60) return `Hace ${minutos} ${minutos === 1 ? 'minuto' : 'minutos'}`; 
      if (horas < 24) return `Hace ${horas} ${horas === 1 ? 'hora' : 'horas'}`; 
      if (dias === 1) return "Ayer"; 
      if (dias < 7) return `Hace ${dias} días`; 
       
      const fechaObj = new Date(timestamp); 
      return fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });

          const velocidad = Math.random() * 100 + 50; 
          const xDestino = Math.cos(angulo) * velocidad * (Math.random() > 0.5 ? 1 : -1); 
          const yDestino = -Math.sin(angulo) * velocidad - 30;  
          span.style.setProperty('--x', `${xDestino}px`);

  async function cargarAvisos() { 
      const contenedorAvisos = document.getElementById("aviso-container"); 
      try { 
          const respuesta = await fetch(`${api}/Aviso`); 
          if (!respuesta.ok) { contenedorAvisos.parentElement.style.display = "none"; return; } 
          const archivos = await respuesta.json(); 
          const pngs = archivos.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a, b) => b.name.localeCompare(a.name, undefined, {numeric: true})); 
          if (pngs.length === 0) { contenedorAvisos.parentElement.style.display = "none"; return; } 
 
          const ultimoAvisoVisto = localStorage.getItem("ultimo_aviso_visto"); 
          const idUltimoAviso = pngs[0].name; 
 
          pngs.forEach((img, index) => { 
              const wrapper = document.createElement("div"); 
              wrapper.className = "aviso-wrapper"; 
              if (index === 0 && ultimoAvisoVisto !== idUltimoAviso) { 
                  const tag = document.createElement("span"); 
                  tag.className = "badge-nuevo"; 
                  tag.innerText = "Nuevo"; 
                  tag.onclick = () => { localStorage.setItem("ultimo_aviso_visto", idUltimoAviso); tag.style.display = "none"; }; 
                  wrapper.appendChild(tag); 
                  setTimeout(() => { localStorage.setItem("ultimo_aviso_visto", idUltimoAviso); if (tag) tag.style.opacity = "0"; setTimeout(() => { if(tag) tag.style.display = "none"; }, 500); }, 10000); 
              } 
              const imageElement = document.createElement("img"); 
              imageElement.src = obtenerUrlCDN(img.download_url); 
              imageElement.loading = "lazy"; 
              imageElement.decoding = "async"; 
              wrapper.appendChild(imageElement); 
              contenedorAvisos.appendChild(wrapper); 
          }); 
      } catch (error) { contenedorAvisos.parentElement.style.display = "none"; } 
  }

  async function autoDetectarFavicon() { 
      try { 
          const respuesta = await fetch(api); 
          if (respuesta.ok) { 
              const archivos = await respuesta.json(); 
              // Buscar cualquier archivo que contenga "favicon" en su nombre (sin importar mayúsculas/minúsculas o extensión) 
              const archivoFavicon = archivos.find(f => f.type === "file" && f.name.toLowerCase().includes("favicon")); 
              if (archivoFavicon) { 
                  const urlFavicon = obtenerUrlCDN(archivoFavicon.download_url); 
                  let linkElement = document.querySelector("link[rel~='icon']"); 
                  if (!linkElement) { 
                      linkElement = document.createElement("link"); 
                      linkElement.rel = "icon"; 
                      document.head.appendChild(linkElement); 
                  } 
                  linkElement.href = urlFavicon; 
              } 
          } 
      } catch (error) { 
          console.error("Error al detectar el favicon automáticamente:", error); 
      } 
  }

  async function inicializarGaleria() { 
      try { 
          const respuesta = await fetch(api);

          seriesData.thalesis.chapters = []; 
          seriesData.mizuvichi.chapters = []; 
 
          // Identificar si existen carpetas de categoría: "manga" o "one shot" (o similares) 
          const mangaCatDir = archivos.find(item => item.type === "dir" && /^manga[s]?$/i.test(item.name)); 
          const oneShotCatDir = archivos.find(item => item.type === "dir" && /^(one[-_\s]?shot[s]?|one)$/i.test(item.name)); 
 
          // Guardamos qué carpetas procesaremos de forma especial para no duplicarlas en la compatibilidad hacia atrás 
          const especialDirs = ["aviso", "scripts", ".github"]; 
          if (mangaCatDir) especialDirs.push(mangaCatDir.name.toLowerCase()); 
          if (oneShotCatDir) especialDirs.push(oneShotCatDir.name.toLowerCase()); 
 
          // 1. Procesar carpeta de categoría MANGA 
          if (mangaCatDir) { 
              const r = await fetch(`${api}/${encodeURIComponent(mangaCatDir.name)}`); 
              const subFolders = await r.json(); 
              const seriesDirs = subFolders.filter(item => item.type === "dir"); 
 
              for (const sDir of seriesDirs) { 
                  const sId = sDir.name.toLowerCase().replace(/[\s-_]+/g, "_"); 
                  if (!seriesData[sId]) { 
                      seriesData[sId] = { 
                          id: sId, 
                          title: sDir.name.replace(/_/g, " ").replace(/-/g, " "), 
                          type: "manga", 
                          status: "emision", // Por defecto en emisión para nuevas series

                          author: "Raylin AC", 
                          chapters: [] 
                      }; 
                  } 
 
                  // Obtenemos los elementos directamente dentro de la carpeta de la serie 
                  const r2 = await fetch(`${api}/${encodeURIComponent(mangaCatDir.name)}/${encodeURIComponent(sDir.name)}`); 
                  const sItems = await r2.json(); 
 
                  // Comprobamos si tiene imágenes PNG directamente dentro 
                  const directPngs = sItems.filter(p => p.type === "file" && p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true})); 
 
                  if (directPngs.length > 0) { 
                      // Si hay imágenes directas, es un capítulo único directo 
                      seriesData[sId].chapters.push({ name: "Capítulo Único", uniqueId: sId + "_direct", images: directPngs }); 
                  } else { 
                      // Si no, escaneamos las subcarpetas como capítulos 
                      const validCapDirs = sItems.filter(item => item.type === "dir"); 
 
                      for (const cDir of validCapDirs) { 
                          const r3 = await fetch(`${api}/${encodeURIComponent(mangaCatDir.name)}/${encodeURIComponent(sDir.name)}/${encodeURIComponent(cDir.name)}`); 
                          const subFiles = await r3.json(); 
                          const pngs = subFiles.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true})); 
                          if (pngs.length === 0) continue; 
 
                          // Si es la serie principal "thalesis", usamos el nombre directo del capítulo (como "Cap_01") 
                          // para restaurar y mantener los contadores históricos y comentarios existentes de Firebase. 
                          // Para otras series de manga, usamos un ID prefijado exclusivo e independiente. 
                          const uniqueId = sId === "thalesis" ? cDir.name : sId + "_" + cDir.name; 
                          seriesData[sId].chapters.push({ name: cDir.name, uniqueId: uniqueId, images: pngs }); 
                      } 
                  } 
              } 
          } 
 
          // 2. Procesar carpeta de categoría ONE SHOT 
          if (oneShotCatDir) { 
              const r = await fetch(`${api}/${encodeURIComponent(oneShotCatDir.name)}`); 
              const subFolders = await r.json(); 
              const seriesDirs = subFolders.filter(item => item.type === "dir"); 
 
              for (const sDir of seriesDirs) { 
                  const sId = sDir.name.toLowerCase().replace(/[\s-_]+/g, "_"); 
                  if (!seriesData[sId]) { 
                      seriesData[sId] = { 
                          id: sId, 
                          title: sDir.name.replace(/_/g, " ").replace(/-/g, " "), 
                          type: "one-shot", 
                          status: "terminado", // One shots suelen considerarse terminados 
                          cover: obtenerUrlCDN("https://raw.githubusercontent.com/railinc035-gif/Mizuvichi/main/Cap_01/01.png"), // fallback 
                          description: `Un increíble One Shot titulado ${sDir.name.replace(/_/g, " ").replace(/-/g, " ")}.`,

                      };

                  // Obtenemos los elementos directamente dentro de la carpeta de la serie 
                  const r2 = await fetch(`${api}/${encodeURIComponent(oneShotCatDir.name)}/${encodeURIComponent(sDir.name)}`); 
                  const sItems = await r2.json(); 
 
                  // Comprobamos si tiene imágenes PNG directamente dentro 
                  const directPngs = sItems.filter(p => p.type === "file" && p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true})); 
 
                  if (directPngs.length > 0) { 
                      // Si hay imágenes directas, es un capítulo único directo (muy común en One Shots) 
                      seriesData[sId].chapters.push({ name: "Capítulo Único", uniqueId: sId + "_direct", images: directPngs }); 
                  } else { 
                      // Si no, escaneamos las subcarpetas como capítulos 
                      const validCapDirs = sItems.filter(item => item.type === "dir"); 
 
                      for (const cDir of validCapDirs) { 
                          const r3 = await fetch(`${api}/${encodeURIComponent(oneShotCatDir.name)}/${encodeURIComponent(sDir.name)}/${encodeURIComponent(cDir.name)}`); 
                          const subFiles = await r3.json(); 
                          const pngs = subFiles.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true})); 
                          if (pngs.length === 0) continue; 
 
                          seriesData[sId].chapters.push({ name: cDir.name, uniqueId: sId + "_" + cDir.name, images: pngs }); 
                      } 
                  } 
              } 
          } 
 
          // 3. Procesar carpetas en la raíz (compatibilidad hacia atrás) 
          const rootFolders = archivos.filter(item => item.type === "dir" && !especialDirs.includes(item.name.toLowerCase()) && !item.name.startsWith(".")); 
 
          for (const folder of rootFolders) { 
              const folderApi = `${api}/${folder.name}`; 
              const folderResp = await fetch(folderApi); 
              const paginas = await folderResp.json(); 
              const pngs = paginas.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true})); 
              if (pngs.length === 0) continue; 
 
              const chapterObj = { name: folder.name, uniqueId: folder.name, images: pngs }; 
 
              if (folder.name.startsWith("Cap_") || folder.name.startsWith("Manga_")) { 
                  seriesData.thalesis.chapters.push(chapterObj); 
              } else { 
                  seriesData.mizuvichi.chapters.push(chapterObj);

          // Ordenar los capítulos de forma descendente en todas las series 
          Object.values(seriesData).forEach(series => { 
              series.chapters.sort((a, b) => b.name.localeCompare(a.name)); 
              // Si tiene capítulos, actualizamos el cover dinámicamente con la primera página del primer capítulo

          // Asignar descripción secuencial única para cada serie activa usando la lista literal (excepto Thalesis y Mizuvichi que tienen descripciones fijas personalizadas) 
          let indexCounter = 0; 
          Object.values(seriesData).forEach(series => { 
              if (series.chapters.length > 0) { 
                  if (series.id !== "thalesis" && series.id !== "mizuvichi") { 
                      series.description = listaDescripcionesFijas[indexCounter] || `Indice ${String(indexCounter + 1).padStart(2, '0')}`; 
                      indexCounter++;

          // Renderizar tarjetas de series

  function renderizarTarjetasGaleria() { 
      const gridManga = document.getElementById("grid-manga"); 
      const gridOneShot = document.getElementById("grid-one-shot"); 
 
      gridManga.innerHTML = ""; 
      gridOneShot.innerHTML = ""; 
 
      let countManga = 0; 
      let countOneShot = 0; 
 
      Object.values(seriesData).forEach(series => { 
          if (series.chapters.length === 0) { 
              return; // No mostramos series vacías en la galería 
          } 
 
          const card = document.createElement("div"); 
          card.className = "series-card"; 
          card.setAttribute("data-type", series.type); 
          card.innerHTML = ` 
              <div class="series-cover-wrapper"> 
                  <span class="series-badge ${series.type}">${series.type}</span> 
                  <img class="series-cover" src="${series.cover}" alt="${series.title}" loading="lazy"> 
              </div> 
              <div class="series-info"> 
                  <h3 class="series-title">${series.title}</h3> 
                  <span class="series-author">Por ${series.author}</span> 
              </div> 
          `; 
 
          card.addEventListener("click", () => { 
              irADetalleSerie(series.id); 
          }); 
 
          if (series.type === "manga") { 
              gridManga.appendChild(card); 
              countManga++; 
          } else { 
              gridOneShot.appendChild(card); 
              countOneShot++; 
          } 
      }); 
 
      if (countManga === 0) { 
          gridManga.innerHTML = `<p style="color: #666; font-size: 1.1rem; text-align: center; grid-column: 1 / -1; margin: 40px 0; font-style: italic;">No hay mangas disponibles por el momento.</p>`; 
      } 
      if (countOneShot === 0) { 
          gridOneShot.innerHTML = `<p style="color: #666; font-size: 1.1rem; text-align: center; grid-column: 1 / -1; margin: 40px 0; font-style: italic;">No hay One Shots disponibles por el momento.</p>`; 
      } 
  } 
 
  function irADetalleSerie(seriesId, scroll = true) { 
      activeSeriesId = seriesId; 
      window.location.hash = `serie=${seriesId}`; 
 
      const series = seriesData[seriesId]; 
      if (!series) return; 
 
      document.getElementById("series-poster").src = obtenerUrlCDN(series.cover); 
      document.getElementById("series-title").innerText = series.title; 
      document.getElementById("series-author").innerText = `Autor: ${series.author}`; 
      document.getElementById("series-desc").innerText = series.description; 
 
      // Renderizar etiqueta de estado de la serie (Verde en emisión, Blanco en pausa, Rojo en terminado) 
      let labelStatus = ""; 
      let statusClass = series.status || "emision"; 
      if (series.type === "one-shot") { 
          labelStatus = "Terminado"; 
          statusClass = "terminado"; 
      } else { 
          if (statusClass === "emision") labelStatus = "En emisión"; 
          else if (statusClass === "pausa") labelStatus = "En pausa"; 
          else if (statusClass === "terminado") labelStatus = "Terminado"; 
      } 
 
      const metaContainer = document.querySelector("#series-detail-container .series-detail-meta"); 
      if (metaContainer) { 
          // Eliminar badge anterior si existe para evitar duplicación 
          const oldBadge = metaContainer.querySelector(".status-badge"); 
          if (oldBadge) oldBadge.remove(); 
 
          // Crear y añadir nuevo badge de estado 
          const badgeSpan = document.createElement("span"); 
          badgeSpan.className = `status-badge ${statusClass}`; 
          badgeSpan.innerText = labelStatus; 
          metaContainer.appendChild(badgeSpan); 
      } 
 
      // Renderizar capítulos de esta serie 
      const contenedorCapitulos = document.getElementById("chapters"); 
      contenedorCapitulos.innerHTML = ""; 
 
      // Copiamos la lista de capítulos de esta serie a la variable global listaCapitulosGuardados 
      // para que el visor pueda navegar secuencialmente entre ellos 
      listaCapitulosGuardados = series.chapters; 
 
      if (listaCapitulosGuardados.length === 0) { 
          contenedorCapitulos.innerHTML = `<p style="color:#666; font-size:1rem; text-align:center; margin:30px 0;">¡Próximamente nuevos capítulos!</p>`; 
      } else { 
          listaCapitulosGuardados.forEach((cap) => { 
              const card = document.createElement("div"); 
              card.className = "chapter"; 
               
              // Determinar título del capítulo (sin numeración si es One Shot) 
              let tituloCap = ""; 
              if (series.type === "one-shot") { 
                  tituloCap = "Leer One Shot"; 
              } else { 
                  tituloCap = formatearNombreCapitulo(cap.name); 
              } 
 
              card.innerHTML = ` 
              <div class="chapter-header"> 
                  <div class="chapter-left"> 
                      <img class="chapter-thumb" src="${obtenerUrlCDN(cap.images[0].download_url)}"> 
                      <div><h3>${tituloCap}</h3><div class="chapter-views" id="views-${cap.uniqueId}">...</div></div> 
                  </div> 
                  <div>▶</div> 
              </div> 
              `; 
              card.querySelector(".chapter-header").addEventListener("click", () => { 
                  const index = listaCapitulosGuardados.findIndex(c => c.name === cap.name); 
                  window.abrirVisor(index); 
              }); 
              contenedorCapitulos.appendChild(card); 
              window.escucharVisitasCapitulo(cap.uniqueId, card.querySelector(`#views-${cap.uniqueId}`)); 
          }); 
      } 
 
      // Switch views 
      document.getElementById("gallery-home-section").style.display = "none"; 
      document.getElementById("aviso-section").style.display = "none"; 
      document.getElementById("series-detail-container").style.display = "block"; 
 
      if (scroll) { 
          window.scrollTo({ top: 0, behavior: 'smooth' }); 
      }

  function comprobarRutasHash() { 
      const hash = window.location.hash; 
      if (hash.startsWith("#capitulo=")) { 
          const nombreCap = hash.replace("#capitulo=", ""); 
          // Buscamos a qué serie pertenece 
          let serieEncontrada = null; 
          let capIndex = -1; 
 
          for (const sId in seriesData) { 
              const idx = seriesData[sId].chapters.findIndex(c => c.name === nombreCap); 
              if (idx !== -1) { 
                  serieEncontrada = sId; 
                  capIndex = idx; 
                  break; 
              } 
          } 
 
          if (serieEncontrada && capIndex !== -1) { 
              irADetalleSerie(serieEncontrada, false); 
              window.abrirVisor(capIndex); 
          } 
      } else if (hash.startsWith("#serie=")) { 
          const seriesId = hash.replace("#serie=", ""); 
          if (seriesData[seriesId]) { 
              irADetalleSerie(seriesId); 
          } 
      } else { 
          // Si no hay hash de detalle o visor, nos aseguramos de mostrar la galería 
          document.getElementById("viewer-container").style.display = "none"; 
          document.body.style.overflow = "auto"; 
          document.getElementById("series-detail-container").style.display = "none"; 
          document.getElementById("gallery-home-section").style.display = "block"; 
          document.getElementById("aviso-section").style.display = "block"; 
      } 
  } 
 
  window.addEventListener("hashchange", comprobarRutasHash); 
 
  window.abrirVisor = function(index, scrollAComentarios = false) { 
      if (index < 0 || index >= listaCapitulosGuardados.length) return; 
      window.cancelReply(); 
      indiceCapituloActual = index; 
      const capitulo = listaCapitulosGuardados[indiceCapituloActual]; 
      window.location.hash = `capitulo=${capitulo.name}`; 
       
      // Obtener serie activa para comprobar el tipo y omitir numeración si es One Shot 
      const activeSeries = seriesData[activeSeriesId]; 
      let tituloFormateado = ""; 
      if (activeSeries && activeSeries.type === "one-shot") { 
          tituloFormateado = activeSeries.title; // Sólo el título de la obra 
      } else { 
          tituloFormateado = formatearNombreCapitulo(capitulo.name); 
      } 
 
      document.getElementById("viewer-title").innerText = tituloFormateado; 
      document.getElementById("viewer-title-bottom").innerText = tituloFormateado; 
 
      const contentDiv = document.getElementById("viewer-content"); 
      contentDiv.innerHTML = "";  
       
      // Creamos un DocumentFragment para acumular todas las imágenes en memoria, 
      // evitando reflows intermedios y reduciendo drásticamente el uso de CPU/GPU. 
      const fragment = document.createDocumentFragment(); 
 
      // Helper para crear y agregar dinámicamente el spinner de carga TikTok premium sólo cuando sea necesario 
      const crearYAgregarSpinner = (wrapper) => { 
          if (wrapper.querySelector(".loading-spinner")) return; 
 
          const spinner = document.createElement("div"); 
          spinner.className = "loading-spinner"; 
          
          const dotRed = document.createElement("div"); 
          dotRed.className = "dot dot-red"; 
          const dotGreen = document.createElement("div"); 
          dotGreen.className = "dot dot-green"; 
          const dotWhite = document.createElement("div"); 
          dotWhite.className = "dot dot-white"; 
          const dotGold = document.createElement("div"); 
          dotGold.className = "dot dot-gold"; 
           
          spinner.appendChild(dotRed); 
          spinner.appendChild(dotGreen); 
          spinner.appendChild(dotWhite); 
          spinner.appendChild(dotGold); 
          wrapper.appendChild(spinner); 
      }; 
       
      // Para optimización de carga ultrarrápida, implementamos un Intersection Observer 
      // para cargar perezosamente (lazy load) las imágenes a medida que entran en la pantalla. 
      const obsOptions = { 
          root: document.getElementById("viewer-container"), 
          rootMargin: "600px 0px", // Margen amplio para cargar imágenes antes de que sean visibles 
          threshold: 0.01 
      }; 
       
      const imgObserver = new IntersectionObserver((entries, observer) => { 
          entries.forEach(entry => { 
              if (entry.isIntersecting) { 
                  const wrapper = entry.target; 
                  const img = wrapper.querySelector("img"); 
                  if (img && img.dataset.src && !img.src) { 
                      crearYAgregarSpinner(wrapper); 
                      img.src = img.dataset.src; 
                  } 
                  observer.unobserve(wrapper); 
              } 
          }); 
      }, obsOptions); 
 
      capitulo.images.forEach((img, i) => { 
          // Crear contenedor del wrapper de la página 
          const wrapper = document.createElement("div"); 
          wrapper.className = "viewer-page-wrapper"; 
 
          // Crear la imagen 
          const imageElement = document.createElement("img"); 
          imageElement.decoding = "async"; 
           
          // Función para manejar la finalización de carga de la imagen 
          const alCargarImagen = () => { 
              imageElement.classList.add("loaded"); 
              const spinner = wrapper.querySelector(".loading-spinner"); 
              if (spinner) { 
                  spinner.style.opacity = "0"; 
                  // Eliminar el spinner del DOM después de la transición de opacidad 
                  setTimeout(() => { 
                      if (spinner.parentNode) { 
                          spinner.remove(); 
                      } 
                  }, 300); 
              } 
 
              // Si la imagen tiene dimensiones válidas, ajustar aspect-ratio del contenedor 
              if (imageElement.naturalWidth && imageElement.naturalHeight) { 
                  const ratio = imageElement.naturalWidth / imageElement.naturalHeight; 
                  wrapper.style.aspectRatio = ratio; 
              } 
          }; 
 
          imageElement.onload = alCargarImagen; 
          imageElement.onerror = () => { 
              // En caso de error, ocultamos el spinner para no bloquear visualmente 
              const spinner = wrapper.querySelector(".loading-spinner"); 
              if (spinner) { 
                  spinner.style.opacity = "0"; 
                  setTimeout(() => { if (spinner.parentNode) spinner.remove(); }, 300); 
              } 
          }; 
 
          const urlCDN = obtenerUrlCDN(img.download_url); 
 
          // Las primeras 3 páginas se cargan con prioridad "high" y ansiosamente (eager) 
          if (i < 3) { 
              imageElement.loading = "eager"; 
              imageElement.setAttribute("fetchpriority", "high"); 
              crearYAgregarSpinner(wrapper); 
              imageElement.src = urlCDN; 
              if (imageElement.complete) { 
                  alCargarImagen(); 
              } 
          } else { 
              // Las páginas subsiguientes se delegan al IntersectionObserver para un rendimiento de red de primer nivel 
              imageElement.loading = "lazy"; 
              imageElement.dataset.src = urlCDN; 
              imgObserver.observe(wrapper); 
          } 
 
          wrapper.appendChild(imageElement); 
          fragment.appendChild(wrapper); 
      }); 
       
      contentDiv.appendChild(fragment); 
       
      const esPrimero = indiceCapituloActual === 0; 
      const esUltimo = indiceCapituloActual === listaCapitulosGuardados.length - 1; 
 
      document.getElementById("btn-prev").disabled = esUltimo; 
      document.getElementById("btn-prev-bottom").disabled = esUltimo; 
      document.getElementById("btn-next").disabled = esPrimero; 
      document.getElementById("btn-next-bottom").disabled = esPrimero; 
      document.getElementById("viewer-container").style.display = "block"; 
      document.getElementById("viewer-container").scrollTo({ top: 0, behavior: "instant" }); 
      document.body.style.overflow = "hidden"; 
      window.verificarYBloquearNombre(); 
      window.registrarVisitaCapitulo(capitulo.uniqueId); 
      window.cargarComentariosDelCapitulo(capitulo.uniqueId, document.getElementById("lista-comentarios"), scrollAComentarios); 
  }

      } 
  }); 
 
  const cerrarVisor = () => { 
      document.getElementById("viewer-container").style.display = "none"; 
      document.body.style.overflow = "auto"; 
      if (activeSeriesId) { 
          window.location.hash = `serie=${activeSeriesId}`; 
      } else { 
          history.pushState("", document.title, window.location.pathname + window.location.search); 
      } 
  }; 
 
  document.getElementById("btn-close").addEventListener("click", cerrarVisor); 
  document.getElementById("btn-close-bottom").addEventListener("click", cerrarVisor); 
 
  document.getElementById("btn-cancel-reply").addEventListener("click", window.cancelReply); 
   
  const irAnterior = () => window.abrirVisor(indiceCapituloActual + 1); 
  const irSiguiente = () => window.abrirVisor(indiceCapituloActual - 1); 
 
  document.getElementById("btn-prev").addEventListener("click", irAnterior); 
  document.getElementById("btn-prev-bottom").addEventListener("click", irAnterior); 
  document.getElementById("btn-next").addEventListener("click", irSiguiente); 
  document.getElementById("btn-next-bottom").addEventListener("click", irSiguiente); 
 
  let ultimoScroll = 0; 
  const visorContainer = document.getElementById("viewer-container"); 
  const barraNav = document.getElementById("viewer-nav"); 
  const deltaScroll = 15; // Umbral de píxeles para evitar parpadeos en el deslizamiento de la barra de navegación 
  visorContainer.addEventListener("scroll", () => { 
      let scrollActual = visorContainer.scrollTop; 
      if (Math.abs(ultimoScroll - scrollActual) <= deltaScroll) return; 
       
      if (scrollActual > ultimoScroll && scrollActual > 80) { 
          barraNav.classList.add("hidden");  
      } else if (scrollActual < ultimoScroll) { 
          barraNav.classList.remove("hidden"); 
      } 
      ultimoScroll = scrollActual; 
  }, { passive: true }); 
 
  window.addEventListener("DOMContentLoaded", () => { 
      window.registrarVisitaInicio(); 
      window.escucharVisitasGlobales(); 
      cargarAvisos(); 
      inicializarGaleria(); 
      autoDetectarFavicon(); 
 
      // Configuración de los botones de pestañas (Tabs) 
      const tabBtns = document.querySelectorAll(".tab-btn"); 
      tabBtns.forEach(btn => { 
          btn.addEventListener("click", () => { 
              tabBtns.forEach(b => b.classList.remove("active")); 
              btn.classList.add("active"); 
 
              const targetTab = btn.getAttribute("data-tab"); 
              document.querySelectorAll(".gallery-section").forEach(sec => { 
                  sec.classList.remove("active"); 
              }); 
 
              if (targetTab === "manga") { 
                  document.getElementById("sec-manga").classList.add("active"); 
              } else { 
                  document.getElementById("sec-one-shot").classList.add("active"); 
              } 
          }); 
      }); 
 
      // Botón volver a galería 
      document.getElementById("btn-back-gallery").addEventListener("click", volverALagaleria); 
  }); 
</script> 
 
</body> 
</html>
