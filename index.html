<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIZUVICHI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    text-align:center;
    padding:30px 15px;
    border-bottom:2px solid #ff0000;
    box-shadow:0 0 20px #ff0000;
}

header h1{
    font-size:3rem;
    color:#fff;
    text-shadow:0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #b30000;
}

.section{
    width:95%;
    max-width:1000px;
    margin:25px auto;
}

.info-box{
    border:2px solid #b30000;
    box-shadow:0 0 15px #b30000;
    border-radius:12px;
    overflow:hidden;
    background: #0a0a0a;
}

.info-box img{
    width:100%;
    display:block;
    margin-bottom: 0;
}

.info-box img:not(:last-child) {
    border-bottom: 1px solid #b30000;
}

.chapter{
    border:2px solid #ff0000;
    border-radius:12px;
    margin-bottom:20px;
    overflow:hidden;
    box-shadow:0 0 15px #ff0000;
}

.chapter-header{
    padding:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#111;
}

.chapter-header:hover{
    background:#1a1a1a;
}

.chapter-left{
    display:flex;
    gap:15px;
    align-items:center;
}

.chapter-thumb{
    width:70px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

#viewer-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 9999;
    overflow-y: auto;
}

.viewer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: rgba(10, 10, 10, 0.95);
    position: sticky;
    top: 0;
    border-bottom: 2px solid #ff0000;
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    transition: top 0.3s ease; 
}

.viewer-nav.hidden {
    top: -80px; 
}

.viewer-btn {
    background: #111;
    color: #fff;
    border: 1px solid #ff0000;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: 0.2s;
}

.viewer-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 10px #ff0000;
}

.viewer-btn:disabled {
    border-color: #333;
    color: #555;
    background: #0a0a0a;
    cursor: not-allowed;
    box-shadow: none;
}

.viewer-content {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 10px;
}

/* MODIFICADO: Agregada la separación y sombras de estilo manga oficial */
.viewer-content img {
    width: 100%;
    display: block;
    margin-bottom: 30px; /* Espacio de separación entre páginas */
    border-radius: 6px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); /* Sombra para dar profundidad */
    border: 1px solid #111; /* Borde sutil para despegar el arte del fondo negro */
}

.social{
    text-align:center;
    margin:40px 0;
}

.social a{
    color:white;
    text-decoration:none;
    font-size:1.3rem;
    margin:0 25px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: 0.3s;
}

.social a:hover{
    color: #ff0000;
    text-shadow: 0 0 10px #ff0000;
}
</style>
</head>

<body>

<header>
    <h1>Thalesis</h1>
</header>

<div class="section">
    <h2>📢 Nuevo</h2>
    <div class="info-box" id="aviso-container"></div>
</div>

<div class="section">
    <h2>📖 CAPÍTULOS</h2>
    <div id="chapters"></div>
</div>

<div id="viewer-container">
    <div class="viewer-nav" id="viewer-nav">
        <button class="viewer-btn" id="btn-prev">◀ Ant</button>
        <h3 id="viewer-title">Capítulo</h3>
        <button class="viewer-btn" id="btn-close">Volver ✕</button>
        <button class="viewer-btn" id="btn-next">Sig ▶</button>
    </div>
    <div class="viewer-content" id="viewer-content"></div>
</div>

<div class="social">
    <a href="https://www.youtube.com/@RAYLINAC-n6x" target="_blank">
        <i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube
    </a>
    <a href="https://www.tiktok.com/@r_.fin.com" target="_blank">
        <i class="fab fa-tiktok"></i> TikTok
    </a>
</div>

<script>

const usuario = "railinc035-gif";
const repo = "Mizuvichi";

const api =
`https://api.github.com/repos/${usuario}/${repo}/contents`;

let listaCapitulosGuardados = [];
let indiceCapituloActual = -1;

// DICCIONARIO DE NOMBRES
const nombresDeCapitulos = {
    "Cap_01": "Capítulo 01: Funeral para nadie"
};

function formatearNombreCapitulo(nombreCarpeta) {
    if (nombresDeCapitulos[nombreCarpeta]) {
        return nombresDeCapitulos[nombreCarpeta];
    }
    return nombreCarpeta.replace("Cap_", "Capítulo ");
}

async function cargarAvisos() {
    const contenedorAvisos = document.getElementById("aviso-container");
    
    try {
        const respuesta = await fetch(`${api}/Aviso`);
        
        if (!respuesta.ok) {
            contenedorAvisos.parentElement.style.display = "none";
            return;
        }

        const archivos = await respuesta.json();
        
        const pngs = archivos
            .filter(p => p.name.toLowerCase().endsWith(".png"))
            .sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

        if (pngs.length === 0) {
            contenedorAvisos.parentElement.style.display = "none";
            return;
        }

        pngs.forEach(img => {
            const imageElement = document.createElement("img");
            imageElement.src = img.download_url;
            imageElement.alt = "Aviso Informativo";
            contenedorAvisos.appendChild(imageElement);
        });

    } catch (error) {
        console.error("Error cargando los avisos:", error);
        contenedorAvisos.parentElement.style.display = "none";
    }
}

async function cargarCapitulos(){

    const contenedor =
    document.getElementById("chapters");

    const respuesta =
    await fetch(api);

    const archivos =
    await respuesta.json();

    const capitulos =
    archivos.filter(
        item =>
        item.type === "dir" &&
        item.name.startsWith("Cap_")
    );

    capitulos.sort((a,b)=>
        b.name.localeCompare(a.name)
    );

    for(const cap of capitulos){

        const capApi =
        `${api}/${cap.name}`;

        const capResp =
        await fetch(capApi);

        const paginas =
        await capResp.json();

        const pngs =
        paginas
        .filter(
            p =>
            p.name.toLowerCase().endsWith(".png")
        )
        .sort((a,b)=>
            a.name.localeCompare(
                b.name,
                undefined,
                {numeric:true}
            )
        );

        if(pngs.length === 0) continue;

        listaCapitulosGuardados.push({
            name: cap.name,
            images: pngs
        });

        const miniatura =
        pngs[0].download_url;

        const card =
        document.createElement("div");

        card.className = "chapter";

        let html = `
        <div class="chapter-header">
            <div class="chapter-left">
                <img class="chapter-thumb"
                src="${miniatura}">
                <div>
                    <h3>${formatearNombreCapitulo(cap.name)}</h3>
                </div>
            </div>
            <div>▶</div>
        </div>
        `;

        card.innerHTML = html;

        const header =
        card.querySelector(".chapter-header");

        header.addEventListener("click",()=>{
            const index = listaCapitulosGuardados.findIndex(c => c.name === cap.name);
            abrirVisor(index);
        });

        contenedor.appendChild(card);
    }
}

function abrirVisor(index) {
    if (index < 0 || index >= listaCapitulosGuardados.length) return;
    
    indiceCapituloActual = index;
    const capitulo = listaCapitulosGuardados[indiceCapituloActual];
    
    document.getElementById("viewer-title").innerText = formatearNombreCapitulo(capitulo.name);
    
    const contentDiv = document.getElementById("viewer-content");
    contentDiv.innerHTML = ""; 
    
    capitulo.images.forEach(img => {
        const imageElement = document.createElement("img");
        imageElement.src = img.download_url;
        contentDiv.appendChild(imageElement);
    });
    
    document.getElementById("btn-prev").disabled = indiceCapituloActual === listaCapitulosGuardados.length - 1;
    document.getElementById("btn-next").disabled = indiceCapituloActual === 0;
    
    document.getElementById("viewer-container").style.display = "block";
    document.getElementById("viewer-container").scrollTop = 0;
    document.body.style.overflow = "hidden";
}

function cerrarVisor() {
    document.getElementById("viewer-container").style.display = "none";
    document.body.style.overflow = "auto";
}

document.getElementById("btn-close").addEventListener("click", cerrarVisor);

document.getElementById("btn-prev").addEventListener("click", () => {
    abrirVisor(indiceCapituloActual + 1);
});

document.getElementById("btn-next").addEventListener("click", () => {
    abrirVisor(indiceCapituloActual - 1);
});

let ultimoScroll = 0;
const barraNav = document.getElementById("viewer-nav");
const visorContainer = document.getElementById("viewer-container");

visorContainer.addEventListener("scroll", () => {
    let scrollActual = visorContainer.scrollTop;

    if (scrollActual > ultimoScroll && scrollActual > 50) {
        barraNav.classList.add("hidden"); 
    } else {
        barraNav.classList.remove("hidden");
    }
    ultimoScroll = scrollActual;
});

cargarAvisos();
cargarCapitulos();

</script>

</body>
</html>
