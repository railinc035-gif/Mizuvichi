<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x: hidden;
}

header{
    position: relative; 
    text-align:center;
    padding:30px 15px;
    border-bottom:2px solid #300000; 
    transition: all 0.4s ease;
}

header h1{
    font-size:3rem;
    color:#888; 
    transition: all 0.4s ease;
}

header:hover, header:active {
    border-bottom:2px solid #ff0000;
    box-shadow:0 0 20px #ff0000;
}

header:hover h1, header:active h1 {
    color:#fff;
    text-shadow:0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #b30000;
}

.global-counter {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 0.9rem;
    color: #666;
    background: #0a0a0a;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
}
header:hover .global-counter, header:active .global-counter {
    color: #ff0000;
    border-color: #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
}

.section{
    width:95%;
    max-width:1000px;
    margin:25px auto;
}

.info-box {
    border: none;
    border-radius: 12px;
    overflow: hidden;
    background: #050505;
    padding: 10px;
    transition: all 0.4s ease;
}

.info-box:hover, .info-box:active {
    border-color: transparent;
    box-shadow: none;
}

.aviso-wrapper {
    position: relative; 
    width: 100%;
    display: block;
}

 .info-box img {
    width: 90%;        /* La imagen intentará ocupar el espacio disponible */
    max-width: 340px;   /* ESTO ES LO QUE HACE QUE NO SE VEAN GIGANTES */
    margin: 0 auto;     /* Esto mantiene la imagen centrada */
    display: block;
    border-radius: 8px;
}

.aviso-wrapper:not(:last-child) {
    margin-bottom: 100px; 
}

.badge-nuevo {
    position: absolute;
    top: 12px;
    left: 12px;
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 0.8rem;
    padding: 5px 12px;
    border-radius: 6px;
    text-transform: uppercase;
    box-shadow: 0 0 15px #00ff66; 
    z-index: 10;
    letter-spacing: 1px;
}

.chapter{
    border:2px solid #300000; 
    border-radius:12px;
    margin-bottom:20px;
    overflow:hidden;
    transition: all 0.3s ease; 
}

.chapter:hover, .chapter:active {
    border-color: #ff0000;
    box-shadow: 0 0 20px #ff0000;
    transform: translateY(-2px); 
}

.chapter-header{
    padding:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#111;
    transition: background 0.3s;
}

.chapter-header:hover {
    background:#1a1a1a;
}

.chapter-left{
    display:flex;
    gap:15px;
    align-items:center;
}

.chapter-thumb{
    width:70px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.chapter-views {
    font-size: 0.85rem;
    color: #888;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
}

#viewer-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 9999;
    overflow-y: auto;
}

.viewer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: rgba(10, 10, 10, 0.95);
    position: sticky;
    top: 0;
    border-bottom: 2px solid #ff0000;
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    transition: top 0.3s ease; 
}

.viewer-nav.hidden {
    top: -80px; 
}

.viewer-btn {
    background: #111;
    color: #fff;
    border: 1px solid #ff0000;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: 0.2s;
}

.viewer-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 10px #ff0000;
}

.viewer-btn:disabled {
    border-color: #333;
    color: #555;
    background: #0a0a0a;
    cursor: not-allowed;
    box-shadow: none;
}

.viewer-content {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 10px;
}

.viewer-content img {
    width: 100%;
    display: block;
    margin-bottom: 30px; 
    border-radius: 6px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); 
    border: 1px solid #111; 
}

/* ==========================================================================
   SECCIÓN DE COMENTARIOS
   ========================================================================== */
.comments-section {
    max-width: 800px;
    margin: 40px auto 60px auto;
    padding: 20px 15px;
    background: #0a0a0a;
    border-top: 2px solid #300000;
    border-radius: 12px;
    position: relative;
}

.comments-section h4 {
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 20px;
    border-left: 4px solid #ff0000;
    padding-left: 10px;
}

.comment-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 30px;
}

.comment-form input, .comment-form textarea {
    background: #111;
    border: 1px solid #300000;
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: Arial, sans-serif;
    outline: none;
    transition: border-color 0.3s;
}

.comment-form input:focus, .comment-form textarea:focus {
    border-color: #ff0000;
    box-shadow: 0 0 8px rgba(255, 0, 0, 0.2);
}

.comment-form input:disabled {
    background: #151515;
    border-color: #222;
    color: #888;
    cursor: not-allowed;
}

.comment-form textarea {
    resize: vertical;
    min-height: 80px;
}

.comment-submit-btn {
    align-self: flex-end;
    background: #111;
    color: #fff;
    border: 1px solid #ff0000;
    padding: 10px 25px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: all 0.3s;
}

.comment-submit-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 15px #ff0000;
}

.comments-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.comment-card {
    background: #111;
    border: 1px solid #200000;
    padding: 15px;
    border-radius: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: opacity 0.3s ease;
}

.comment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.comment-author-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
}

.comment-author {
    font-weight: bold;
    color: #ff0000;
    font-size: 0.95rem;
}

.comment-date {
    font-size: 0.8rem;
    color: #666;
}

.badge-autor {
    background: #ff0000;
    color: #000;
    font-weight: bold;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    box-shadow: 0 0 10px #ff0000;
    letter-spacing: 0.5px;
}

.comment-text {
    color: #ddd;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
}

.comment-actions {
    display: flex;
    gap: 15px;
    align-items: center;
    margin-top: 5px;
}

.action-btn {
    background: none;
    border: none;
    color: #aaa; 
    cursor: pointer;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    position: relative;
}

.action-btn.like-btn:hover {
    color: #ff3366;
}

.action-btn.like-btn.liked {
    color: #ff3366;
}

.action-btn.delete-btn {
    display: none; 
    color: #aaa;
    padding: 4px 8px;
    border-radius: 4px;
}

.action-btn.delete-btn:hover {
    color: #fff;
    background: #b30000;
}

.comment-card.es-mio .action-btn.delete-btn {
    display: inline-flex; 
}

/* ANIMACIONES */
.floating-emoji {
    position: absolute;
    pointer-events: none;
    z-index: 999;
    font-size: 1.5rem;
    animation: flotarEmoji 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes flotarEmoji {
    0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
    }
    100% {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2);
        opacity: 0;
    }
}

.particle-fx {
    position: absolute;
    pointer-events: none;
    z-index: 999;
    width: 6px;
    height: 6px;
    border-radius: 2px;
    animation: explotarParticula 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
}

@keyframes explotarParticula {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(var(--mx), var(--my));
        opacity: 0;
    }
}

.social{
    text-align:center;
    margin:40px 0;
}

.social a{
    color:#888;
    text-decoration:none;

    margin:0 25px;

    align-items: center;
    gap: 10px;
    transition: 0.3s;
}

.social a:hover, .social a:active{
    color: #ff0000;
    text-shadow: 0 0 10px #ff0000;
}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction, push, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBSO8Cfuq2t9xvJ_jJMAI-ygpgJ1ezFUHQ",
    authDomain: "webmanga-7b2cb.firebaseapp.com",
    databaseURL: "https://webmanga-7b2cb-default-rtdb.firebaseio.com",
    projectId: "webmanga-7b2cb",
    storageBucket: "webmanga-7b2cb.firebasestorage.app",
    messagingSenderId: "956720725778",
    appId: "1:956720725778:web:ecb504f7c91e220a393dcb",
    measurementId: "G-6ESEFLWEX2"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  const CLAVE_SECRETA_AUTOR = "thalesis2026"; 

  // --- VISITAS ---
  window.registrarVisitaInicio = function() {
      const ahora = Date.now();
      const ultimoRegistro = localStorage.getItem('cooldown_inicio');
      if (!ultimoRegistro || (ahora - ultimoRegistro > 600000)) {
          const refInicio = ref(database, 'contadores/visitas_inicio');
          runTransaction(refInicio, (actual) => (actual || 0) + 1);
          localStorage.setItem('cooldown_inicio', ahora);
      }
  };

  window.escucharVisitasGlobales = function() {
      const refInicio = ref(database, 'contadores/visitas_inicio');
      const elementoGlobal = document.getElementById("num-global");
      onValue(refInicio, (snapshot) => {
          elementoGlobal.innerText = snapshot.val() || 0;
      });
  };

  window.registrarVisitaCapitulo = function(nombreCap) {
      const ahora = Date.now();
      const ultimoRegistro = localStorage.getItem('cooldown_' + nombreCap);
      if (!ultimoRegistro || (ahora - ultimoRegistro > 600000)) {
          const refCap = ref(database, 'contadores/capitulo_' + nombreCap);
          runTransaction(refCap, (actual) => (actual || 0) + 1);
          localStorage.setItem('cooldown_' + nombreCap, ahora);
      }
  };

  window.escucharVisitasCapitulo = function(nombreCap, elementoHtml) {
      const refCap = ref(database, 'contadores/capitulo_' + nombreCap);
      onValue(refCap, (snapshot) => {
          const visitas = snapshot.val() || 0;
          elementoHtml.innerHTML = `<i class="fas fa-eye"></i> ${visitas} lecturas`;
      });
  };

  window.calcularTiempoRelativo = function(timestamp) {
      if (!timestamp) return "Hace un momento";
      const ahora = Date.now();
      const diferencia = ahora - timestamp;

      const segundos = Math.floor(diferencia / 1000);
      const minutos = Math.floor(segundos / 60);
      const horas = Math.floor(minutos / 60);
      const dias = Math.floor(horas / 24);

      if (segundos < 60) return "Hace un momento";
      if (minutos < 60) return `Hace ${minutos} ${minutos === 1 ? 'minuto' : 'minutos'}`;
      if (horas < 24) return `Hace ${horas} ${horas === 1 ? 'hora' : 'horas'}`;
      if (dias === 1) return "Ayer";
      if (dias < 7) return `Hace ${dias} días`;
      
      const fechaObj = new Date(timestamp);
      return fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  };

  // --- NUEVA FUNCIÓN: Controlar bloqueo de la caja de nombres ---
  window.verificarYBloquearNombre = function() {
      const inputNombre = document.getElementById("comentario-nombre");
      if (!inputNombre) return;

      const nombreGuardado = localStorage.getItem("mi_nombre_fijo");
      const soyElAutorLogueado = localStorage.getItem("autor_autenticado") === "true";

      if (soyElAutorLogueado) {
          inputNombre.value = "Raylin AC";
          inputNombre.disabled = true;
      } else if (nombreGuardado) {
          inputNombre.value = nombreGuardado;
          inputNombre.disabled = true; 
      }
  };

  // --- COMENTARIOS ---
  let desvincularEscuchaComentarios = null;

  window.cargarComentariosDelCapitulo = function(nombreCap, contenedorHtml, scrollAlFinal = false) {
      if (desvincularEscuchaComentarios) desvincularEscuchaComentarios();

      const refComentarios = ref(database, 'comentarios/' + nombreCap);
      
      desvincularEscuchaComentarios = onValue(refComentarios, (snapshot) => {
          contenedorHtml.innerHTML = "";
          const datos = snapshot.val();
          
          if (!datos) {
              contenedorHtml.innerHTML = `<p style="color:#555; font-size:0.9rem; text-align:center;">Nadie ha comentado aún. ¡Sé el primero!</p>`;
              return;
          }

          const listaOrdenada = Object.keys(datos).reverse();

          let misComentariosGuardados = [];
          try {
              misComentariosGuardados = JSON.parse(localStorage.getItem("mis_comentarios_v3") || "[]");
          } catch(e) { misComentariosGuardados = []; }

          const soyElAutorLogueado = localStorage.getItem("autor_autenticado") === "true";
          const nombreLocalFijo = localStorage.getItem("mi_nombre_fijo");

          listaOrdenada.forEach((idComentario) => {
              const info = datos[idComentario];
              const card = document.createElement("div");
              card.className = "comment-card";
              card.id = "card-" + idComentario;
              
              // REGLA DEFINITIVA Y EXTREMADAMENTE SEGURA CONTRA BUGS:
              let esMiComentarioReal = false;

              if (info.esAutor === true) {
                  if (soyElAutorLogueado) esMiComentarioReal = true;
              } else {
                  // Eres el dueño si el ID está en tu historial local Y tu alias fijo coincide con el del mensaje
                  if (misComentariosGuardados.includes(idComentario) && nombreLocalFijo === info.autor) {
                      esMiComentarioReal = true;
                  }
              }

              if (esMiComentarioReal) {
                  card.classList.add("es-mio");
              }

              let badgeAutorHtml = "";
              if (info.esAutor === true) {
                  badgeAutorHtml = `<span class="badge-autor">Autor</span>`;
              }

              const textoFecha = window.calcularTiempoRelativo(info.fecha);
              const yaTieneLike = localStorage.getItem(`liked_${idComentario}`);
              const claseLiked = yaTieneLike ? "liked" : "";
              const colorCorazon = yaTieneLike ? '#ff3366' : '#555';
              
              card.innerHTML = `
                  <div class="comment-header">
                      <div class="comment-author-wrapper">
                          <span class="comment-author">${escaperHtml(info.autor)}</span>
                          ${badgeAutorHtml}
                          <span class="comment-date">${textoFecha}</span>
                      </div>
                      <button class="action-btn delete-btn" data-id="${idComentario}"><i class="fas fa-times"></i> Borrar</button>
                  </div>
                  <p class="comment-text">${escaperHtml(info.texto)}</p>
                  <div class="comment-actions">
                      <button class="action-btn like-btn ${claseLiked}" data-id="${idComentario}">
                          <i class="fas fa-heart" style="color: ${colorCorazon}"></i> <span>${info.likes || 0}</span>
                      </button>
                  </div>
              `;

              card.querySelector(".like-btn").addEventListener("click", (e) => {
                  const haDadoLike = localStorage.getItem(`liked_${idComentario}`);
                  const refLike = ref(database, `comentarios/${nombreCap}/${idComentario}/likes`);
                  
                  if (!haDadoLike) {
                      localStorage.setItem(`liked_${idComentario}`, 'true');
                      e.currentTarget.classList.add("liked");
                      e.currentTarget.querySelector("i").style.color = "#ff3366";
                      window.crearEfectoLluviaCorazones(e); 
                      runTransaction(refLike, (actual) => (actual || 0) + 1);
                  } else {
                      localStorage.removeItem(`liked_${idComentario}`);
                      e.currentTarget.classList.remove("liked");
                      e.currentTarget.querySelector("i").style.color = "#555";
                      runTransaction(refLike, (actual) => {
                          let nuevoValor = (actual || 0) - 1;
                          return nuevoValor < 0 ? 0 : nuevoValor; 
                      });
                  }
              });

              card.querySelector(".delete-btn").addEventListener("click", (e) => {
                  const confirmar = confirm("¿Seguro que quieres eliminar tu comentario?");
                  if (confirmar) {
                      window.crearEfectoExplosionComentario(e.currentTarget, card); 
                      setTimeout(() => {
                          const refBorrar = ref(database, `comentarios/${nombreCap}/${idComentario}`);
                          remove(refBorrar);
                      }, 400);
                  }
              });

              contenedorHtml.appendChild(card);
          });

          if (scrollAlFinal) {
              setTimeout(() => {
                  const seccionComentarios = document.getElementById("seccion-comentarios-root");
                  if (seccionComentarios) {
                      seccionComentarios.scrollIntoView({ behavior: "smooth" });
                  }
              }, 300);
          }
      });
  };

  window.intentarPublicarComentario = function(nombreCap, autor, texto) {
      let esAutorReal = false;
      const nombreLimpio = autor.trim();

      if (nombreLimpio === "Raylin AC") {
          const yaLogueado = localStorage.getItem("autor_autenticado");

          if (yaLogueado === "true") {
              esAutorReal = true;
          } else {
              const pass = prompt("Para comentar como Creador, introduce tu contraseña de seguridad:");
              if (pass === CLAVE_SECRETA_AUTOR) {
                  esAutorReal = true;
                  localStorage.setItem("autor_autenticado", "true"); 
                  window.verificarYBloquearNombre(); 
              } else {
                  alert("Contraseña incorrecta. No puedes comentar usando el nombre del Creador.");
                  return; 
              }
          }
      } else {
          // Si es un lector normal y no se ha guardado su nombre, lo congelamos ahora mismo
          if (!localStorage.getItem("mi_nombre_fijo")) {
              localStorage.setItem("mi_nombre_fijo", nombreLimpio);
              window.verificarYBloquearNombre();
          }
      }

      const refComentarios = ref(database, 'comentarios/' + nombreCap);
      const nuevoComentarioRef = push(refComentarios);
      const idNuevoComentario = nuevoComentarioRef.key;

      set(nuevoComentarioRef, {
          autor: esAutorReal ? "Raylin AC" : localStorage.getItem("mi_nombre_fijo"),
          texto: texto,
          likes: 0,
          esAutor: esAutorReal, 
          fecha: Date.now()
      }).then(() => {
          let misComentarios = [];
          try {
              misComentarios = JSON.parse(localStorage.getItem("mis_comentarios_v3") || "[]");
          } catch(e) { misComentarios = []; }
          
          misComentarios.push(idNuevoComentario);
          localStorage.setItem("mis_comentarios_v3", JSON.stringify(misComentarios));
      });
  };

  function escaperHtml(texto) {
      return texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
</script>

<script>
const usuario = "railinc035-gif";
const repo = "Mizuvichi";
const api = `https://api.github.com/repos/${usuario}/${repo}/contents`;

let listaCapitulosGuardados = [];
let indiceCapituloActual = -1;

const nombresDeCapitulos = {
    "Cap_01": "Capítulo 01: Funeral para nadie"
};

function formatearNombreCapitulo(nombreCarpeta) {
    if (nombresDeCapitulos[nombreCarpeta]) {
        return nombresDeCapitulos[nombreCarpeta];
    }
    return nombreCarpeta.replace("Cap_", "Capítulo ");
}

window.crearEfectoLluviaCorazones = function(e) {
    const emojis = ['❤️', '✨', '🔥', '💖'];
    const cantidad = 12; 
    const rootSeccion = document.getElementById("seccion-comentarios-root");
    
    const boundsRoot = rootSeccion.getBoundingClientRect();
    const boundsBtn = e.currentTarget.getBoundingClientRect();
    
    const xOriginal = boundsBtn.left - boundsRoot.left + boundsBtn.width / 2;
    const yOriginal = boundsBtn.top - boundsRoot.top + boundsBtn.height / 2;

    for (let i = 0; i < cantidad; i++) {
        const span = document.createElement('span');
        span.className = 'floating-emoji';
        span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        
        span.style.left = `${xOriginal}px`;
        span.style.top = `${yOriginal}px`;

        const angulo = (Math.random() * 120 + 30) * (Math.PI / 180); 
        const velocidad = Math.random() * 100 + 50;
        
        const xDestino = Math.cos(angulo) * velocidad * (Math.random() > 0.5 ? 1 : -1);
        const yDestino = -Math.sin(angulo) * velocidad - 30; 

        span.style.setProperty('--x', `${xDestino}px`);
        span.style.setProperty('--y', `${yDestino}px`);

        rootSeccion.appendChild(span);
        span.addEventListener('animationend', () => span.remove());
    }
};

window.crearEfectoExplosionComentario = function(botonClicado, elementoCard) {
    const rootSeccion = document.getElementById("seccion-comentarios-root");
    const boundsRoot = rootSeccion.getBoundingClientRect();
    const boundsBtn = botonClicado.getBoundingClientRect();
    const cantidadParticulas = 40;
    const colores = ['#ff0000', '#b30000', '#300000', '#555555', '#222222'];

    elementoCard.style.opacity = '0';

    const xCentro = boundsBtn.left - boundsRoot.left + boundsBtn.width / 2;
    const yCentro = boundsBtn.top - boundsRoot.top + boundsBtn.height / 2;

    for (let i = 0; i < cantidadParticulas; i++) {
        const particula = document.createElement('div');
        particula.className = 'particle-fx';
        
        particula.style.left = `${xCentro}px`;
        particula.style.top = `${yCentro}px`;
        particula.style.background = colores[Math.floor(Math.random() * colores.length)];
        
        if(particula.style.background.includes('255') || particula.style.background.includes('b3')) {
            particula.style.boxShadow = `0 0 8px ${particula.style.background}`;
        }

        const mx = (Math.random() - 0.5) * 250; 
        const my = (Math.random() * 150) - 50;  

        particula.style.setProperty('--mx', `${mx}px`);
        particula.style.setProperty('--my', `${my}px`);

        rootSeccion.appendChild(particula);
        particula.addEventListener('animationend', () => particula.remove());
    }
};

async function cargarAvisos() {
    const contenedorAvisos = document.getElementById("aviso-container");
    try {
        const respuesta = await fetch(`${api}/Aviso`);
        if (!respuesta.ok) {
            contenedorAvisos.parentElement.style.display = "none";
            return;
        }
        const archivos = await respuesta.json();
        const pngs = archivos
            .filter(p => p.name.toLowerCase().endsWith(".png"))
            .sort((a, b) => b.name.localeCompare(a.name, undefined, {numeric: true}));

        if (pngs.length === 0) {
            contenedorAvisos.parentElement.style.display = "none";
            return;
        }

        pngs.forEach((img, index) => {
            const wrapper = document.createElement("div");
            wrapper.className = "aviso-wrapper";
            if (index === 0) {
                const tag = document.createElement("span");
                tag.className = "badge-nuevo";
                tag.innerText = "Nuevo";
                wrapper.appendChild(tag);
            }
            const imageElement = document.createElement("img");
            imageElement.src = img.download_url;
            imageElement.alt = "Aviso Informativo";
            wrapper.appendChild(imageElement);
            contenedorAvisos.appendChild(wrapper);
        });
    } catch (error) {
        console.error("Error cargando los avisos:", error);
        contenedorAvisos.parentElement.style.display = "none";
    }
}

async function cargarCapitulos(){
    const contenedor = document.getElementById("chapters");
    try {
        const respuesta = await fetch(api);
        const archivos = await respuesta.json();
        const capitulos = archivos.filter(item => item.type === "dir" && item.name.startsWith("Cap_"));
        
        capitulos.sort((a,b)=> b.name.localeCompare(a.name));

        for(const cap of capitulos){
            const capApi = `${api}/${cap.name}`;
            const capResp = await fetch(capApi);
            const paginas = await capResp.json();
            const pngs = paginas
                .filter(p => p.name.toLowerCase().endsWith(".png"))
                .sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true}));

            if(pngs.length === 0) continue;

            listaCapitulosGuardados.push({
                name: cap.name,
                images: pngs
            });

            const miniatura = pngs[0].download_url;
            const card = document.createElement("div");
            card.className = "chapter";

            let html = `
            <div class="chapter-header">
                <div class="chapter-left">
                    <img class="chapter-thumb" src="${miniatura}">
                    <div>
                        <h3>${formatearNombreCapitulo(cap.name)}</h3>
                        <div class="chapter-views" id="views-${cap.name}">Cargando lecturas...</div>
                    </div>
                </div>
                <div>▶</div>
            </div>
            `;
            card.innerHTML = html;

            const header = card.querySelector(".chapter-header");
            header.addEventListener("click",()=>{
                const index = listaCapitulosGuardados.findIndex(c => c.name === cap.name);
                abrirVisor(index);
            });

            contenedor.appendChild(card);

            const elementoVistas = card.querySelector(`#views-${cap.name}`);
            if (window.escucharVisitasCapitulo) {
                window.escucharVisitasCapitulo(cap.name, elementoVistas);
            }
        }

        verificarHashRuta();

    } catch (error) {
        console.error("Error cargando capítulos:", error);
    }
}

function verificarHashRuta() {
    const hash = window.location.hash;
    if (hash && hash.startsWith("#capitulo=")) {
        const nombreCap = hash.replace("#capitulo=", "");
        const index = listaCapitulosGuardados.findIndex(c => c.name === nombreCap);
        if (index !== -1) {
            abrirVisor(index, true); 
        }
    }
}

function abrirVisor(index, scrollAComentarios = false) {
    if (index < 0 || index >= listaCapitulosGuardados.length) return;
    
    indiceCapituloActual = index;
    const capitulo = listaCapitulosGuardados[indiceCapituloActual];
    
    window.location.hash = `capitulo=${capitulo.name}`;
    
    document.getElementById("viewer-title").innerText = formatearNombreCapitulo(capitulo.name);
    
    const contentDiv = document.getElementById("viewer-content");
    contentDiv.innerHTML = ""; 
    
    capitulo.images.forEach(img => {
        const imageElement = document.createElement("img");
        imageElement.src = img.download_url;
        contentDiv.appendChild(imageElement);
    });
    
    document.getElementById("btn-prev").disabled = indiceCapituloActual === listaCapitulosGuardados.length - 1;
    document.getElementById("btn-next").disabled = indiceCapituloActual === 0;
    
    document.getElementById("viewer-container").style.display = "block";
    
    if (!scrollAComentarios) {
        document.getElementById("viewer-container").scrollTop = 0;
    }
    document.body.style.overflow = "hidden";

    // NUEVO: Bloquear el input de nombre al abrir la vista si ya existe registro
    if (window.verificarYBloquearNombre) {
        window.verificarYBloquearNombre();
    }

    if (window.registrarVisitaCapitulo) {
        window.registrarVisitaCapitulo(capitulo.name);
    }

    const listaHtml = document.getElementById("lista-comentarios");
    if (window.cargarComentariosDelCapitulo) {
        window.cargarComentariosDelCapitulo(capitulo.name, listaHtml, scrollAComentarios);
    }
}

document.getElementById("formulario-comentario").addEventListener("submit", (e) => {
    e.preventDefault();
    
    const capituloActual = listaCapitulosGuardados[indiceCapituloActual];
    const inputNombre = document.getElementById("comentario-nombre");
    const inputTexto = document.getElementById("comentario-texto");

    if (window.intentarPublicarComentario && capituloActual) {
        window.intentarPublicarComentario(capituloActual.name, inputNombre.value, inputTexto.value);
        inputTexto.value = "";
    }
});

function cerrarVisor() {
    document.getElementById("viewer-container").style.display = "none";
    document.body.style.overflow = "auto";
    history.pushState("", document.title, window.location.pathname + window.location.search);
}

document.getElementById("btn-close").addEventListener("click", cerrarVisor);

document.getElementById("btn-prev").addEventListener("click", () => {
    abrirVisor(indiceCapituloActual + 1);
});

document.getElementById("btn-next").addEventListener("click", () => {
    abrirVisor(indiceCapituloActual - 1);
});

let ultimoScroll = 0;
const barraNav = document.getElementById("viewer-nav");
const visorContainer = document.getElementById("viewer-container");

visorContainer.addEventListener("scroll", () => {
    let scrollActual = visorContainer.scrollTop;
    if (scrollActual > ultimoScroll && scrollActual > 50) {
        barraNav.classList.add("hidden"); 
    } else {
        barraNav.classList.remove("hidden");
    }
    ultimoScroll = scrollActual;
});

window.addEventListener("DOMContentLoaded", () => {
    if (window.registrarVisitaInicio) {
        window.registrarVisitaInicio();
    }
    if (window.escucharVisitasGlobales) {
        window.escucharVisitasGlobales();
    }
    cargarAvisos();
    cargarCapitulos();
});
</script>

</body>
</html>
