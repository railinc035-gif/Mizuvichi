<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x: hidden;
}

header{
    position: relative; 
    text-align:center;
    padding:30px 15px;
    border-bottom:2px solid #300000; 
    transition: all 0.4s ease;
}

header h1{
    font-size:3rem;
    color:#888; 
    transition: all 0.4s ease;
}


header:hover, header:active {
    border-bottom:2px solid #ff0000;
    box-shadow:0 0 20px #ff0000;
}

header:hover h1, header:active h1 {
    color:#fff;
    text-shadow:0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #b30000;
}

.counters-wrapper {
    position: absolute;
    top: 15px;
    right: 20px;
}

.global-counter {
    font-size: 0.9rem;
    background: #0a0a0a;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
    color: #666;
}

.online-counter {
    position: absolute;
    bottom: 10px;
    left: 20px;
    font-size: 0.75rem;
    background: rgba(0, 255, 102, 0.05);
    padding: 4px 10px;
    border-radius: 30px;
    border: 1px solid rgba(0, 255, 102, 0.3);
    display: flex;
    align-items: center;
    gap: 5px;
    color: #00ff66;
    transition: all 0.3s ease;
    z-index: 10;
}

header:hover .global-counter, header:active .global-counter {
    color: #ff0000;
    border-color: #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
}

header:hover .online-counter, header:active .online-counter {
    border-color: #00ff66;
    background: rgba(0, 255, 102, 0.1);
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

.section{
    width:95%;
    max-width:1000px;
    margin:25px auto;
}

.info-box {
    border: none;
    border-radius: 12px;
    overflow: hidden;
    background: #050505;
    padding: 10px;
    transition: all 0.4s ease;
}

.info-box:hover, .info-box:active {
    border-color: transparent;
    box-shadow: none;
}

.aviso-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 0 auto 70px auto; 
    display: flex;
    flex-direction: column;
    align-items: center;
}

.info-box img {
    width: 100%;
    max-width: 390px;
    margin: 0 auto;
    display: block;
    border-radius: 8px;
    image-rendering: -webkit-optimize-contrast;
    backface-visibility: hidden;
    transform: translateZ(0);
}

.badge-nuevo {
    align-self: flex-start;
    margin-bottom: 5px;
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 0.8rem;
    padding: 5px 12px;
    border-radius: 6px;
    text-transform: uppercase;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.5); 
    z-index: 10;
    letter-spacing: 1px;
    cursor: pointer;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 2.2rem;
    }
    .counters-wrapper {
        position: static;
        margin-top: 15px;
        display: flex;
        justify-content: center;
    }
    .online-counter {
        position: static;
        margin-top: 10px;
    }
    header {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .viewer-nav h3 {
        font-size: 1rem;
        max-width: 40%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .viewer-btn {
        padding: 8px 12px;
        font-size: 0.8rem;
    }
}

.chapter{
    border:2px solid #300000; 
    border-radius:12px;
    margin-bottom:20px;
    overflow:hidden;
    transition: all 0.3s ease; 
}

.chapter:hover, .chapter:active {
    border-color: #ff0000;
    box-shadow: 0 0 20px #ff0000;
    transform: translateY(-2px); 
}

.chapter-header{
    padding:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#111;
    transition: background 0.3s;
}

.chapter-header:hover {
    background:#1a1a1a;
}

.chapter-left{
    display:flex;
    gap:15px;
    align-items:center;
}

.chapter-thumb{
    width:70px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.chapter-views {
    font-size: 0.85rem;
    color: #888;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
}

#viewer-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 9999;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch; /* Desplazamiento inercial suave en iOS */
    scroll-behavior: smooth;
    overscroll-behavior-y: contain; /* Evita arrastrar el body de fondo */
}

.viewer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: rgba(10, 10, 10, 0.95);
    position: sticky;
    top: 0;
    border-bottom: 2px solid #ff0000;
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    transition: top 0.3s ease; 
}

.viewer-nav.hidden {
    top: -80px; 
}

.viewer-btn {
    background: #111;
    color: #fff;
    border: 1px solid #ff0000;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: 0.2s;
}

.viewer-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 10px #ff0000;
}

.viewer-btn:disabled {
    border-color: #333;
    color: #555;
    background: #0a0a0a;
    cursor: not-allowed;
    box-shadow: none;
}

.viewer-content {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 10px;
}

.viewer-page-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 0.707; /* Relación de aspecto estándar para manga (A4/B5) para evitar saltos de diseño (CLS) */
    background: #0a0a0a;
    margin-bottom: 30px; 
    border-radius: 6px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); 
    border: 1px solid #111; 
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.viewer-page-wrapper img {
    width: 100%;
    height: auto;
    display: block;
    opacity: 0;
    transition: opacity 0.3s ease;
    image-rendering: -webkit-optimize-contrast; /* Máxima nitidez en Safari y WebKit */
    image-rendering: crisp-edges;               /* Máxima nitidez en navegadores estándar */
}

.viewer-page-wrapper img.loaded {
    opacity: 1;
}

/* Spinner de carga elegante ("bolita de carga") estilo premium */
.loading-spinner {
    position: absolute;
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 0, 0, 0.1);
    border-left-color: #ff0000;
    border-radius: 50%;
    animation: spin-loader 1s linear infinite;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

@keyframes spin-loader {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* ==========================================================================
   SECCIÓN DE COMENTARIOS
   ========================================================================== */
.comments-section {
    max-width: 800px;
    margin: 40px auto 60px auto;
    padding: 20px 15px;
    background: #0a0a0a;
    border-top: 2px solid #300000;
    border-radius: 12px;
    position: relative;
}

.comments-section h4 {
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 20px;
    border-left: 4px solid #ff0000;
    padding-left: 10px;
}

.comment-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 30px;
}

.comment-form input, .comment-form textarea {
    background: #111;
    border: 1px solid #300000;
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: Arial, sans-serif;
    outline: none;
    transition: border-color 0.3s;
}

.comment-form input:focus, .comment-form textarea:focus {
    border-color: #ff0000;
    box-shadow: 0 0 8px rgba(255, 0, 0, 0.2);
}

.comment-form input:disabled {
    background: #151515;
    border-color: #222;
    color: #888;
    cursor: not-allowed;
}

.comment-form textarea {
    resize: vertical;
    min-height: 80px;
}

.comment-submit-btn {
    align-self: flex-end;
    background: #111;
    color: #fff;
    border: 1px solid #ff0000;
    padding: 10px 25px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 6px;
    transition: all 0.3s;
}

.comment-submit-btn:hover {
    background: #ff0000;
    color: #000;
    box-shadow: 0 0 15px #ff0000;
}

.comments-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.comment-card {
    background: #111;
    border: 1px solid #200000;
    padding: 15px;
    border-radius: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: opacity 0.3s ease;
}

.comment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.comment-author-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
}

.comment-author {
    font-weight: bold;
    color: #ff0000;
    font-size: 0.95rem;
}

.comment-author.es-respuesta {
    color: #00ff66;
}

.comment-date {
    font-size: 0.8rem;
    color: #666;
}

.badge-autor {
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    box-shadow: 0 0 15px #00ff66;
    letter-spacing: 0.5px;
}

.comment-text {
    color: #ddd;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
}

.comment-actions {
    display: flex;
    gap: 15px;
    align-items: center;
    margin-top: 5px;
}

.action-btn {
    background: none;
    border: none;
    color: #aaa; 
    cursor: pointer;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    position: relative;
}

.action-btn.like-btn:hover {
    color: #0084ff;
}

.action-btn.like-btn.liked {
    color: #0084ff;
}

.action-btn.delete-btn {
    display: none; 
    color: #aaa;
    padding: 4px 8px;
    border-radius: 4px;
}

.action-btn.delete-btn:hover {
    color: #fff;
    background: #b30000;
}

.comment-card.es-mio .action-btn.delete-btn {
    display: inline-flex; 
}

/* ESTILOS PARA RESPUESTAS */
.reply-context {
    background: #1a1a1a;
    border-left: 3px solid #ff0000;
    padding: 8px 12px;
    margin-bottom: 10px;
    border-radius: 4px;
    font-size: 0.85rem;
    color: #888;
}

.reply-context b {
    color: #00ff66;
}

.reply-indicator {
    display: none;
    background: #1a1a1a;
    border-left: 4px solid #00ff66;
    padding: 10px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    align-items: center;
    justify-content: space-between;
}

.reply-indicator.active {
    display: flex;
}

.reply-info {
    font-size: 0.9rem;
    color: #aaa;
}

.reply-info b {
    color: #00ff66;
}

.cancel-reply-btn {
    background: none;
    border: none;
    color: #ff4444;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 5px;
    transition: 0.2s;
}

.cancel-reply-btn:hover {
    color: #ff0000;
    transform: scale(1.1);
}

.action-btn.reply-btn:hover {
    color: #00ff66;
}

/* ANIMACIONES */
.floating-emoji {
    position: absolute;
    pointer-events: none;
    z-index: 999;
    font-size: 1.5rem;
    animation: flotarEmoji 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes flotarEmoji {
    0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
    }
    100% {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2);
        opacity: 0;
    }
}

.particle-fx {
    position: absolute;
    pointer-events: none;
    z-index: 999;
    width: 6px;
    height: 6px;
    border-radius: 2px;
    animation: explotarParticula 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
}

@keyframes explotarParticula {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(var(--mx), var(--my));
        opacity: 0;
    }
}

.social{
    text-align:center;
    margin:40px 0;
}

.social a{
    color:#888;
    text-decoration:none;
    font-size:1.3rem;
    margin:0 25px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: 0.3s;
}

.social a:hover, .social a:active{
    color: #ff0000;
    text-shadow: 0 0 10px #ff0000;
}

/* ==========================================================================
   ESTILOS DE LA GALERÍA (ESTILO MANGA PLUS)
   ========================================================================== */
.tabs-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 30px auto 20px auto;
    width: 95%;
    max-width: 1000px;
}

.tab-btn {
    background: #111;
    color: #888;
    border: 2px solid #200000;
    padding: 10px 25px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tab-btn:hover {
    color: #fff;
    border-color: #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
}

.tab-btn.active[data-tab="manga"] {
    background: #ff0000;
    color: #000;
    border-color: #ff0000;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
}

.tab-btn.active[data-tab="one-shot"] {
    background: #00ff66;
    color: #000;
    border-color: #00ff66;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
}

.tab-btn[data-tab="one-shot"]:hover {
    border-color: #00ff66;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
}

.gallery-section {
    display: none;
    width: 100%;
}

.gallery-section.active {
    display: block;
    animation: fadeIn 0.4s ease;
}

.series-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 15px;
}

.series-card {
    background: #0a0a0a;
    border: 2px solid #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    flex-direction: column;
    position: relative;
}

.series-card:hover {
    transform: translateY(-5px);
    border-color: #ff0000;
    box-shadow: 0 10px 20px rgba(255, 0, 0, 0.2);
}

.series-card[data-type="one-shot"]:hover {
    border-color: #00ff66;
    box-shadow: 0 10px 20px rgba(0, 255, 102, 0.2);
}

.series-cover-wrapper {
    position: relative;
    width: 100%;
    padding-top: 140%; /* Poster aspect ratio */
    overflow: hidden;
    background: #050505;
}

.series-cover {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.series-card:hover .series-cover {
    transform: scale(1.05);
}

.series-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.85);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: 1px solid #ff0000;
    color: #ff0000;
    z-index: 5;
}

.series-badge.one-shot {
    border-color: #00ff66;
    color: #00ff66;
}

/* Estilos para etiquetas de estado (Emisión, Pausa, Terminado) con bordes y brillos */
.status-badge {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

/* Verde en emisión */
.status-badge.emision {
    background: rgba(0, 255, 102, 0.1);
    color: #00ff66;
    border: 1px solid #00ff66;
    box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
}

/* Blanco en pausa */
.status-badge.pausa {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    border: 1px solid #ffffff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
}

/* Rojo en terminado */
.status-badge.terminado {
    background: rgba(255, 0, 0, 0.1);
    color: #ff0000;
    border: 1px solid #ff0000;
    box-shadow: 0 0 8px rgba(255, 0, 0, 0.2);
}

.series-info {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-grow: 1;
}

.series-title {
    font-size: 1.1rem;
    font-weight: bold;
    color: #fff;
    margin: 0;
}

.series-author {
    font-size: 0.8rem;
    color: #888;
}

/* ==========================================================================
   ESTILOS DE DETALLE DE SERIE
   ========================================================================== */
.series-detail-container {
    display: none;
    width: 95%;
    max-width: 1000px;
    margin: 25px auto;
    animation: fadeIn 0.4s ease;
}

.back-btn-container {
    margin-bottom: 20px;
}

.back-btn {
    background: #111;
    border: 1px solid #333;
    color: #fff;
    font-size: 0.9rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    transition: all 0.2s;
    padding: 8px 16px;
    border-radius: 20px;
}

.back-btn:hover {
    color: #fff;
    background: #222;
    border-color: #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
}

.series-header-layout {
    display: flex;
    gap: 25px;
    margin-bottom: 30px;
    background: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
    border: 1px solid #1a1a1a;
    border-radius: 12px;
    padding: 20px;

    overflow: hidden;
}

.series-detail-poster-wrapper {
    width: 150px;
    flex-shrink: 0;
    border-radius: 8px;

}

.series-detail-poster {
    width: 100%;
    display: block;
    aspect-ratio: 0.75;
    object-fit: cover;
}

.series-detail-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
}

.series-detail-title {
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    margin: 0;
    letter-spacing: 0.5px;
}

.series-detail-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.series-detail-author {
    color: #888;
    font-size: 0.9rem;
}

.series-detail-desc {
    color: #ccc;
    font-size: 0.9rem;
    line-height: 1.5;

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
    .series-header-layout {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .series-detail-poster-wrapper {
        width: 130px;
    }
    .series-detail-title {
        font-size: 1.5rem;
    }
    .series-detail-meta {
        justify-content: center;
    }

</style>
</head>

<body>

<header>
    <h1>MIZUVICHI</h1>
    
    <div class="counters-wrapper">
        <div class="global-counter" id="contador-global">
            <i class="fas fa-users"></i> <span id="num-global">...</span>
        </div>
    </div>
    <div class="online-counter" id="contador-online">
        <i class="fas fa-circle" style="font-size: 0.4rem; animation: pulse 2s infinite;"></i> 
        <span id="num-online">...</span>
    </div>
</header>

<div class="section" id="aviso-section">
    <div class="info-box" id="aviso-container"></div>
</div>

<!-- VISTA PRINCIPAL: GALERÍA DE SERIES -->

<script>
  // Cargador asincrónico dinámico de cont.html para una perfecta modularización
  fetch('cont.html')
    .then(response => {
      if (!response.ok) {
        throw new Error("No se pudo cargar cont.html");
      }
      return response.text();
    })
    .then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const script = doc.querySelector('script');
      if (script) {
        const blob = new Blob([script.textContent], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const newScript = document.createElement('script');
        newScript.type = 'module';
        newScript.src = url;
        document.body.appendChild(newScript);
      } else {
        console.error("No se encontró el script en cont.html");
      }
    })
    .catch(error => {
      console.error("Error al inicializar el cargador dinámico:", error);
    });
</script>
