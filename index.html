<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

*{ 
    margin:0; 
    padding:0; 
    box-sizing:border-box; 
} 
 
body{ 
    background: radial-gradient(circle at top, #140505 0%, #050505 100%);
    color:#f5f5f5; 
    font-family: 'Outfit', system-ui, -apple-system, sans-serif; 
    overflow-x: hidden; 
    line-height: 1.6;
} 
 
header{ 
    position: relative;  
    text-align:center; 
    padding:40px 15px; 
    border-bottom: 1px solid rgba(255, 0, 0, 0.1);  
    background: rgba(5, 5, 5, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); 
} 
 
header h1{ 
    font-size:3.5rem; 
    font-weight: 800;
    color:#666;  
    letter-spacing: 4px;
    transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); 
} 
 
header:hover, header:active { 
    border-bottom: 1px solid rgba(255, 0, 0, 0.4); 
    box-shadow: 0 10px 30px rgba(255, 0, 0, 0.08); 
} 
 
header:hover h1, header:active h1 { 
    color:#fff; 
    text-shadow:0 0 15px rgba(255, 0, 0, 0.6), 
                0 0 30px rgba(255, 0, 0, 0.4), 
                0 0 50px rgba(179, 0, 0, 0.3); 
} 
 
.counters-wrapper { 
    position: absolute; 
    top: 20px; 
    right: 25px; 
} 
 
.global-counter { 
    font-size: 0.85rem; 
    background: rgba(15, 15, 15, 0.8); 
    padding: 8px 16px; 
    border-radius: 30px; 
    border: 1px solid rgba(255, 255, 255, 0.05); 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    transition: all 0.4s ease; 
    color: #888; 
} 
 
.online-counter { 
    position: absolute; 
    bottom: 15px; 
    left: 25px; 
    font-size: 0.8rem; 
    background: rgba(0, 255, 102, 0.03); 
    padding: 6px 14px; 
    border-radius: 30px; 
    border: 1px solid rgba(0, 255, 102, 0.15); 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    color: #00ff66; 
    text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
    transition: all 0.4s ease; 
    z-index: 10; 
} 
 
header:hover .global-counter, header:active .global-counter { 
    color: #ff0000; 
    border-color: rgba(255, 0, 0, 0.3); 
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.15); 
} 
 
header:hover .online-counter, header:active .online-counter { 
    border-color: #00ff66; 
    background: rgba(0, 255, 102, 0.08); 
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.25); 
} 
 
@keyframes pulse { 
    0% { opacity: 1; } 
    50% { opacity: 0.4; } 
    100% { opacity: 1; } 
} 
 
.section{ 
    width:95%; 
    max-width:1050px; 
    margin:35px auto; 
} 
 
.info-box { 
    border: none; 
    border-radius: 16px; 
    overflow: hidden; 
    background: transparent; 
    padding: 10px; 
    transition: all 0.4s ease; 
} 
 
.aviso-wrapper { 
    position: relative; 
    width: 100%; 
    max-width: 800px; 
    margin: 0 auto 50px auto;  
    display: flex; 
    flex-direction: column; 
    align-items: center; 
} 
 
.info-box img { 
    width: 100%; 
    max-width: 420px; 
    margin: 0 auto; 
    display: block; 
    border-radius: 12px; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border: 1px solid rgba(255, 255, 255, 0.05);
    image-rendering: -webkit-optimize-contrast; 
    backface-visibility: hidden; 
    transform: translateZ(0); 
} 
 
.badge-nuevo { 
    align-self: flex-start; 
    margin-bottom: 10px; 
    background: linear-gradient(135deg, #00ff66 0%, #00b34a 100%); 
    color: #000; 
    font-weight: 800; 
    font-size: 0.75rem; 
    padding: 6px 14px; 
    border-radius: 8px; 
    text-transform: uppercase; 
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);  
    z-index: 10; 
    letter-spacing: 1.5px; 
    cursor: pointer; 
    transition: all 0.3s;
} 

.badge-nuevo:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
}
 
@media (max-width: 768px) { 
    header h1 { 
        font-size: 2.5rem; 
    } 
    .counters-wrapper { 
        position: static; 
        margin-top: 15px; 
        display: flex; 
        justify-content: center; 
    } 
    .online-counter { 
        position: static; 
        margin-top: 10px; 
    } 
    header { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
    } 
    .viewer-nav h3 { 
        font-size: 0.95rem; 
        max-width: 45%; 
        overflow: hidden; 
        text-overflow: ellipsis; 
        white-space: nowrap; 
    } 
    .viewer-btn { 
        padding: 8px 12px; 
        font-size: 0.8rem; 
    } 
} 
 
.chapter{ 
    border: 1px solid rgba(255, 255, 255, 0.03);  
    border-radius:14px; 
    margin-bottom:15px; 
    overflow:hidden; 
    background: rgba(15, 15, 15, 0.4);
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);  
} 
 
.chapter:hover, .chapter:active { 
    border-color: rgba(255, 0, 0, 0.3); 
    box-shadow: 0 10px 25px rgba(255, 0, 0, 0.1); 
    transform: translateY(-3px);  
} 
 
.chapter-header{ 
    padding:18px 20px; 
    cursor:pointer; 
    display:flex; 
    align-items:center; 
    justify-content:space-between; 
    background: rgba(17, 17, 17, 0.6); 
    transition: background 0.3s; 
} 
 
.chapter-header:hover { 
    background: rgba(26, 26, 26, 0.7); 
} 
 
.chapter-left{ 
    display:flex; 
    gap:20px; 
    align-items:center; 
} 
 
.chapter-thumb{ 
    width:75px; 
    height:95px; 
    object-fit:cover; 
    border-radius:10px; 
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.05);
} 

.chapter-left h3 {
    font-size: 1.15rem;
    font-weight: 600;
    color: #fff;
}
 
.chapter-views { 
    font-size: 0.85rem; 
    color: #666; 
    margin-top: 6px; 
    display: flex; 
    align-items: center; 
    gap: 6px; 
} 
 
#viewer-container { 
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh; 
    background: #020202; 
    z-index: 9999; 
    overflow-y: auto; 
    -webkit-overflow-scrolling: touch; 
    overscroll-behavior-y: contain; 
} 
 
.viewer-nav { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 18px 25px; 
    background: rgba(5, 5, 5, 0.85); 
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: sticky; 
    top: 0; 
    border-bottom: 1px solid rgba(255, 0, 0, 0.2); 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
    transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
    transform: translateY(0); 
    will-change: transform; 
    z-index: 100;
} 
 
.viewer-nav.hidden { 
    transform: translateY(-100%); 
} 
 
.viewer-btn { 
    background: rgba(20, 20, 20, 0.8); 
    color: #aaa; 
    border: 1px solid rgba(255, 255, 255, 0.05); 
    padding: 10px 22px; 
    cursor: pointer; 
    font-weight: 600; 
    border-radius: 30px; 
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
} 
 
.viewer-btn:hover { 
    background: #ff0000; 
    color: #fff; 
    border-color: #ff0000;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); 
} 
 
.viewer-btn:disabled { 
    border-color: rgba(255,255,255,0.02); 
    color: #444; 
    background: rgba(10, 10, 10, 0.5); 
    cursor: not-allowed; 
    box-shadow: none; 
} 
 
.viewer-content { 
    max-width: 800px; 
    margin: 30px auto; 
    padding: 0 15px; 
} 
 
.viewer-page-wrapper { 
    position: relative; 
    width: 100%; 
    aspect-ratio: 0.707; 
    background: #050505; 
    margin-bottom: 35px;  
    border-radius: 12px; 
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);  
    border: 1px solid rgba(255, 255, 255, 0.02);  
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
    transform: translate3d(0, 0, 0); 
    backface-visibility: hidden; 
    will-change: transform; 
} 
 
.viewer-page-wrapper img { 
    width: 100%; 
    height: auto; 
    display: block; 
    opacity: 0; 
    transition: opacity 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); 
    transform: translate3d(0, 0, 0); 
    backface-visibility: hidden; 
} 
 
.viewer-page-wrapper img.loaded { 
    opacity: 1; 
} 
 
.loading-spinner { 
    position: absolute; 
    width: 60px; 
    height: 60px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    z-index: 2; 
    pointer-events: none; 
    transition: opacity 0.3s ease; 
} 
 
.loading-spinner .dot { 
    position: absolute; 
    width: 12px; 
    height: 12px; 
    border-radius: 50%; 
    animation: tiktok-spin 1.6s ease-in-out infinite; 
} 
 
.loading-spinner .dot-red { 
    background-color: #ff0000; 
    animation-delay: 0s; 
} 
 
.loading-spinner .dot-green { 
    background-color: #00ff66; 
    animation-delay: -0.4s; 
} 
 
.loading-spinner .dot-white { 
    background-color: #ffffff; 
    animation-delay: -0.8s; 
} 
 
.loading-spinner .dot-gold { 
    background-color: #ffd700; 
    animation-delay: -1.2s; 
} 
 
@keyframes tiktok-spin { 
    0%, 100% { 
        transform: translate(0, 0) scale(1); 
        z-index: 3; 
    } 
    25% { 
        transform: translate(18px, 0) scale(1.2); 
        z-index: 4; 
    } 
    50% { 
        transform: translate(0, 0) scale(0.8); 
        z-index: 1; 
    } 
    75% { 
        transform: translate(-18px, 0) scale(1.2); 
        z-index: 4; 
    } 
} 
 
/* ========================================================================== 
   SECCIÓN DE COMENTARIOS 
   ========================================================================== */ 
.comments-section {

    margin: 50px auto 80px auto;

} 
 
.comments-section h4 {

.comment-submit-btn {

.comment-submit-btn:hover {

.comments-list {

    display: flex; 
    flex-direction: column; 
    gap: 10px;

} 

.comment-card:hover {
    border-color: rgba(255, 255, 255, 0.05);
    background: rgba(20, 20, 20, 0.7);
}
 
.comment-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
} 
 
.comment-author-wrapper { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
} 
 
.comment-author { 
    font-weight: 600; 
    color: #ff3333; 
    font-size: 1rem; 
} 
 
.comment-author.es-respuesta { 
    color: #00ff66; 
} 
 
.comment-date { 
    font-size: 0.8rem; 
    color: #555; 
} 
 
.badge-autor { 
    background: linear-gradient(135deg, #00ff66 0%, #00b34a 100%); 
    color: #000; 
    font-weight: 800; 
    font-size: 0.65rem; 
    padding: 3px 8px; 
    border-radius: 4px; 
    text-transform: uppercase; 
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.3); 
    letter-spacing: 0.5px; 
} 
 
.comment-text { 
    color: #ddd; 
    font-size: 0.95rem; 
    line-height: 1.5; 
    word-break: break-word; 
} 
 
.comment-actions { 
    display: flex; 
    gap: 20px; 
    align-items: center; 
    margin-top: 8px; 
} 
 
.action-btn { 
    background: none; 
    border: none; 
    color: #666;  
    cursor: pointer; 
    font-size: 0.85rem; 
    display: inline-flex; 
    align-items: center; 
    gap: 8px; 
    transition: all 0.2s; 
    position: relative; 
} 
 
.action-btn.like-btn:hover { 
    color: #0084ff; 
} 
 
.action-btn.like-btn.liked { 
    color: #0084ff; 
} 
 
.action-btn.delete-btn { 
    display: none;  
    color: #555; 
    padding: 4px 10px; 
    border-radius: 6px; 
    transition: all 0.3s;
} 
 
.action-btn.delete-btn:hover { 
    color: #fff; 
    background: #ff0000; 
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
} 
 
.comment-card.es-mio .action-btn.delete-btn { 
    display: inline-flex;  
} 
 
/* ESTILOS PARA RESPUESTAS */ 
.reply-context { 
    background: rgba(30, 30, 30, 0.5); 
    border-left: 3px solid #ff0000; 
    padding: 10px 15px; 
    margin-bottom: 5px;

.cancel-reply-btn {

/* ANIMACIONES */ 
.floating-emoji { 
    position: absolute; 
    pointer-events: none; 
    z-index: 999; 
    font-size: 1.5rem; 
    animation: flotarEmoji 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; 
} 
 
@keyframes flotarEmoji { 
    0% { 
        transform: translate(-50%, -50%) scale(0.5); 
        opacity: 1; 
    } 
    100% { 
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2); 
        opacity: 0; 
    } 
} 
 
.particle-fx { 
    position: absolute; 
    pointer-events: none; 
    z-index: 999; 
    width: 6px; 
    height: 6px; 
    border-radius: 2px; 
    animation: explotarParticula 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards; 
} 
 
@keyframes explotarParticula { 
    0% { 
        transform: translate(0, 0) scale(1); 
        opacity: 1; 
    } 
    100% { 
        transform: translate(var(--mx), var(--my)); 
        opacity: 0; 
    } 
} 
 
.social{

    margin:60px 0;

.social a{

/* ========================================================================== 
   ESTILOS DE LA GALERÍA (ESTILO MANGA PLUS) 
   ========================================================================== */ 
.tabs-container { 
    display: flex; 
    justify-content: center; 
    gap: 20px; 
    margin: 40px auto 30px auto; 
    width: 95%; 
    max-width: 1000px; 
} 
 
.tab-btn { 
    background: rgba(15, 15, 15, 0.6); 
    color: #666; 
    border: 1px solid rgba(255, 255, 255, 0.05);

.gallery-section {

} 
 
.gallery-section.active {

} 
 
.series-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
    gap: 30px; 
    margin-top: 20px; 
} 
 
.series-card { 
    background: rgba(10, 10, 10, 0.4); 
    border: 1px solid rgba(255, 255, 255, 0.03); 
    border-radius: 16px; 
    overflow: hidden; 
    cursor: pointer; 
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);

    flex-direction: column; 
    position: relative; 
} 
 
.series-card:hover { 
    transform: translateY(-8px); 
    border-color: rgba(255, 0, 0, 0.3); 
    box-shadow: 0 15px 35px rgba(255, 0, 0, 0.15); 
} 
 
.series-card[data-type="one-shot"]:hover {

    box-shadow: 0 15px 35px rgba(0, 255, 102, 0.15); 
}

}

    letter-spacing: 1px;

    color: #00ff66; 
} 
 
.status-badge { 
    padding: 4px 12px; 
    border-radius: 30px; 
    font-size: 0.75rem; 
    font-weight: 600; 
    text-transform: uppercase; 
    letter-spacing: 0.5px; 
    display: inline-flex; 
    align-items: center;

      cargarComentariosDelCapitulo(nombreCap, contenedorHtml, scrollAlFinal = false) { 
          if (desvincularEscuchaComentarios) desvincularEscuchaComentarios(); 
 
          const refComentarios = ref(database, 'comentarios/' + nombreCap); 
           
          desvincularEscuchaComentarios = onValue(refComentarios, (snapshot) => { 
              if (!contenedorHtml) return;
              contenedorHtml.innerHTML = ""; 
              const datos = snapshot.val(); 
               
              if (!datos) { 
                  contenedorHtml.innerHTML = `<p style="color:#555; font-size:0.9rem; text-align:center;">Nadie ha comentado aún. ¡Sé el primero!</p>`; 
                  return; 
              } 
 
              const listaOrdenada = Object.keys(datos).reverse(); 
 
              let misComentariosGuardados = []; 
              try { 
                  misComentariosGuardados = JSON.parse(localStorage.getItem("mis_comentarios_v3") || "[]"); 
              } catch(e) { misComentariosGuardados = []; } 
 
              const soyElAutorLogueado = localStorage.getItem("autor_autenticado") === "true"; 
              const nombreLocalFijo = localStorage.getItem("mi_nombre_fijo"); 
 
              listaOrdenada.forEach((idComentario) => { 
                  const info = datos[idComentario]; 
                  const card = document.createElement("div"); 
                  card.className = "comment-card"; 
                  card.id = "card-" + idComentario; 
                   
                  let esMiComentarioReal = false; 
                  if (info.esAutor === true) { 
                      if (soyElAutorLogueado) esMiComentarioReal = true; 
                  } else { 
                      if (misComentariosGuardados.includes(idComentario) && nombreLocalFijo === info.autor) { 
                          esMiComentarioReal = true; 
                      } 
                  } 
 
                  if (esMiComentarioReal) { 
                      card.classList.add("es-mio"); 
                  } 
 
                  let badgeAutorHtml = info.esAutor ? `<span class="badge-autor">Autor</span>` : ""; 
                  const textoFecha = calcularTiempoRelativo(info.fecha); 
                  const yaTieneLike = localStorage.getItem(`liked_${idComentario}`); 
                  const claseLiked = yaTieneLike ? "liked" : ""; 
                  const colorCorazon = yaTieneLike ? '#0084ff' : '#555'; 
                   
                  let replyContextHtml = ""; 
                  if (info.replyTo) { 
                      replyContextHtml = ` 
                          <div class="reply-context"> 
                              <i class="fas fa-reply fa-rotate-180"></i> Respondiendo a <b>@${escaperHtml(info.replyTo.author)}</b> 
                          </div> 
                      `; 
                  } 
 
                  card.innerHTML = ` 
                      <div class="comment-header"> 
                          <div class="comment-author-wrapper"> 
                              <span class="comment-author ${info.replyTo ? 'es-respuesta' : ''}">${escaperHtml(info.autor)}</span> 
                              ${badgeAutorHtml} 
                              <span class="comment-date">${textoFecha}</span> 
                          </div> 
                          <button class="action-btn delete-btn" data-id="${idComentario}"><i class="fas fa-trash-alt"></i></button> 
                      </div> 
                      ${replyContextHtml} 
                      <p class="comment-text">${escaperHtml(info.texto)}</p> 
                      <div class="comment-actions"> 
                          <button class="action-btn like-btn ${claseLiked}" data-id="${idComentario}"> 
                              <i class="fas fa-heart" style="color: ${colorCorazon}"></i> <span>${info.likes || 0}</span> 
                          </button> 
                          <button class="action-btn reply-btn" data-id="${idComentario}" data-author="${escaperHtml(info.autor)}"> 
                              <i class="fas fa-comment-dots"></i> Responder 
                          </button> 
                      </div> 
                  `; 
 
                  card.querySelector(".like-btn").addEventListener("click", (e) => { 
                      const haDadoLike = localStorage.getItem(`liked_${idComentario}`); 
                      const refLike = ref(database, `comentarios/${nombreCap}/${idComentario}/likes`); 
                       
                      if (!haDadoLike) { 
                          localStorage.setItem(`liked_${idComentario}`, 'true'); 
                          e.currentTarget.classList.add("liked"); 
                          e.currentTarget.querySelector("i").style.color = "#0084ff"; 
                          runTransaction(refLike, (actual) => (actual || 0) + 1); 
                      } else { 
                          localStorage.removeItem(`liked_${idComentario}`); 
                          e.currentTarget.classList.remove("liked"); 
                          e.currentTarget.querySelector("i").style.color = "#555"; 
                          runTransaction(refLike, (actual) => { 
                              let nuevoValor = (actual || 0) - 1; 
                              return nuevoValor < 0 ? 0 : nuevoValor;  
                          }); 
                      } 
                  }); 
 
                  card.querySelector(".delete-btn").addEventListener("click", (e) => { 
                      if (confirm("¿Seguro que quieres eliminar tu comentario?")) { 
                          crearEfectoExplosionComentario(e.currentTarget, card);  
                          setTimeout(() => { 
                              remove(ref(database, `comentarios/${nombreCap}/${idComentario}`)); 
                          }, 400); 
                      } 
                  }); 
 
                  card.querySelector(".reply-btn").addEventListener("click", (e) => { 
                      const id = e.currentTarget.getAttribute("data-id"); 
                      const author = e.currentTarget.getAttribute("data-author"); 
                      setReplyState(id, author); 
                  }); 
 
                  contenedorHtml.appendChild(card); 
              }); 
 
              if (scrollAlFinal) { 
                  setTimeout(() => { 
                      const seccionComentarios = document.getElementById("seccion-comentarios-root"); 
                      if (seccionComentarios) { 
                          seccionComentarios.scrollIntoView({ behavior: "smooth" }); 
                      } 
                  }, 300); 
              }

          let esAutorReal = false;

              if (localStorage.getItem("autor_autenticado") === "true") {

          }

      async cargarAvisos() { 
          const contenedorAvisos = DOM.avisoContainer; 
          if (!contenedorAvisos) return;
          try { 
              const respuesta = await fetch(`${api}/Aviso`); 
              if (!respuesta.ok) { contenedorAvisos.parentElement.style.display = "none"; return; } 
              const archivos = await respuesta.json(); 
              const pngs = archivos.filter(p => p.name.toLowerCase().endsWith(".png")).sort((a, b) => b.name.localeCompare(a.name, undefined, {numeric: true})); 
              if (pngs.length === 0) { contenedorAvisos.parentElement.style.display = "none"; return; } 
 
              const ultimoAvisoVisto = localStorage.getItem("ultimo_aviso_visto"); 
              const idUltimoAviso = pngs[0].name; 
 
              pngs.forEach((img, index) => { 
                  const wrapper = document.createElement("div"); 
                  wrapper.className = "aviso-wrapper"; 
                  if (index === 0 && ultimoAvisoVisto !== idUltimoAviso) { 
                      const tag = document.createElement("span"); 
                      tag.className = "badge-nuevo"; 
                      tag.innerText = "Nuevo"; 
                      tag.onclick = () => { localStorage.setItem("ultimo_aviso_visto", idUltimoAviso); tag.style.display = "none"; }; 
                      wrapper.appendChild(tag); 
                      setTimeout(() => { localStorage.setItem("ultimo_aviso_visto", idUltimoAviso); if (tag) tag.style.opacity = "0"; setTimeout(() => { if(tag) tag.style.display = "none"; }, 500); }, 10000); 
                  } 
                  const imageElement = document.createElement("img"); 
                  imageElement.src = obtenerUrlCDN(img.download_url); 
                  imageElement.loading = "lazy"; 
                  imageElement.decoding = "async"; 
                  wrapper.appendChild(imageElement); 
                  contenedorAvisos.appendChild(wrapper); 
              }); 
          } catch (error) { contenedorAvisos.parentElement.style.display = "none"; } 
      },

  window.calcularTiempoRelativo = function(timestamp) { 
      if (!timestamp) return "Hace un momento"; 
      const ahora = Date.now(); 
      const diferencia = ahora - timestamp; 
 
      const segundos = Math.floor(diferencia / 1000); 
      const minutos = Math.floor(segundos / 60); 
      const horas = Math.floor(minutos / 60); 
      const dias = Math.floor(horas / 24); 
 
      if (segundos < 60) return "Hace un momento"; 
      if (minutos < 60) return `Hace ${minutos} ${minutos === 1 ? 'minuto' : 'minutos'}`; 
      if (horas < 24) return `Hace ${horas} ${horas === 1 ? 'hora' : 'horas'}`; 
      if (dias === 1) return "Ayer"; 
      if (dias < 7) return `Hace ${dias} días`; 
       
      const fechaObj = new Date(timestamp); 
      return fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }); 
  };

                  <span class="series-badge ${series.type}">${series.type}</span> 
                  <img class="series-cover" src="${series.cover}" alt="${series.title}" loading="lazy"> 
              </div> 
              <div class="series-info"> 
                  <h3 class="series-title">${series.title}</h3> 
                  <span class="series-author">Por ${series.author}</span> 
              </div> 
          `; 
 
          card.addEventListener("click", () => { 
              irADetalleSerie(series.id); 
          }); 
 
          if (series.type === "manga") { 
              gridManga.appendChild(card); 
              countManga++; 
          } else { 
              gridOneShot.appendChild(card); 
              countOneShot++; 
          } 
      }); 
 
      if (countManga === 0) { 
          gridManga.innerHTML = `<p style="color: #666; font-size: 1.1rem; text-align: center; grid-column: 1 / -1; margin: 40px 0; font-style: italic;">No hay mangas disponibles por el momento.</p>`; 
      } 
      if (countOneShot === 0) { 
          gridOneShot.innerHTML = `<p style="color: #666; font-size: 1.1rem; text-align: center; grid-column: 1 / -1; margin: 40px 0; font-style: italic;">No hay One Shots disponibles por el momento.</p>`; 
      } 
  } 
 
  function irADetalleSerie(seriesId, scroll = true) { 
      activeSeriesId = seriesId; 
      window.location.hash = `serie=${seriesId}`; 
 
      const series = seriesData[seriesId]; 
      if (!series) return; 
 
      if (DOM.seriesPoster) DOM.seriesPoster.src = obtenerUrlCDN(series.cover); 
      if (DOM.seriesTitle) DOM.seriesTitle.innerText = series.title; 
      if (DOM.seriesAuthor) DOM.seriesAuthor.innerText = `Autor: ${series.author}`; 
      if (DOM.seriesDesc) DOM.seriesDesc.innerText = series.description; 
 
      let labelStatus = ""; 
      let statusClass = series.status || "emision"; 
      if (series.type === "one-shot") { 
          labelStatus = "Terminado"; 
          statusClass = "terminado"; 
      } else { 
          if (statusClass === "emision") labelStatus = "En emisión"; 
          else if (statusClass === "pausa") labelStatus = "En pausa"; 
          else if (statusClass === "terminado") labelStatus = "Terminado"; 
      } 
 
      const metaContainer = document.querySelector("#series-detail-container .series-detail-meta"); 
      if (metaContainer) { 
          const oldBadge = metaContainer.querySelector(".status-badge"); 
          if (oldBadge) oldBadge.remove(); 
 
          const badgeSpan = document.createElement("span"); 
          badgeSpan.className = `status-badge ${statusClass}`; 
          badgeSpan.innerText = labelStatus; 
          metaContainer.appendChild(badgeSpan); 
      } 
 
      const contenedorCapitulos = DOM.chapters; 
      if (!contenedorCapitulos) return;
      contenedorCapitulos.innerHTML = ""; 
 
      listaCapitulosGuardados = series.chapters; 
 
      // PRE-CACHING ENGINE 300% ULTRA-SPEED: Pre-cargar absolutamente todos los capítulos y páginas en paralelo en segundo plano
      if (listaCapitulosGuardados.length > 0) {
          listaCapitulosGuardados.forEach((cap, index) => {
              setTimeout(() => {
                  const cacheKey = cap.uniqueId;
                  if (!API_CACHE[cacheKey]) {
                      const list = [];
                      cap.images.forEach(img => {
                          const url = obtenerUrlCDN(img.download_url);
                          // Forzar almacenamiento en cache del disco y RAM del navegador instantáneamente de forma no bloqueante
                          const preImage = new Image();
                          preloadImgLink(url);
                          preImage.src = url;
                          list.push(img);
                      });
                      API_CACHE[cacheKey] = list;
                  }
              }, index * 100 + 50);
          });
      }

      if (listaCapitulosGuardados.length === 0) { 
          contenedorCapitulos.innerHTML = `<p style="color:#666; font-size:1rem; text-align:center; margin:30px 0;">¡Próximamente nuevos capítulos!</p>`; 
      } else { 
          listaCapitulosGuardados.forEach((cap) => { 
              const card = document.createElement("div"); 
              card.className = "chapter"; 
               
              let tituloCap = ""; 
              if (series.type === "one-shot") { 
                  tituloCap = "Leer One Shot"; 
              } else { 
                  tituloCap = formatearNombreCapitulo(cap.name); 
              } 
 
              card.innerHTML = ` 
              <div class="chapter-header"> 
                  <div class="chapter-left"> 
                      <img class="chapter-thumb" src="${obtenerUrlCDN(cap.images[0].download_url)}"> 
                      <div><h3>${tituloCap}</h3><div class="chapter-views" id="views-${cap.uniqueId}">...</div></div> 
                  </div> 
                  <div>▶</div> 
              </div> 
              `; 
              card.querySelector(".chapter-header").addEventListener("click", () => { 
                  const index = listaCapitulosGuardados.findIndex(c => c.name === cap.name); 
                  window.abrirVisor(index); 
              }); 
              contenedorCapitulos.appendChild(card); 
              API.escucharVisitasCapitulo(cap.uniqueId, card.querySelector(`#views-${cap.uniqueId}`)); 
          }); 
      } 
 
      if (DOM.galleryHome) DOM.galleryHome.style.display = "none"; 
      if (DOM.avisoSection) DOM.avisoSection.style.display = "none"; 
      if (DOM.seriesDetail) DOM.seriesDetail.style.display = "block"; 
 
      if (scroll) { 
          window.scrollTo({ top: 0, behavior: 'smooth' }); 
      } 
  } 
 
  function volverALagaleria() { 
      activeSeriesId = null; 
      history.pushState("", document.title, window.location.pathname + window.location.search); 
      if (DOM.seriesDetail) DOM.seriesDetail.style.display = "none"; 
      if (DOM.galleryHome) DOM.galleryHome.style.display = "block"; 
      if (DOM.avisoSection) DOM.avisoSection.style.display = "block"; 
  } 
 
  function comprobarRutasHash() { 
      const hash = window.location.hash; 
      if (hash.startsWith("#capitulo=")) { 
          const nombreCap = hash.replace("#capitulo=", ""); 
          let serieEncontrada = null; 
          let capIndex = -1; 
 
          for (const sId in seriesData) { 
              const idx = seriesData[sId].chapters.findIndex(c => c.name === nombreCap); 
              if (idx !== -1) { 
                  serieEncontrada = sId; 
                  capIndex = idx; 
                  break; 
              } 
          } 
 
          if (serieEncontrada && capIndex !== -1) { 
              irADetalleSerie(serieEncontrada, false); 
              window.abrirVisor(capIndex); 
          } 
      } else if (hash.startsWith("#serie=")) { 
          const seriesId = hash.replace("#serie=", ""); 
          if (seriesData[seriesId]) { 
              irADetalleSerie(seriesId); 
          } 
      } else { 
          if (DOM.viewerContainer) DOM.viewerContainer.style.display = "none"; 
          document.body.style.overflow = "auto"; 
          if (DOM.seriesDetail) DOM.seriesDetail.style.display = "none"; 
          if (DOM.galleryHome) DOM.galleryHome.style.display = "block"; 
          if (DOM.avisoSection) DOM.avisoSection.style.display = "block"; 
      } 
  } 
 
  window.addEventListener("hashchange", comprobarRutasHash); 
 
  window.abrirVisor = function(index, scrollAComentarios = false) { 
      if (index < 0 || index >= listaCapitulosGuardados.length) return; 
      const capitulo = listaCapitulosGuardados[index]; 
 
      // Evitar doble renderizado si ya está cargado este capítulo (corrige la duplicidad infinita por el trigger de hashchange)
      if (capituloActualCargado === capitulo.uniqueId) return;
      capituloActualCargado = capitulo.uniqueId;
 
      window.cancelReply(); 
      indiceCapituloActual = index; 
      window.location.hash = `capitulo=${capitulo.name}`; 
       
      const activeSeries = seriesData[activeSeriesId]; 
      let tituloFormateado = ""; 
      if (activeSeries && activeSeries.type === "one-shot") { 
          tituloFormateado = activeSeries.title; 
      } else { 
          tituloFormateado = formatearNombreCapitulo(capitulo.name); 
      } 
 
      if (DOM.viewerTitle) DOM.viewerTitle.innerText = tituloFormateado; 
      if (DOM.viewerTitleBottom) DOM.viewerTitleBottom.innerText = tituloFormateado; 
 
      if (DOM.viewerContainer) DOM.viewerContainer.style.display = "block"; 
      document.body.style.overflow = "hidden"; 
 
      const contentDiv = DOM.viewerContent; 
      if (!contentDiv) return;
      contentDiv.innerHTML = "";  
       
      const fragment = document.createDocumentFragment(); 
 
      const crearYAgregarSpinner = (wrapper) => { 
          if (wrapper.querySelector(".loading-spinner")) return; 
 
          const spinner = document.createElement("div"); 
          spinner.className = "loading-spinner"; 
          
          const dotRed = document.createElement("div"); 
          dotRed.className = "dot dot-red"; 
          const dotGreen = document.createElement("div"); 
          dotGreen.className = "dot dot-green"; 
          const dotWhite = document.createElement("div"); 
          dotWhite.className = "dot dot-white"; 
          const dotGold = document.createElement("div"); 
          dotGold.className = "dot dot-gold"; 
           
          spinner.appendChild(dotRed); 
          spinner.appendChild(dotGreen); 
          spinner.appendChild(dotWhite); 
          spinner.appendChild(dotGold); 
          wrapper.appendChild(spinner); 
      }; 
       
      const obsOptions = { 
          root: DOM.viewerContainer, 
          rootMargin: "1200px 0px", 
          threshold: 0.01 
      }; 
       
      const tieneSoporteObserver = typeof IntersectionObserver !== "undefined"; 
      const imgObserver = tieneSoporteObserver ? new IntersectionObserver((entries, observer) => { 
          entries.forEach(entry => { 
              if (entry.isIntersecting) { 
                  const wrapper = entry.target; 
                  const img = wrapper.querySelector("img"); 
                  if (img && img.dataset.src && !img.src) { 
                      crearYAgregarSpinner(wrapper); 
                      img.src = img.dataset.src; 
                      if (typeof img.decode !== "undefined") {
                          img.decode().then(() => {
                              img.classList.add("loaded");
                              const spinner = wrapper.querySelector(".loading-spinner");
                              if (spinner) {
                                  spinner.style.opacity = "0";
                                  setTimeout(() => { if (spinner.parentNode) spinner.remove(); }, 300);
                              }
                          }).catch(() => {});
                      }
                  } 
                  observer.unobserve(wrapper); 
              } 
          }); 
      }, obsOptions) : null; 
 
      // Crear TODOS los contenedores de páginas de forma síncrona para que el scroll esté disponible AL INSTANTE (cero lag y scroll inmediato)
      const totalImages = capitulo.images.length;

      for (let i = 0; i < totalImages; i++) {
          const img = capitulo.images[i];
          const wrapper = document.createElement("div"); 
          wrapper.className = "viewer-page-wrapper"; 
          wrapper.style.aspectRatio = "0.707"; // Inicial hasta que se cargue la imagen real

          const imageElement = document.createElement("img"); 
          imageElement.decoding = "async"; 
          
          let cargada = false;
          const alCargarImagen = () => { 
              if (cargada) return;
              cargada = true;
              imageElement.classList.add("loaded"); 
              const spinner = wrapper.querySelector(".loading-spinner"); 
              if (spinner) { 
                  spinner.style.opacity = "0"; 
                  setTimeout(() => { 
                      if (spinner.parentNode) { 
                          spinner.remove(); 
                      } 
                  }, 300); 
              } 
 
              if (imageElement.naturalWidth && imageElement.naturalHeight) { 
                  const ratio = imageElement.naturalWidth / imageElement.naturalHeight; 
                  wrapper.style.aspectRatio = ratio; 
              } 
          }; 
 
          imageElement.onload = alCargarImagen; 
          imageElement.onerror = () => { 
              const spinner = wrapper.querySelector(".loading-spinner"); 
              if (spinner) { 
                  spinner.style.opacity = "0"; 
                  setTimeout(() => { if (spinner.parentNode) spinner.remove(); }, 300); 
              } 
          }; 
 
          const urlCDN = obtenerUrlCDN(img.download_url); 
 
          if (i < 3) { 
              imageElement.loading = "eager"; 
              imageElement.setAttribute("fetchpriority", "high"); 
              crearYAgregarSpinner(wrapper); 
              imageElement.src = urlCDN; 
              
              // Decodificación asíncrona off-main-thread
              if (typeof imageElement.decode !== "undefined") {
                  imageElement.decode().then(() => {
                      alCargarImagen();
                  }).catch(() => {
                      if (imageElement.complete) alCargarImagen();
                  });
              } else {
                  if (imageElement.complete) alCargarImagen();
              }
          } else { 
              imageElement.loading = "lazy"; 
              if (tieneSoporteObserver) { 
                  imageElement.dataset.src = urlCDN; 
              } else { 
                  crearYAgregarSpinner(wrapper); 
                  imageElement.src = urlCDN; 
                  if (typeof imageElement.decode !== "undefined") {
                      imageElement.decode().then(() => {
                          alCargarImagen();
                      }).catch(() => {
                          if (imageElement.complete) alCargarImagen();
                      });
                  } else {
                      if (imageElement.complete) alCargarImagen();
                  }
              } 
          } 
 
          wrapper.appendChild(imageElement); 
          fragment.appendChild(wrapper);
      }

      // Añadir todo al DOM de una sola vez
      contentDiv.appendChild(fragment);

      const wrappers = contentDiv.querySelectorAll(".viewer-page-wrapper"); 

      // Activar observación por intersección para carga perezosa ultra fluida
      if (tieneSoporteObserver && imgObserver) { 
          wrappers.forEach((wrap, idx) => { 
              if (idx >= 3) { 
                  imgObserver.observe(wrap); 
              } 
          }); 
      }

      // Agregar soporte interactivo de Zoom de alto rendimiento
      wrappers.forEach((wrap) => {
          // Double-click Zoom
          wrap.addEventListener("dblclick", (e) => {
              e.preventDefault();
              wrap.classList.toggle("zoomed");
          });

          // Mobile double-tap Zoom fallback
          let lastTap = 0;
          wrap.addEventListener("touchend", (e) => {
              const currentTime = new Date().getTime();
              const tapLength = currentTime - lastTap;
              if (tapLength < 300 && tapLength > 0) {
                  e.preventDefault();
                  wrap.classList.toggle("zoomed");
              }
              lastTap = currentTime;
          });
      }); 
       
      const esPrimero = indiceCapituloActual === 0; 
      const esUltimo = indiceCapituloActual === listaCapitulosGuardados.length - 1; 
 
      if (DOM.btnPrev) DOM.btnPrev.disabled = esUltimo; 
      if (DOM.btnPrevBottom) DOM.btnPrevBottom.disabled = esUltimo; 
      if (DOM.btnNext) DOM.btnNext.disabled = esPrimero; 
      if (DOM.btnNextBottom) DOM.btnNextBottom.disabled = esPrimero; 
       
      if (DOM.viewerContainer) DOM.viewerContainer.scrollTop = 0; 
      const barraProgreso = document.getElementById("viewer-progress-bar"); 
      if (barraProgreso) { 
          barraProgreso.style.width = "0%"; 
      } 
 
      verificarYBloquearNombre(); 
      API.registrarVisitaCapitulo(capitulo.uniqueId); 
      API.cargarComentariosDelCapitulo(capitulo.uniqueId, DOM.listaComentarios, scrollAComentarios); 
  }; 

  const cerrarVisor = () => { 
      capituloActualCargado = null; // Limpiar id de capitulo activo al cerrar
      if (DOM.viewerContainer) DOM.viewerContainer.style.display = "none"; 
      document.body.style.overflow = "auto"; 
      if (activeSeriesId) { 
          window.location.hash = `serie=${activeSeriesId}`; 
      } else { 
          history.pushState("", document.title, window.location.pathname + window.location.search); 
      } 
  }; 
 
  const irAnterior = () => window.abrirVisor(indiceCapituloActual + 1); 
  const irSiguiente = () => window.abrirVisor(indiceCapituloActual - 1); 

  // --- REGISTRO CENTRALIZADO DE EVENT LISTENERS ---
  function inicializarEventos() {
      if (DOM.formularioComentario) {
          DOM.formularioComentario.addEventListener("submit", (e) => { 
              e.preventDefault(); 
              const cap = listaCapitulosGuardados[indiceCapituloActual]; 
              if (cap && DOM.comentarioNombre && DOM.comentarioTexto) { 
                  const nombreTrimmed = DOM.comentarioNombre.value.trim();
                  const textoTrimmed = DOM.comentarioTexto.value.trim();
                  if (nombreTrimmed && textoTrimmed) {
                      API.intentarPublicarComentario(cap.uniqueId, nombreTrimmed, textoTrimmed); 
                      DOM.comentarioTexto.value = ""; 
                  }
              } 
          });
      }

      const closeBtn = document.getElementById("btn-close");
      if (closeBtn) closeBtn.addEventListener("click", cerrarVisor);

      const closeBottomBtn = document.getElementById("btn-close-bottom");
      if (closeBottomBtn) closeBottomBtn.addEventListener("click", cerrarVisor);

      if (DOM.btnCancelReply) {
          DOM.btnCancelReply.addEventListener("click", window.cancelReply);
      }

      if (DOM.btnPrev) DOM.btnPrev.addEventListener("click", irAnterior);
      if (DOM.btnPrevBottom) DOM.btnPrevBottom.addEventListener("click", irAnterior);
      if (DOM.btnNext) DOM.btnNext.addEventListener("click", irSiguiente);
      if (DOM.btnNextBottom) DOM.btnNextBottom.addEventListener("click", irSiguiente);

      let ultimoScroll = 0; 
      const deltaScroll = 15; 
      if (DOM.viewerContainer) {
          DOM.viewerContainer.addEventListener("scroll", () => { 
              let scrollActual = DOM.viewerContainer.scrollTop; 
              
              // Actualizar barra de progreso de lectura premium 
              const alturaTotal = DOM.viewerContainer.scrollHeight - DOM.viewerContainer.clientHeight; 
              if (alturaTotal > 0) { 
                  const porcentaje = (scrollActual / alturaTotal) * 100; 
                  const barraProgreso = document.getElementById("viewer-progress-bar"); 
                  if (barraProgreso) { 
                      barraProgreso.style.width = `${porcentaje}%`; 
                  } 
              } 
 
              if (Math.abs(ultimoScroll - scrollActual) <= deltaScroll) return; 
               
              if (scrollActual > ultimoScroll && scrollActual > 80) { 
                  if (DOM.barraNav) DOM.barraNav.classList.add("hidden");  
              } else if (scrollActual < ultimoScroll) { 
                  if (DOM.barraNav) DOM.barraNav.classList.remove("hidden"); 
              } 
              ultimoScroll = scrollActual; 
          }, { passive: true });
      }

      // Navegación fluida por teclado
      window.addEventListener("keydown", (e) => { 
          if (!DOM.viewerContainer || DOM.viewerContainer.style.display !== "block") return; 
 
          if (document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA")) { 
              return; 
          } 
 
          const alturaScroll = 250; 
           
          switch (e.key) { 
              case "ArrowDown": 
                  e.preventDefault(); 
                  DOM.viewerContainer.scrollBy({ top: alturaScroll, behavior: "smooth" }); 
                  break; 
              case "ArrowUp": 
                  e.preventDefault(); 
                  DOM.viewerContainer.scrollBy({ top: -alturaScroll, behavior: "smooth" }); 
                  break; 
              case "Space": 
              case " ": 
                  e.preventDefault(); 
                  DOM.viewerContainer.scrollBy({ top: window.innerHeight * 0.75, behavior: "smooth" }); 
                  break; 
              case "PageDown": 
                  e.preventDefault(); 
                  DOM.viewerContainer.scrollBy({ top: window.innerHeight * 0.9, behavior: "smooth" }); 
                  break; 
              case "PageUp": 
                  e.preventDefault(); 
                  DOM.viewerContainer.scrollBy({ top: -window.innerHeight * 0.9, behavior: "smooth" }); 
                  break; 
              case "ArrowLeft": 
                  const esUltimo = indiceCapituloActual === listaCapitulosGuardados.length - 1; 
                  if (!esUltimo) { 
                      e.preventDefault(); 
                      irAnterior(); 
                  } 
                  break; 
              case "ArrowRight": 
                  const esPrimero = indiceCapituloActual === 0; 
                  if (!esPrimero) { 
                      e.preventDefault(); 
                      irSiguiente(); 
                  } 
                  break; 
              case "Escape": 
                  e.preventDefault(); 
                  cerrarVisor(); 
                  break; 
          } 
      });

      // Configuración de los botones de pestañas (Tabs) 
      const tabBtns = document.querySelectorAll(".tab-btn"); 
      tabBtns.forEach(btn => { 
          btn.addEventListener("click", () => { 
              tabBtns.forEach(b => b.classList.remove("active")); 
              btn.classList.add("active"); 
 
              const targetTab = btn.getAttribute("data-tab"); 
              document.querySelectorAll(".gallery-section").forEach(sec => { 
                  sec.classList.remove("active"); 
              }); 
 
              if (targetTab === "manga") { 
                  const secManga = document.getElementById("sec-manga");
                  if (secManga) secManga.classList.add("active"); 
              } else { 
                  const secOneShot = document.getElementById("sec-one-shot");
                  if (secOneShot) secOneShot.classList.add("active"); 
              } 
          }); 
      }); 
 
      if (DOM.btnBackGallery) {
          DOM.btnBackGallery.addEventListener("click", volverALagaleria);
      }
  }
 
  // Ejecutar detección de favicon de forma asíncrona no bloqueante 
  if (typeof requestIdleCallback !== "undefined") { 
      requestIdleCallback(() => API.autoDetectarFavicon()); 
  } else { 
      setTimeout(API.autoDetectarFavicon, 50); 
  } 
 
  window.addEventListener("DOMContentLoaded", () => {
      // Inicializar listener para el botón Back to Top
      const btnBackToTop = document.getElementById("btn-back-to-top");
      if (btnBackToTop) {
          window.addEventListener("scroll", () => {
              if (window.scrollY > 400) {
                  btnBackToTop.classList.add("visible");
              } else {
                  btnBackToTop.classList.remove("visible");
              }
          }, { passive: true });

          btnBackToTop.addEventListener("click", () => {
              window.scrollTo({ top: 0, behavior: "smooth" });
          });
      }

 
      inicializarDOM();
      inicializarEventos();
      API.registrarVisitaInicio(); 
      API.escucharVisitasGlobales(); 
      API.cargarAvisos(); 
      API.inicializarGaleria(); 
  }); 
</script>
