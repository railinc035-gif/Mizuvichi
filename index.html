<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIZUVICHI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    text-align:center;
    padding:30px 15px;
    border-bottom:2px solid #00ffff;
    box-shadow:0 0 20px #00ffff;
}

header h1{
    font-size:3rem;
    color:#fff;
    text-shadow:0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #8a2be2;
}

.section{
    width:95%;
    max-width:1000px;
    margin:25px auto;
}

.info-box{
    border:2px solid #8a2be2;
    box-shadow:0 0 15px #8a2be2;
    border-radius:12px;
    overflow:hidden;
}

.info-box img{
    width:100%;
    display:block;
}

.chapter{
    border:2px solid #00ffff;
    border-radius:12px;
    margin-bottom:20px;
    overflow:hidden;
    box-shadow:0 0 15px #00ffff;
}

.chapter-header{
    padding:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#111;
}

.chapter-header:hover{
    background:#1a1a1a;
}

.chapter-left{
    display:flex;
    gap:15px;
    align-items:center;
}

.chapter-thumb{
    width:70px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.chapter-content{
    display:none;
    padding:10px;
}

.chapter-content img{
    width:100%;
    display:block;
    margin-bottom:10px;
    border-radius:8px;
}

.social{
    text-align:center;
    margin:40px 0;
}

.social a{
    color:white;
    text-decoration:none;
    font-size:1.2rem;
    margin:0 20px;
}
</style>
</head>

<body>

<header>
    <h1>MIZUVICHI</h1>
</header>

<div class="section">
    <h2>📢 ÚLTIMA HORA / INFORMACIÓN</h2>

    <div class="info-box">
        <img src="aviso.png" alt="Aviso">
    </div>
</div>

<div class="section">
    <h2>📖 CAPÍTULOS</h2>
    <div id="chapters"></div>
</div>

<div class="social">
    <a href="#">📺 YouTube</a>
    <a href="#">🎵 TikTok</a>
</div>

<script>

const usuario = "railinc035-gif";
const repo = "Mizuvichi";

const api =
`https://api.github.com/repos/${usuario}/${repo}/contents`;

async function cargarCapitulos(){

    const contenedor =
    document.getElementById("chapters");

    const respuesta =
    await fetch(api);

    const archivos =
    await respuesta.json();

    const capitulos =
    archivos.filter(
        item =>
        item.type === "dir" &&
        item.name.startsWith("Cap_")
    );

    capitulos.sort((a,b)=>
        b.name.localeCompare(a.name)
    );

    for(const cap of capitulos){

        const capApi =
        `${api}/${cap.name}`;

        const capResp =
        await fetch(capApi);

        const paginas =
        await capResp.json();

        const pngs =
        paginas
        .filter(
            p =>
            p.name.toLowerCase().endsWith(".png")
        )
        .sort((a,b)=>
            a.name.localeCompare(
                b.name,
                undefined,
                {numeric:true}
            )
        );

        if(pngs.length === 0) continue;

        const miniatura =
        pngs[0].download_url;

        const card =
        document.createElement("div");

        card.className = "chapter";

        let html = `
        <div class="chapter-header">
            <div class="chapter-left">
                <img class="chapter-thumb"
                src="${miniatura}">
                <div>
                    <h3>${cap.name}</h3>
                </div>
            </div>
            <div>▼</div>
        </div>

        <div class="chapter-content">
        `;

        pngs.forEach(img=>{
            html += `
            <img src="${img.download_url}">
            `;
        });

        html += `
        </div>
        `;

        card.innerHTML = html;

        const header =
        card.querySelector(".chapter-header");

        const contenido =
        card.querySelector(".chapter-content");

        header.addEventListener("click",()=>{

            if(
                contenido.style.display ===
                "block"
            ){
                contenido.style.display = "none";
            }else{
                contenido.style.display = "block";
            }

        });

        contenedor.appendChild(card);
    }
}

cargarCapitulos();

</script>

</body>
</html>
