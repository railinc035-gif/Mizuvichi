name: Notificar Suscriptores

on:
  push:
    branches:
      - main
    paths:
      - 'Cap_**'
      - 'Aviso/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install firebase-admin nodemailer

      - name: Ejecutar script de notificación
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          echo "Contenido del repo (para depuración):"
          ls -la
          echo "Contenido de scripts/:"
          ls -la scripts || true
          FILE=./scripts/notificar_suscriptores.js
          if [ -f "$FILE" ]; then
            echo "Ejecutando: $FILE"
            node "$FILE"
          else
            echo "No se encontró el archivo $FILE"
            exit 1
          fi
