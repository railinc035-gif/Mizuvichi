name: Notificar Suscriptores

on:
  push:
    branches:
      - main
    paths:
      - 'Cap_**'
      - 'Aviso/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install firebase-admin nodemailer

      - name: Ejecutar script de notificación
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          FILE=$(find . -name "notificar_suscriptores.js" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$FILE" ]; then
            echo "Ejecutando: $FILE"
            node "$FILE"
          else
            echo "No se encontró el archivo notificar_suscriptores.js"
            exit 1
          fi
