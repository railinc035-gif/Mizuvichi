name: Notificar Suscriptores

on:
  push:
    branches:
      - main
    paths:
      - 'Cap_**'
      - 'Aviso/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install firebase-admin nodemailer

      - name: Ejecutar script de notificación
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          node -e '
          const admin = require("firebase-admin");
          const fs = require("fs");
          const path = require("path");
          const nodemailer = require("nodemailer");

          if (!process.env.FIREBASE_SERVICE_ACCOUNT_JSON || !process.env.GMAIL_USER || !process.env.GMAIL_PASS) {
            console.error("❌ Faltan Secrets en GitHub (FIREBASE_SERVICE_ACCOUNT_JSON, GMAIL_USER o GMAIL_PASS).");
            process.exit(1);
          }

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: "https://webmanga-7b2cb-default-rtdb.firebaseio.com"
          });

          const db = admin.database();
          const WEBSITE_URL = "https://railinc035-gif.github.io/Mizuvichi/";
          const DELAY_BETWEEN_EMAILS = 800;

          const transporter = nodemailer.createTransport({
            service: "gmail",
            auth: {
              user: process.env.GMAIL_USER,
              pass: process.env.GMAIL_PASS
            }
          });

          function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }

          function obtenerCapitulosDinamico(dir = process.cwd()) {
            let capitulos = [];
            const elementos = fs.readdirSync(dir);
            for (const item of elementos) {
              if (item === "node_modules" || item.startsWith(".")) continue;
              const ruta = path.join(dir, item);
              if (fs.statSync(ruta).isDirectory()) {
                if (item.toLowerCase().startsWith("cap_")) capitulos.push(item);
                else capitulos = capitulos.concat(obtenerCapitulosDinamico(ruta));
              }
            }
            return [...new Set(capitulos)].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
          }

          function obtenerAvisosDinamico(dir = process.cwd()) {
            let avisos = [];
            const elementos = fs.readdirSync(dir);
            for (const item of elementos) {
              if (item === "node_modules" || item.startsWith(".")) continue;
              const ruta = path.join(dir, item);
              if (fs.statSync(ruta).isDirectory()) {
                if (item.toLowerCase().includes("aviso")) {
                  const fotos = fs.readdirSync(ruta).filter(f => [".png", ".jpg", ".jpeg", ".webp"].includes(path.extname(f).toLowerCase()));
                  avisos = avisos.concat(fotos);
                } else {
                  avisos = avisos.concat(obtenerAvisosDinamico(ruta));
                }
              }
            }
            return [...new Set(avisos)].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
          }

          function obtenerCorreos(subscribers) {
            const correos = Object.values(subscribers || {})
              .map(u => u?.email?.trim()?.toLowerCase())
              .filter(e => e && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e));
            return [...new Set(correos)];
          }

          function crearCorreoCapitulo(nombreCapitulo, enlace) {
            return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head><body style="margin: 0; padding: 0; background-color: #0d0e12; font-family: sans-serif; color: #e2e8f0;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #0d0e12; padding: 40px 10px;"><tr><td align="center"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 560px; background-color: #16181e; border-radius: 12px; border: 1px solid #262933; overflow: hidden;"><tr><td align="center" style="padding: 32px; border-bottom: 1px solid #262933; background: #1f222b;"><span style="font-size: 11px; font-weight: 700; letter-spacing: 3px; color: #ff3e3e; text-transform: uppercase;">Oficial</span><h1 style="margin: 6px 0 0 0; font-size: 26px; color: #ffffff;">MIZUVICHI</h1></td></tr><tr><td style="padding: 36px 32px;"><h2 style="margin: 0 0 16px 0; font-size: 22px; color: #ffffff;">¡${nombreCapitulo} ya está disponible!</h2><p style="margin: 0 0 28px 0; font-size: 15px; color: #94a3b8; line-height: 1.6;">La historia continúa. Puedes acceder al capítulo más reciente en Mizuvichi.</p><a href="${enlace}" target="_blank" style="display: inline-block; padding: 14px 28px; background-color: #ff3e3e; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600;">Leer capítulo ahora &rarr;</a></td></tr></table></td></tr></table></body></html>`;
          }

          function crearCorreoAviso() {
            return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head><body style="margin: 0; padding: 0; background-color: #0d0e12; font-family: sans-serif; color: #e2e8f0;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #0d0e12; padding: 40px 10px;"><tr><td align="center"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 560px; background-color: #16181e; border-radius: 12px; border: 1px solid #262933; overflow: hidden;"><tr><td align="center" style="padding: 32px; border-bottom: 1px solid #262933; background: #1f222b;"><span style="font-size: 11px; font-weight: 700; letter-spacing: 3px; color: #10b981; text-transform: uppercase;">Comunicado</span><h1 style="margin: 6px 0 0 0; font-size: 26px; color: #ffffff;">MIZUVICHI</h1></td></tr><tr><td style="padding: 36px 32px;"><h2 style="margin: 0 0 16px 0; font-size: 22px; color: #ffffff;">Nueva actualización del proyecto</h2><p style="margin: 0 0 28px 0; font-size: 15px; color: #94a3b8; line-height: 1.6;">Se ha publicado un nuevo comunicado en la plataforma.</p><a href="${WEBSITE_URL}" target="_blank" style="display: inline-block; padding: 14px 28px; background-color: #10b981; color: #000000; text-decoration: none; border-radius: 8px; font-weight: 600;">Ver aviso oficial &rarr;</a></td></tr></table></td></tr></table></body></html>`;
          }

          async function enviarATodos(emails, asunto, html, texto) {
            let enviados = 0, fallidos = 0;
            for (const email of emails) {
              try {
                await transporter.sendMail({
                  from: `"Mizuvichi" <${process.env.GMAIL_USER}>`,
                  to: email,
                  subject: asunto,
                  text: texto,
                  html: html
                });
                enviados++;
                console.log(`✓ Enviado a ${email}`);
              } catch (e) {
                fallidos++;
                console.error(`✗ Error enviando a ${email}:`, e.message);
              }
              await esperar(DELAY_BETWEEN_EMAILS);
            }
            return { enviados, fallidos };
          }

          async function main() {
            const capitulos = obtenerCapitulosDinamico();
            const avisos = obtenerAvisosDinamico();
            const metaRef = db.ref("metadatos_envios");

            const snapshot = await metaRef.once("value");
            const metadata = snapshot.val() || { capitulos: [], avisos: [] };

            const capitulosAnteriores = Array.isArray(metadata.capitulos) ? metadata.capitulos : [];
            const avisosAnteriores = Array.isArray(metadata.avisos) ? metadata.avisos : [];

            const nuevosCaps = capitulos.filter(c => !capitulosAnteriores.includes(c));
            const nuevosAvisos = avisos.filter(a => !avisosAnteriores.includes(a));

            if (nuevosCaps.length === 0 && nuevosAvisos.length === 0) {
              console.log("No hay contenido nuevo que notificar.");
              return;
            }

            const subsSnapshot = await db.ref("subscriptores").once("value");
            const emails = obtenerCorreos(subsSnapshot.val());

            if (emails.length === 0) {
              console.log("No hay correos registrados en la base de datos.");
              return;
            }

            const capitulosEnviados = [];
            const avisosEnviados = [];

            for (const cap of nuevosCaps) {
              const nombreCap = cap.replace("Cap_", "Capítulo ");
              const enlace = `${WEBSITE_URL}#capitulo=${encodeURIComponent(cap)}`;
              const html = crearCorreoCapitulo(nombreCap, enlace);
              const res = await enviarATodos(emails, `📖 ${nombreCap} ya está disponible - Mizuvichi`, html, `${nombreCap} ya está disponible.\n\nLee el capítulo aquí: ${enlace}`);
              if (res.fallidos === 0) capitulosEnviados.push(cap);
            }

            for (const aviso of nuevosAvisos) {
              const html = crearCorreoAviso();
              const res = await enviarATodos(emails, "📢 Nueva actualización en Mizuvichi", html, `Hay un nuevo aviso oficial en Mizuvichi.\n\nVisita la web: ${WEBSITE_URL}`);
              if (res.fallidos === 0) avisosEnviados.push(aviso);
            }

            await metaRef.set({
              capitulos: [...capitulosAnteriores, ...capitulosEnviados],
              avisos: [...avisosAnteriores, ...avisosEnviados],
              ultimaActualizacion: Date.now()
            });

            console.log(" Proceso completado exitosamente.");
          }

          main().catch(err => {
            console.error(" Error general:", err);
            process.exit(1);
          });
          '
